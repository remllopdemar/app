// ── Desat segur amb escriptures simultànies ──────────────────────────────────
// Cada clau (outings, membres…) es guarda sencera a app_data. Per no trepitjar
// canvis d'altres mòbils, recordem l'última versió llegida del servidor (BASE),
// calculem només el que ha canviat aquest mòbil i ho fusionem amb la versió
// actual del servidor (per id d'element). Si existeix la funció ldm_cas a
// Supabase, l'escriptura és atòmica (només s'aplica si ningú ha escrit entremig);
// si no, es rellegeix just abans d'escriure per reduir la finestra de risc.
const BASE={};            // key -> JSON (string) de l'última versió coneguda del servidor; null = no existeix
let CAS_RPC=true;         // passa a false si la funció ldm_cas no existeix a Supabase
const saveChain={};
const TXN_RETRY="__txn_retry__";
function stableStr(v){
  if(Array.isArray(v))return "["+v.map(stableStr).join(",")+"]";
  if(v&&typeof v==="object")return "{"+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+":"+stableStr(v[k])).join(",")+"}";
  return JSON.stringify(v===undefined?null:v);
}
function rememberBase(key,value){BASE[key]=value===null||value===undefined?null:JSON.stringify(value);}
function itemKey(it){return it&&typeof it==="object"&&it.id!=null?"id:"+it.id:"v:"+stableStr(it);}
// Fusió a tres bandes per elements: aplica a "theirs" el que "mine" ha afegit,
// esborrat o modificat respecte a "base". Si un element l'han modificat tots dos,
// guanya el del servidor i es marca conflicte.
function mergeArrays(base,mine,theirs){
  base=Array.isArray(base)?base:[];mine=Array.isArray(mine)?mine:[];theirs=Array.isArray(theirs)?theirs:[];
  const bMap=new Map(),mMap=new Map(),tMap=new Map();
  base.forEach(x=>{const k=itemKey(x);if(!bMap.has(k))bMap.set(k,x);});
  mine.forEach(x=>{const k=itemKey(x);if(!mMap.has(k))mMap.set(k,x);});
  theirs.forEach(x=>{const k=itemKey(x);if(!tMap.has(k))tMap.set(k,x);});
  let conflict=false;
  const out=theirs.slice();
  const idx=k=>out.findIndex(x=>itemKey(x)===k);
  // Esborrats per mi
  bMap.forEach((b,k)=>{if(!mMap.has(k)){const i=idx(k);if(i>=0)out.splice(i,1);}});
  // Modificats per mi
  mMap.forEach((m,k)=>{
    if(!bMap.has(k))return;
    const ms=stableStr(m),bs=stableStr(bMap.get(k));
    if(ms===bs)return;
    if(!tMap.has(k))return; // l'altre l'ha esborrat
    const ts=stableStr(tMap.get(k));
    if(ts===bs||ts===ms){const i=idx(k);if(i>=0)out[i]=m;}
    else conflict=true;
  });
  // Afegits per mi (respectant l'ordre relatiu de "mine")
  let prevKey=null;
  mine.forEach(m=>{
    const k=itemKey(m);
    if(!bMap.has(k)&&!tMap.has(k)&&idx(k)<0){
      const p=prevKey?idx(prevKey):-1;
      out.splice(p+1,0,m);
    }
    if(idx(k)>=0)prevKey=k;
  });
  return {merged:out,conflict};
}
function setSynced(){S.lastSyncAt=new Date().toISOString();S.syncErr="";}
function setSyncError(key,error){
  S.syncErr=error?.message||"Error de sincronització";
  console.warn("⚠️ Supabase save error ["+key+"]:",S.syncErr);
}
async function remoteWrite(key,mine,baseStr){
  const dbKey="ldm:"+key;
  const base=baseStr==null?null:JSON.parse(baseStr);
  let expected=base, toWrite=mine, conflict=false;
  for(let attempt=0;attempt<12;attempt++){
    if(CAS_RPC){
      const {data,error}=await supa.rpc("ldm_cas",{p_key:dbKey,p_expected:expected,p_new:toWrite});
      if(error){
        if(error.code==="PGRST202"||/ldm_cas/.test(error.message||"")&&/not find|does not exist/i.test(error.message||"")){
          console.warn("ℹ️ ldm_cas no instal·lada a Supabase: desat sense bloqueig atòmic.");
          CAS_RPC=false;continue;
        }
        return {error};
      }
      if(data&&data.ok)return {written:toWrite,conflict};
      const theirs=data?data.value:null;
      const r=mergeArrays(base,mine,theirs);
      conflict=conflict||r.conflict;
      expected=theirs;toWrite=r.merged;
      await new Promise(res=>setTimeout(res,60+Math.random()*140));
    }else{
      const {data,error}=await supa.from("app_data").select("value").eq("key",dbKey).maybeSingle();
      if(error)return {error};
      const theirs=data?data.value:null;
      if(stableStr(theirs)!==stableStr(base)){
        const r=mergeArrays(base,mine,theirs);
        conflict=conflict||r.conflict;toWrite=r.merged;
      }
      const {error:e2}=await supa.from("app_data").upsert({key:dbKey,value:toWrite},{onConflict:"key"});
      if(e2)return {error:e2};
      return {written:toWrite,conflict};
    }
  }
  return {busy:true};
}
// Fotografia del canvi local (què volem desar i sobre quina versió del servidor),
// presa just després de modificar, abans que Realtime pugui substituir S[key].
function captureSave(key){
  store.set("ldm:"+key,S[key]);
  return {key,mineStr:JSON.stringify(S[key]??null),baseStr:BASE[key]};
}
function save(key,cap=null){
  const {mineStr,baseStr}=cap||captureSave(key);
  const prev=saveChain[key]||Promise.resolve();
  const run=prev.catch(()=>{}).then(async()=>{
    if(baseStr===undefined){
      // Encara no hem llegit mai aquesta clau del servidor: no podem saber què ha canviat.
      console.warn("⚠️ Desat remot ajornat ["+key+"]: encara no hi ha dades del servidor.");
      return {error:null,skipped:true};
    }
    const mine=JSON.parse(mineStr);
    // Si el servidor ja té exactament el que volem desar, no cal escriure.
    if(BASE[key]!==undefined&&stableStr(mine)===stableStr(BASE[key]==null?null:JSON.parse(BASE[key]))){setSynced();return {error:null};}
    try{
      const r=await remoteWrite(key,mine,baseStr);
      if(r.busy){console.warn("⚠️ Massa canvis simultanis ["+key+"]");return {error:null,conflict:true};}
      if(r.error){setSyncError(key,r.error);return {error:r.error};}
      rememberBase(key,r.written);
      // Si mentrestant no hi ha hagut altres canvis locals, mostrem la versió fusionada.
      if(JSON.stringify(S[key]??null)===mineStr&&stableStr(r.written)!==stableStr(mine)){
        S[key]=r.written;store.set("ldm:"+key,S[key]);
        if(key==="membres")normalizeAllMemberSections();
        if(key==="outings")normalizeAllOutingEntries();
        render();
      }
      setSynced();
      return {error:null,conflict:!!r.conflict};
    }catch(error){
      S.syncErr=error?.message||"Sense connexió";
      console.warn("⚠️ Supabase save exception ["+key+"]:",S.syncErr);
      return {error};
    }
  });
  saveChain[key]=run;
  return run;
}
async function saveMany(keys){
  let conflict=false;
  const caps=keys.map(captureSave);
  for(const c of caps){const r=await save(c.key,c);if(r?.conflict)conflict=true;}
  if(conflict)showToast("info","Algú altre ha fet canvis alhora. S'han conservat els dos; revisa que tot sigui correcte.");

// Desa sortides + avisos d'una acció d'inscripció. Si algú ha modificat la mateixa
// sortida alhora, retorna TXN_RETRY perquè l'acció es torni a fer sobre dades fresques.

async function outingTxn(fn){
  for(let attempt=0;attempt<10;attempt++){
    const r=await fn();
    if(r!==TXN_RETRY)return r;
    await new Promise(res=>setTimeout(res,(150+Math.random()*350)*Math.min(attempt+1,4)));

function applySupabaseRows(data,{renderNow=false,keys=null}={}){
  if(!Array.isArray(data))return false;
  const map={};
  data.forEach(r=>{map[r.key]=r.value;});
  (keys||SUPA_KEYS).forEach(k=>{
    if(Object.prototype.hasOwnProperty.call(map,"ldm:"+k))rememberBase(k,map["ldm:"+k]);
    else BASE[k]=null;
  });
  if(!data.length)return false;
  let changed=false;
  SUPA_KEYS.forEach(k=>{
    if(Object.prototype.hasOwnProperty.call(map,"ldm:"+k)){
      S[k]=map["ldm:"+k]??DEF[k]??[];
      if(k==="groups")S[k]=normGroups(S[k]);
      store.set("ldm:"+k,S[k]);
      changed=true;
    }
  });
  if(changed){
    S.lastSyncAt=new Date().toISOString();
    S.syncErr="";
    normalizeAllMemberSections();
    normalizeAllOutingEntries();
    if(renderNow)render();
  }
  return changed;
}
async function refreshKeysFromSupabase(keys=SUPA_KEYS,{renderNow=false,silent=true}={}){
  if(!silent){S.supaSyncing=true;S.syncErr="";render();}
  try{
    const {data,error}=await supa.from("app_data").select("key,value").in("key",keys.map(k=>"ldm:"+k));
    if(error)throw error;
    const changed=applySupabaseRows(data,{renderNow:false,keys});
    if(!silent)render();else if(renderNow)bgRender();
    return changed;
  }catch(e){
    S.syncErr=e?.message||"No s'ha pogut sincronitzar";
    console.warn("⚠️ Error sincronitzant Supabase:",S.syncErr);
    if(!silent)render();else if(renderNow)bgRender();
    return false;
  }finally{
    if(!silent){S.supaSyncing=false;render();}
  }
}
async function refreshFromSupabase(opts={}){
  return refreshKeysFromSupabase(SUPA_KEYS,opts);
}

function fetchMeteo(){
  const meteoUrl="https://api.open-meteo.com/v1/forecast?latitude=41.7833&longitude=3.0167&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code,precipitation&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_sum&timezone=Europe%2FMadrid&forecast_days=7";
  const marineUrl="https://marine-api.open-meteo.com/v1/marine?latitude=41.7833&longitude=3.0167&hourly=wave_height,wave_direction,wave_period,wind_wave_height,wind_wave_direction,swell_wave_height,swell_wave_direction,swell_wave_period&timezone=Europe%2FMadrid&forecast_days=7&cell_selection=sea";
  S.meteoLoading=true;S.marineLoading=true;
  Promise.allSettled([
    fetch(meteoUrl).then(r=>{if(!r.ok)throw new Error("meteo");return r.json();}),
    fetch(marineUrl).then(r=>{if(!r.ok)throw new Error("marine");return r.json();})
  ]).then(([meteo,marine])=>{
    if(meteo.status==="fulfilled")S.meteo=meteo.value;
    if(marine.status==="fulfilled")S.marine=marine.value;
    S.meteoLoading=false;S.marineLoading=false;
    if(!S.selectedMeteoDate&&S.meteo?.daily?.time?.length)S.selectedMeteoDate=firstRegularOutingDate(S.meteo.daily.time);
    render();
  }).catch(()=>{S.meteoLoading=false;S.marineLoading=false;render();});
}

function memberFromEntry(e){
  if(!e)return null;
  return S.membres.find(m=>e.mid&&m.id===e.mid)||S.membres.find(m=>m.name===e.name&&m.groupId===e.gid)||S.membres.find(m=>m.name===e.name)||null;
}
function entryKey(e){
  const m=memberFromEntry(e);
  if(m?.id)return "id:"+m.id;
  return "name:"+String(e?.name||"").trim().toLowerCase();
}
function entryMatchesCurrent(e){
  if(!e||!S.userName)return false;
  if(S.memberId&&e.mid)return Number(e.mid)===Number(S.memberId);
  const m=memberFromEntry(e);
  if(S.memberId&&m?.id)return Number(m.id)===Number(S.memberId);
  return String(e.name||"")===String(S.userName||"");
}
function entryMatchesPerson(e,name,gid,mid=null){
  if(!e||!name)return false;
  if(mid&&e.mid)return Number(e.mid)===Number(mid);
  const m=memberFromEntry(e);
  if(mid&&m?.id)return Number(m.id)===Number(mid);
  return String(e.name||"")===String(name||"");
}
function entrySamePerson(a,b){
  if(!a||!b)return false;
  const ak=entryKey(a),bk=entryKey(b);
  return ak&&bk&&ak===bk;
}
function normalizeOutingEntries(o){
  if(!o)return false;
  let changed=false;
  if(!Array.isArray(o.signups)){o.signups=[];changed=true;}
  if(!Array.isArray(o.waitlist)){o.waitlist=[];changed=true;}
  if(!Array.isArray(o.helmsmanSignups)){o.helmsmanSignups=[];changed=true;}
  if(!Array.isArray(o.noAttend)){o.noAttend=[];changed=true;}
  // Migra sortides antigues sense camps de timonel/reserva
  if(o.helmsmen===undefined||o.helmsmen===null){
    const cfg=outingCfgOf(o);
    if(cfg){o.helmsmen=cfg.helmsmen;o.helmsmanRequired=cfg.helmsmanRequired;o.reserve=cfg.reserve;if(!o.capacity||o.capacity<cfg.capacity)o.capacity=cfg.capacity;}
    else{o.helmsmen=0;o.helmsmanRequired=false;o.reserve=1;}
    changed=true;
  }
  const clean=list=>{
    const seen=new Set(),out=[];
    list.forEach(e=>{
      if(!e||!e.name)return;
      const m=memberFromEntry(e);
      const n={...e};
      if(m){
        if(!n.mid){n.mid=m.id;changed=true;}
        if(!n.gid){n.gid=m.groupId;changed=true;}
      }
      const k=entryKey(n);
      if(seen.has(k)){changed=true;return;}
      seen.add(k);out.push(n);
    });
    return out;
  };
  const signups=clean(o.signups);
  const waitlist=clean(o.waitlist).filter(w=>{
    const dup=signups.some(s=>entrySamePerson(s,w));
    if(dup)changed=true;
    return !dup;
  });
  const helmsmanSignups=clean(o.helmsmanSignups);
  const active=[...signups,...waitlist,...helmsmanSignups];
  const noAttend=clean(o.noAttend).filter(e=>{
    const invalid=isGeneralOuting(o)||Number(e.gid||memberFromEntry(e)?.groupId||0)!==Number(o.groupId||0);
    const activeAlready=active.some(a=>entrySamePerson(a,e));
    if(invalid||activeAlready)changed=true;
    return !invalid&&!activeAlready;
  });
  if(signups.length!==o.signups.length||waitlist.length!==o.waitlist.length||helmsmanSignups.length!==o.helmsmanSignups.length||noAttend.length!==o.noAttend.length)changed=true;
  o.signups=signups;o.waitlist=waitlist;o.helmsmanSignups=helmsmanSignups;o.noAttend=noAttend;
  if(normalizeReserveSlots(o))changed=true;
  return changed;
}
function normalizeAllOutingEntries(){
  let changed=false;
  S.outings.forEach(o=>{if(normalizeOutingEntries(o))changed=true;});
  return changed;
}

function outingDisplayTitle(o){

  // Les sortides setmanals per grup es mostren amb el nom del grup (Grup A, Grup C...),

function attendancePeople(o){

function ensureAttendance(o){
  if(!o.attendance)o.attendance={closed:false,status:{},updatedAt:null,closedAt:null,by:null};

function canManageAttendance(o){

// Llistes pendents de passar que són responsabilitat directa del cap (o cap de generals).
// Només les dels últims 14 dies, perquè l'avís no quedi encès per sortides molt antigues.
function capPendingAttendanceOutings(){
  const me=currentMember();
  if(!(S.role==="cap"||memberIsGeneralCap(me)))return [];
  const since=isoDate(new Date(Date.now()-14*864e5));
  return S.outings.filter(o=>{
    if(!isPastOuting(o)||o.attendance?.closed||(o.date||"")<since||!attendancePeople(o).length)return false;
    const own=S.role==="cap"&&Number(S.capGroupId)===Number(o.groupId);
    const gen=memberIsGeneralCap(me)&&isGeneralOuting(o);

  });
}

function attendanceCounts(o){
  const att=ensureAttendance(o),people=attendancePeople(o);
  const c={present:0,absent:0,excused:0,total:people.length,closed:!!att.closed};
  people.forEach(p=>{const st=att.status?.[p.attKey]||"present";if(st==="absent")c.absent++;else if(st==="excused")c.excused++;else c.present++;});

function setAllAttendance(oid,status){

  const o=S.outings.find(x=>String(x.id)===String(oid));if(!o||!canManageAttendance(o))return;
  const att=ensureAttendance(o);attendancePeople(o).forEach(p=>{att.status[p.attKey]=status;});

  save("outings");showToast("ok",`Assistència actualitzada: ${attendanceStatusLabel(status)}.`);

function markAttendance(oid,key,status){
  if(!canWriteNow())return;
  const o=S.outings.find(x=>String(x.id)===String(oid));if(!o||!canManageAttendance(o))return;
  const att=ensureAttendance(o);att.status[key]=status;att.updatedAt=nowIso();att.by=actorLabel();
  save("outings");showToast("ok",`Assistència marcada: ${attendanceStatusLabel(status)}.`);

function closeAttendance(oid){
  if(!canWriteNow())return;
  const o=S.outings.find(x=>String(x.id)===String(oid));if(!o||!canManageAttendance(o))return;
  const att=ensureAttendance(o);attendancePeople(o).forEach(p=>{if(!att.status[p.attKey])att.status[p.attKey]="present";});
  att.closed=true;att.closedAt=nowIso();att.updatedAt=nowIso();att.by=actorLabel();
  addOutingLog(o,"attendance_closed",`${actorLabel()} tanca l'assistència de ${outingLabel(o)}.`);

function reopenAttendance(oid){

  const o=S.outings.find(x=>String(x.id)===String(oid));if(!o||!canManageAttendance(o))return;
  const att=ensureAttendance(o);att.closed=false;att.updatedAt=nowIso();att.by=actorLabel();
  addOutingLog(o,"attendance_reopened",`${actorLabel()} reobre l'assistència de ${outingLabel(o)}.`);

function canSeeAvis(a){
  const kind=a.kind||"public";
  if(S.role==="patron")return true;
  if(kind==="public"){
    const audience=avisoAudience(a);
    if(audience==="general")return true;
    if(audience==="group")return userInGroup(a.groupId);
    return safeArr(S.userSections).includes(audience);
  }
  if(kind==="log")return S.role==="cap"&&S.capGroupId===a.groupId;
  if(kind==="personal")return (a.toMemberId&&a.toMemberId===S.memberId)||(!a.toMemberId&&a.toName===S.userName&&a.toGid===S.userGroupId);

function outingStartDateTime(o){
  const [y,mo,d]=String(o?.date||"").split("-").map(Number);
  if(!y||!mo||!d)return null;
  const [hh,mm]=normalizeTimeStr(o?.time||GROUP_TIMES?.[o?.groupId]||"00:00").split(":").map(Number);
  return new Date(y,mo-1,d,Number.isFinite(hh)?hh:0,Number.isFinite(mm)?mm:0,0,0);
}
function outingPastDateTime(o){
  const start=outingStartDateTime(o);
  if(!start)return null;
  const end=new Date(start);
  end.setMinutes(end.getMinutes()+15);
  return end;
}
function isPastOuting(o){
  const pastAt=outingPastDateTime(o);
  if(!pastAt)return (o.date||"")<todayStr();
  return new Date()>=pastAt;
}
function sortOutings(a,b){return (a.date||"").localeCompare(b.date||"")||(a.time||"").localeCompare(b.time||"");}

function personalOutingState(o){

  const amHelm=safeArr(o.helmsmanSignups).some(entryMatchesCurrent);
  const signup=safeArr(o.signups).find(entryMatchesCurrent);
  const waitIdx=safeArr(o.waitlist).findIndex(entryMatchesCurrent);
  const cannotAttend=safeArr(o.noAttend).some(entryMatchesCurrent);
  if(amHelm)return {text:"Estàs apuntat com a timonel",icon:"⛵",bg:"#e6f4ee",col:GREEN,active:true};
  if(signup?.isReserve)return {text:"Estàs en reserva",icon:"🤎",bg:"#fff5ec",col:"#8b4513",active:true};
  if(signup)return {text:"Estàs apuntat com a vogador",icon:"✅",bg:"#e6f4ee",col:GREEN,active:true};
  if(waitIdx>=0)return {text:`Estàs en llista d'espera · posició ${waitIdx+1}`,icon:"⏳",bg:"#fff8ee",col:"#b07a10",active:true};
  if(cannotAttend)return {text:"Has indicat que no pots venir",icon:"❌",bg:"#fff0f0",col:RED,active:true};

      ${isFirst?`<div style="background:rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:16px;color:rgba(255,255,255,.55);line-height:1.5;text-align:center">Primera vegada al dispositiu.<br>Crea la teva clau d'accés personal (mínim 6 caràcters).</div>`:""}

      <div style="color:#fff;font-size:22px;font-weight:700;text-align:center;margin-bottom:18px">Crear compte nou</div>

      <select id="reg-grup" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(27,58,122,.9);color:#fff;font-size:18px;outline:none;box-sizing:border-box;margin-bottom:10px">${grpOpts}</select>

        <div style="font-size:15px;color:rgba(255,255,255,.5);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em">Seccions *</div>
        <div style="display:flex;gap:8px">${secBtn("competicio","🏆 Competició")}${secBtn("social","⚓ Social")}</div>
      </div>
      ${pinInp("reg-pin","Crea la teva clau (mínim 6 car.) *")}
      ${pinInp("reg-pin2","Confirma la clau *")}
      ${errDiv(S.regErr)}
      ${btnP("ENVIAR SOL·LICITUD","submitRegister()")}
      ${btnT("Enrere","go({loginStep:'choose'})")}
      <div style="color:rgba(255,255,255,.3);font-size:15px;text-align:center;margin-top:8px">El patró haurà d'aprovar el teu compte</div>
    </div>`);
  }

  // ── CONFIRMACIÓ DE REGISTRE ───────────────────────────────────────────────
  if(S.loginStep==="register-ok")return wrap(`<div style="width:100%;max-width:300px;text-align:center">
    <div style="font-size:56px;margin-bottom:16px">✅</div>
    <div style="color:#fff;font-size:24px;font-weight:700;margin-bottom:10px">Sol·licitud enviada!</div>
    <div style="color:rgba(255,255,255,.5);font-size:18px;margin-bottom:28px;line-height:1.6">El patró rebrà la teva petició i t'avisarà quan el compte estigui aprovat.</div>

  </div>`);

  return wrap("");
}

// ── Funcions d'autenticació ────────────────────────────────────────────────────
async function tryPin(){
  const v=document.getElementById("pin-in")?.value||"";
  try{
    if(await hashPatronPin(v)===PATRON_HASH){
      store.set("ldm:session",{role:"patron",authVersion:SECURITY_VERSION});
      go({role:"patron",loginStep:"choose",pinErr:false,pinErrMsg:""});
    } else {
      go({pinErr:true,pinErrMsg:"Codi incorrecte"});
    }
  }catch(e){
    go({pinErr:true,pinErrMsg:e.message||"No s'ha pogut validar la clau"});
  }
}

// Normalitza noms per comparar: sense accents, majúscules ni espais repetits.
function normLoginName(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9ñç ]/g," ").replace(/\s+/g," ").trim();}

// Entrada de soci: si el dispositiu recorda l'últim soci, va directe a la seva clau.
function startSociLogin(){
  const lastId=store.get("ldm:lastMember");
  const m=lastId?S.membres.find(x=>x.id===lastId&&!x.pending):null;
  if(m)return go({selectedMemberId:m.id,loginStep:"soci-pin",pinErr:false,pinErrMsg:""});
  go({loginStep:"soci-name",selectedMemberId:null,pinErr:false,pinErrMsg:""});
}

function forgetLastSoci(){
  store.set("ldm:lastMember",null);
  go({loginStep:"soci-name",selectedMemberId:null,loginName:"",pinErr:false,pinErrMsg:""});
}

async function trySociName(){
  const name=cleanName(document.getElementById("soci-nom")?.value||"");
  const pin=document.getElementById("pin-in")?.value||"";
  const key=normLoginName(name);
  const fail=msg=>go({loginName:name,pinErr:true,pinErrMsg:msg||"Nom o clau incorrecta"});
  if(!key)return fail("Escriu el teu nom");
  const cands=S.membres.filter(m=>normLoginName(m.name)===key);
  if(!cands.length)return fail();
  try{
    // Primer accés: el soci encara no té clau i la crea a la pantalla següent.
    const noPin=cands.filter(m=>!m.pending&&!m.pin);
    if(!pin){
      if(noPin.length===1)return go({selectedMemberId:noPin[0].id,loginStep:"soci-pin",loginName:"",pinErr:false,pinErrMsg:""});
      return fail("Escriu la teva clau");
    }
    for(const m of cands){
      if(m.pin&&await memberPinMatches(m,pin)){
        if(m.pending)return fail("El teu compte encara està pendent d'aprovació del patró");
        return doLoginSoci(m);
      }
    }
    fail();
  }catch(e){
    fail(e.message||"No s'ha pogut validar la clau");
  }
}

async function tryLoginSoci(){
  const m=S.membres.find(x=>x.id===S.selectedMemberId);
  if(!m)return;
  const pin=document.getElementById("pin-in")?.value||"";
  try{
    if(!m.pin){
      // Primera vegada: creació de clau. Es guarda sempre en hash, mai en text pla.
      const pin2=document.getElementById("pin-in2")?.value||"";
      if(pin.length<MIN_PIN_LEN)return go({pinErr:true,pinErrMsg:`La clau ha de tenir mínim ${MIN_PIN_LEN} caràcters`});
      if(pin!==pin2)return go({pinErr:true,pinErrMsg:"Les claus no coincideixen"});
      m.pin=await hashMemberPin(pin,m);
      save("membres");
    } else {
      if(!(await memberPinMatches(m,pin)))return go({pinErr:true,pinErrMsg:"Clau incorrecta"});
    }
    doLoginSoci(m);
  }catch(e){
    go({pinErr:true,pinErrMsg:e.message||"No s'ha pogut validar la clau"});
  }
}

function doLoginSoci(m){
  m.sections=normalizeSections(m.sections);
  store.set("ldm:lastMember",m.id);
  const role=m.isCap?"cap":"soci";
  store.set("ldm:session",{role,memberId:m.id,pinHash:m.pin,authVersion:SECURITY_VERSION});
  go({role,capGroupId:m.isCap?m.groupId:null,memberId:m.id,userName:m.name,
      userGroupId:m.groupId,userSections:m.sections,loginStep:"choose",
      pinErr:false,pinErrMsg:"",loginName:"",section:m.sections.includes("competicio")?"competicio":"social"});
}

function togRegSec(sec){
  const next=S.regSections.includes(sec)?S.regSections.filter(x=>x!==sec):[...S.regSections,sec];
  go({regSections:normalizeSections(next)});
}

async function submitRegister(){
  const nom=cleanName(document.getElementById("reg-nom")?.value||"");
  const gid=parseInt(document.getElementById("reg-grup")?.value)||S.groups[0]?.id;
  const pin=document.getElementById("reg-pin")?.value||"";
  const pin2=document.getElementById("reg-pin2")?.value||"";
  if(!nom)return go({regErr:"El nom és obligatori"});
  if(!S.regSections.length)return go({regErr:"Selecciona almenys una secció"});
  if(pin.length<MIN_PIN_LEN)return go({regErr:`La clau ha de tenir mínim ${MIN_PIN_LEN} caràcters`});
  if(pin!==pin2)return go({regErr:"Les claus no coincideixen"});
  try{
    const member={id:Date.now(),name:nom,groupId:gid,sections:normalizeSections(S.regSections),pin:null,isCap:false,pending:true};
    member.pin=await hashMemberPin(pin,member);
    S.membres.push(member);
    save("membres");
    go({loginStep:"register-ok"});
  }catch(e){
    go({regErr:e.message||"No s'ha pogut crear la clau"});
  }
}

// ── Accions del panell de membres ──────────────────────────────────────────────
function approvePending(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m){m.sections=normalizeSections(m.sections);m.pending=false;save("membres");render();}}
function rejectPending(id){if(S.role!=="patron")return;if(!confirm("Rebutjar la sol·licitud?"))return;S.membres=S.membres.filter(m=>m.id!==id);save("membres");render();}
function resetMemberPin(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m&&confirm("Reset de clau de "+m.name+"?\nHaurà de crear una nova clau al proper accés.")){m.pin=null;save("membres");render();}}
function toggleIsCap(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m){m.isCap=!m.isCap;save("membres");render();}}
function toggleIsGeneralCap(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m){m.isGeneralCap=!memberIsGeneralCap(m);delete m.isCapGenerals;save("membres");render();}}

// ── Helpers de UI ─────────────────────────────────────────────────────────────
function num(v,d=1){return Number.isFinite(Number(v))?Number(v).toFixed(d).replace(".0",""):"—";}
function firstVal(...vals){for(const v of vals){if(v!==undefined&&v!==null&&!Number.isNaN(Number(v)))return v;}return null;}
function weatherCodeFrom(obj){return firstVal(obj?.weather_code,obj?.weathercode);}
function meteoHourlyIndex(data,date,time){
  const times=data?.hourly?.time||[];
  const wanted=`${date}T${time}`;
  let idx=times.indexOf(wanted);
  if(idx>=0)return idx;
  let best=-1,bestDiff=9999;
  const [th,tm]=(time||"00:00").split(":").map(Number);
  const target=(th||0)*60+(tm||0);
  times.forEach((t,i)=>{
    if(!String(t).startsWith(date+"T"))return;
    const hh=Number(t.slice(11,13)),mm=Number(t.slice(14,16));
    const diff=Math.abs((hh*60+mm)-target);
    if(diff<bestDiff){best=i;bestDiff=diff;}
  });
  return best;
}
function seaStateLabel(h){
  const v=Number(h);
  if(!Number.isFinite(v))return "Mar no disponible";
  if(v>=1)return "Mar moguda";
  if(v>=0.6)return "Mar moderada";
  return "Mar tranquil·la";
}
function isRegularOutingDay(ds){
  const dow=parseLocalDate(ds)?.getDay();
  return dow===1||dow===3||dow===5; // dilluns, dimecres i divendres
}
function firstRegularOutingDate(days){
  return (days||[]).find(isRegularOutingDay)||(days||[])[0]||td();
}
function renderMeteo(){
  if(S.meteoLoading&&!S.meteo)return`<div style="background:${DARK};border-radius:14px;margin:10px 14px 0;padding:16px;color:rgba(255,255,255,.5);font-size:17px">Carregant meteo del port...</div>`;
  if(!S.meteo)return`<div style="background:${DARK};border-radius:14px;margin:10px 14px 0;padding:16px;color:rgba(255,255,255,.5);font-size:17px">Meteo no disponible</div>`;

  const m=S.meteo;
  const availableDays=(m.daily?.time||[]).slice(0,7);
  const outingDays=availableDays.filter(isRegularOutingDay);
  const dayList=outingDays.length?outingDays:availableDays.slice(0,5);
  let sel=S.selectedMeteoDate||firstRegularOutingDate(availableDays);
  if(dayList.length&&!dayList.includes(sel))sel=dayList[0];

  const windState=v=>{
    const n=Number(v);
    if(!Number.isFinite(n))return "—";
    if(n>=20)return "Molt fort";
    if(n>=15)return "Fort";
    if(n>=10)return "Moderat";
    return "Fluix";
  };
  const riskBg=warn=>warn?"rgba(255,107,107,.14)":"rgba(255,255,255,.075)";
  const riskBorder=warn=>warn?"rgba(255,107,107,.36)":"rgba(255,255,255,.1)";
  const riskColor=warn=>warn?"#ffb4b4":"#fff";

  const curCode=weatherCodeFrom(m.current);
  const curKn=Math.round((m.current?.wind_speed_10m||0)*.539957);
  const curDir=wDir(m.current?.wind_direction_10m||0);
  const selIndex=availableDays.indexOf(sel);
  const max=selIndex>=0?m.daily?.temperature_2m_max?.[selIndex]:null;
  const min=selIndex>=0?m.daily?.temperature_2m_min?.[selIndex]:null;
  const rainDay=selIndex>=0?m.daily?.precipitation_sum?.[selIndex]:null;
  const dayButtons=dayList.map((d,i)=>{
    const dy=parseLocalDate(d)||new Date(d);
    const idx=availableDays.indexOf(d);
    const isSel=d===sel;
    const maxDay=idx>=0?m.daily?.temperature_2m_max?.[idx]:null;
    const code=weatherCodeFrom({weather_code:idx>=0?m.daily?.weather_code?.[idx]:null,weathercode:idx>=0?m.daily?.weathercode?.[idx]:null});
    const label=d===td()?"Avui":DAYS[dy.getDay()];
    return`<button onclick="go({selectedMeteoDate:'${d}',meteoHoursOpen:false})" style="flex:1;text-align:center;font-size:14px;color:${isSel?'#fff':'rgba(255,255,255,.62)'};background:${isSel?'rgba(255,255,255,.16)':'transparent'};border:${isSel?'1px solid rgba(255,255,255,.28)':'1px solid transparent'};border-radius:9px;padding:6px 3px;cursor:pointer"><div style="font-weight:800;margin-bottom:2px">${label}</div><div style="font-size:19px;line-height:1">${wIcon(code)}</div><div style="font-size:15px;font-weight:700;margin-top:2px">${maxDay!==null&&maxDay!==undefined?Math.round(maxDay)+'°':'—'}</div></button>`;
  }).join("");

  const hourSlots=["08:00","11:00","14:00","17:00","20:00"];
  const slotData=hourSlots.map(t=>{
    const wi=meteoHourlyIndex(m,sel,t),mi=meteoHourlyIndex(S.marine,sel,t);
    const h=m.hourly||{},mh=S.marine?.hourly||{};
    const temp=wi>=0?h.temperature_2m?.[wi]:null;
    const wkn=wi>=0?Math.round((h.wind_speed_10m?.[wi]||0)*.539957):null;
    const wdeg=wi>=0?h.wind_direction_10m?.[wi]:null;
    const code=wi>=0?firstVal(h.weather_code?.[wi],h.weathercode?.[wi]):null;
    const rain=wi>=0?h.precipitation?.[wi]:null;
    const wh=mi>=0?mh.wave_height?.[mi]:null;
    const wdir=mi>=0?mh.wave_direction?.[mi]:null;
    const wp=mi>=0?mh.wave_period?.[mi]:null;
    return {t,temp,wkn,wdeg,code,rain,wh,wdir,wp};
  });
  const bestWind=slotData.reduce((best,x)=>Number(x.wkn)>Number(best?.wkn??-1)?x:best,null);
  const bestWave=slotData.reduce((best,x)=>Number(x.wh)>Number(best?.wh??-1)?x:best,null);
  const maxWind=Number(bestWind?.wkn);
  const maxWave=Number(bestWave?.wh);
  const windWarn=Number.isFinite(maxWind)&&maxWind>=15;
  const seaWarn=Number.isFinite(maxWave)&&maxWave>=0.8;
  const strong=curKn>=15||windWarn||seaWarn;

  const rows=slotData.map(x=>{
    const warn=(Number(x.wkn)>=15)||(Number(x.wh)>=0.8);
    return`<div style="display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;background:${riskBg(warn)};border:1px solid ${riskBorder(warn)};border-radius:10px;padding:7px 8px;margin-top:6px;font-size:16px;color:rgba(255,255,255,.82);line-height:1.25">
      <div style="font-weight:850;color:#fff;flex-shrink:0">${x.t.slice(0,2)}h</div>
      <div style="min-width:0">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;color:${riskColor(warn)};font-weight:850"><span>💨 ${x.wkn!==null&&x.wkn!==undefined?x.wkn+' kn':'—'} ${x.wdeg!==null?wDir(x.wdeg):''}</span><span>🌊 ${x.wh!==null&&x.wh!==undefined?num(x.wh,1)+' m':'—'} ${x.wdir!==null?compassDir(x.wdir):''}</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;color:rgba(255,255,255,.58);font-size:15px"><span>${wIcon(x.code)} ${x.temp!==null&&x.temp!==undefined?Math.round(x.temp)+'°':'—'}${x.rain!==null&&x.rain!==undefined&&Number(x.rain)>0?` · 🌧️ ${num(x.rain,1)} mm`:''}</span><span>${x.wp!==null&&x.wp!==undefined?num(x.wp,0)+'s':''}</span></div>
      </div>
    </div>`;
  }).join("");

  const selDate=parseLocalDate(sel)||new Date(sel);
  const selTitle=selDate.toLocaleDateString(LOCALE,{weekday:"long",day:"numeric",month:"long"});
  const marineNote=S.marine?"":"<div style='font-size:15px;color:rgba(255,255,255,.48);margin-top:8px'>Estat del mar no disponible ara mateix.</div>";
  const daySummary=`${min!==null&&min!==undefined?Math.round(min)+'° / ':''}${max!==null&&max!==undefined?Math.round(max)+'°':''}${rainDay!==null&&rainDay!==undefined&&Number(rainDay)>0?` · Pluja ${num(rainDay,1)} mm`:''}`;
  const windMain=Number.isFinite(maxWind)?`${maxWind} kn ${bestWind?.wdeg!==null&&bestWind?.wdeg!==undefined?wDir(bestWind.wdeg):''}`:"—";
  const seaMain=Number.isFinite(maxWave)?`${num(maxWave,1)} m ${bestWave?.wdir!==null&&bestWave?.wdir!==undefined?compassDir(bestWave.wdir):''}`:"—";
  const seaLabel=Number.isFinite(maxWave)?seaStateLabel(maxWave):"Mar no disponible";
  const hoursOpen=!!S.meteoHoursOpen;
  const hoursDropdown=`<button onclick="go({meteoHoursOpen:${hoursOpen?'false':'true'}})" style="width:100%;margin-top:8px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:9px 10px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;text-align:left">
    <span style="font-size:16px;font-weight:800">${hoursOpen?'Amagar detall per franges':'Veure detall per franges'}</span>
    <span style="font-size:15px;color:rgba(255,255,255,.6);white-space:nowrap">${hoursOpen?'▲':'vent i mar ▾'}</span>
  </button>`;

  return`<div style="background:linear-gradient(135deg,${DARK},#122860);border-radius:14px;margin:10px 14px 0;padding:12px;color:#fff">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px">
      <div><div style="font-size:15px;opacity:.55">📍 Port de Sant Feliu de Guíxols</div><div style="font-size:17px;font-weight:850;margin-top:2px">Vent i estat del mar</div></div>
      <div style="text-align:right"><div style="font-size:14px;opacity:.55">Vent ara</div><div style="font-size:19px;font-weight:850;color:${curKn>=15?'#ffb4b4':'#fff'}">${curKn} kn ${curDir}</div><div style="font-size:14px;opacity:.55">${wIcon(curCode)} ${Math.round(m.current?.temperature_2m??0)}°</div></div>
    </div>
    <div style="display:flex;gap:5px;padding-top:8px;border-top:.5px solid rgba(255,255,255,.15)">${dayButtons}</div>
    <div style="margin-top:9px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><div style="font-size:17px;font-weight:850;text-transform:capitalize;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${selTitle}</div><div style="font-size:15px;color:rgba(255,255,255,.58);white-space:nowrap">${daySummary}</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px">
        <div style="background:${riskBg(windWarn)};border:1px solid ${riskBorder(windWarn)};border-radius:10px;padding:9px 10px"><div style="font-size:14px;color:rgba(255,255,255,.58);font-weight:800;text-transform:uppercase;letter-spacing:.04em">💨 Vent màxim</div><div style="font-size:21px;font-weight:900;color:${riskColor(windWarn)};margin-top:2px">${windMain}</div><div style="font-size:15px;color:rgba(255,255,255,.58);margin-top:2px">${windState(maxWind)}${bestWind?.t?` · ${bestWind.t.slice(0,2)}h`:''}</div></div>
        <div style="background:${riskBg(seaWarn)};border:1px solid ${riskBorder(seaWarn)};border-radius:10px;padding:9px 10px"><div style="font-size:14px;color:rgba(255,255,255,.58);font-weight:800;text-transform:uppercase;letter-spacing:.04em">🌊 Ona màxima</div><div style="font-size:21px;font-weight:900;color:${riskColor(seaWarn)};margin-top:2px">${seaMain}</div><div style="font-size:15px;color:rgba(255,255,255,.58);margin-top:2px">${seaLabel}${bestWave?.t?` · ${bestWave.t.slice(0,2)}h`:''}</div></div>
      </div>
      ${hoursDropdown}
      ${hoursOpen?rows:""}${marineNote}
    </div>
  </div>${strong?`<div style="background:#fff0f0;border:.5px solid ${RED};border-radius:10px;margin:8px 14px 0;padding:10px 12px;display:flex;gap:8px;align-items:center">⚠️<span style="font-size:16px;color:${RED}">Reviseu les condicions: ${windWarn?`vent fins a ${maxWind} kn`:curKn>=15?`vent ara ${curKn} kn`:''}${(windWarn||curKn>=15)&&seaWarn?' · ':''}${seaWarn?`ona fins a ${num(maxWave,1)} m`:''}. Consulteu amb el patró.</span></div>`:""}`;
}

        ${isGeneral?`<span style="display:inline-flex;align-items:center;gap:4px;font-size:14px;color:${MUTED}"><span style="width:9px;height:9px;border-radius:50%;background:${GREEN}"></span>Oberta a tots els grups</span>`:`<span style="display:inline-flex;align-items:center;gap:4px;font-size:14px;color:${MUTED}"><span style="width:9px;height:9px;border-radius:50%;background:${DARK}"></span>Del grup</span><span style="display:inline-flex;align-items:center;gap:4px;font-size:14px;color:${MUTED}"><span style="width:9px;height:9px;border-radius:50%;background:${GREEN}"></span>Altres grups</span>${reserve?`<span style="display:inline-flex;align-items:center;gap:4px;font-size:14px;color:${MUTED}"><span style="width:9px;height:9px;border-radius:50%;background:#8b4513"></span>Reserva</span>`:""}`}
      </div>
      <div style="font-size:14px;color:${MUTED};font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">🚣 Vogadors ${rowerCount}/${capacity}</div>
      ${regularSignups.length?personChips(regularSignups,"signups"):`<div style="font-size:16px;color:${MUTED};font-style:italic;margin-bottom:8px">Encara no hi ha vogadors apuntats</div>`}
      ${reserve?`<div style="font-size:14px;color:#8b4513;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">🤎 Reserva ${reserveCount}/${reserve}</div>${reserveSignups.length?personChips(reserveSignups,"signups"):`<div style="font-size:16px;color:${MUTED};font-style:italic;margin-bottom:8px">Sense reserva assignada</div>`}`:""}
      ${maxHelm>0?`<div style="font-size:14px;color:${MUTED};font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">⛵ Timonels ${o.helmsmanSignups.length}/${maxHelm}${helmsRequired?" · obligatori":""}</div>${o.helmsmanSignups.length?personChips(o.helmsmanSignups,"helm"):`<div style="font-size:16px;color:${helmsRequired?RED:MUTED};font-style:italic;margin-bottom:8px">${helmsRequired?"Cal timonel per fer la sortida":"Sense timonel assignat"}</div>`}`:""}
      <div style="font-size:14px;color:#b07a10;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">⏳ Llista d'espera (${o.waitlist.length})${isGeneral?` · Ordre d'inscripció`:` · Prioritat si és abans de l'obertura`}</div>
      ${o.waitlist.length?personChips(o.waitlist,"wait"):`<div style="font-size:16px;color:${MUTED};font-style:italic">No hi ha ningú en espera</div>`}
      ${!isGeneral?`<div style="font-size:14px;color:${RED};font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">❌ No poden venir (${o.noAttend.length})</div>${o.noAttend.length?personChips(o.noAttend,"noAttend"):`<div style="font-size:16px;color:${MUTED};font-style:italic">Ningú no ha indicat que no pot venir</div>`}`:""}
    </div>
  </details>`:"";

  // Botons d'acció
  const acts=[];
  const busy=!!S.actionBusy;
  if((S.role==="soci"||S.role==="cap")&&!isPast&&!writeBlocked){
    const canRespondNo=isMyGroup&&!isGeneral;
    const amNoAttend=o.noAttend.some(entryMatchesCurrent);
    const canJoinHelm=maxHelm>0&&!amHelm&&!amIn&&!amWait&&canAccess&&o.helmsmanSignups.length<maxHelm&&!helmBlockedByMaxTotal(o);
    const canJoinRow=!amIn&&!amWait&&!amHelm&&canAccess;
    const myEntry={name:S.userName,gid:userEntryGid(o),mid:S.memberId,ts:nowIso()};
    const rowDirect=canTakeRowerSpot(o,myEntry);
    const cantAccess=!isMyGroup&&!canAccess;

    if(canJoinHelm)
      acts.push(`<button onclick="signup(${o.id},true)" style="flex:1;padding:9px;background:#4a7a3d;border:none;border-radius:8px;color:#fff;font-weight:600;font-size:16px;cursor:pointer">⛵ Timonel</button>`);
    if(canJoinRow&&rowDirect)
      acts.push(`<button onclick="signup(${o.id},false)" style="flex:1;padding:9px;background:${DARK};border:none;border-radius:8px;color:#fff;font-weight:600;font-size:17px;cursor:pointer">✋ M'hi apunto</button>`);
    const opensBoat=canJoinRow&&!rowDirect&&secondBoatWouldOpen(o)&&secondBoatMissing(o)===1;
    if(opensBoat)
      acts.push(`<button onclick="signup(${o.id},false)" style="flex:1;padding:9px;background:${DARK};border:none;border-radius:8px;color:#fff;font-weight:600;font-size:17px;cursor:pointer">✋ M'hi apunto · obre la 2a barca</button>`);
    if(canJoinRow&&!rowDirect&&!opensBoat)
      acts.push(`<button onclick="signup(${o.id},false)" style="flex:1;padding:9px;background:#e8a020;border:none;border-radius:8px;color:#fff;font-weight:600;font-size:17px;cursor:pointer">⏳ Llista d'espera</button>`);
    if((amIn||amHelm)&&!isPast)
      acts.push(`<button onclick="unsignup(${o.id})" style="flex:1;padding:9px;background:transparent;border:.5px solid ${RED};border-radius:8px;color:${RED};font-weight:500;font-size:17px;cursor:pointer">Desapuntar-me</button>`);
    if(amWait&&!isPast)
      acts.push(`<div style="flex:1;padding:9px;background:#fff8ee;border:.5px solid #e8a020;border-radius:8px;color:#b07a10;font-size:16px;text-align:center;font-weight:500">⏳ Llista d'espera · pos.${o.waitlist.findIndex(entryMatchesCurrent)+1}<br><button onclick="unsignup(${o.id})" style="background:none;border:none;color:#b07a10;font-size:15px;cursor:pointer;text-decoration:underline;margin-top:2px;padding:0">Sortir</button></div>`);
    if(canRespondNo)
      acts.push(`<button type="button" data-action="outing-no-attend" data-oid="${esc(o.id)}" style="flex:1;padding:9px;background:${amNoAttend?RED:"#fff"};border:1px solid ${RED};border-radius:8px;color:${amNoAttend?"#fff":RED};font-weight:700;font-size:16px;cursor:pointer">${amNoAttend?"✓ No puc venir":"✕ No puc venir"}</button>`);
    if(cantAccess)
      acts.push(`<div style="flex:1;padding:9px;background:#f8f8f8;border-radius:8px;color:${MUTED};font-size:16px;text-align:center">${isGeneral?`S'obrirà a tots ${formatNaturalOpenLabel(o)}`:`Reservada al ${shortGroup(o.groupId)} fins a l'obertura general`}</div>`);
  }
  if((isMyCap||isPatron)&&!isPast&&!openTrigger&&!o.isOpen&&!writeBlocked)
    acts.push(`<button onclick="openOut(${o.id})" style="padding:9px 12px;background:${GREEN};border:none;border-radius:8px;color:#fff;font-weight:600;font-size:16px;cursor:pointer">🔓 Obrir</button>`);
  if((isMyCap||isPatron)&&!isPast&&o.isOpen&&!autoOpenReached(o)&&!writeBlocked)
    acts.push(`<button onclick="closeOut(${o.id})" style="padding:9px 12px;background:#fff;border:.5px solid ${RED};border-radius:8px;color:${RED};font-size:16px;font-weight:700;cursor:pointer">🔒 Tancar als de fora del grup</button>`);
  if(isPatron&&!isPast&&!writeBlocked)
    acts.push(`<button onclick="go({patronAddOuting:${o.id}})" style="padding:9px 12px;background:#fff;border:.5px solid ${DARK};border-radius:8px;color:${DARK};font-size:16px;font-weight:600;cursor:pointer">+ Afegir soci</button>`);
  if(isPatron&&!writeBlocked)
    acts.push(`<button onclick="delOut(${o.id})" style="padding:9px 10px;background:transparent;border:.5px solid ${BORDER};border-radius:8px;color:${MUTED};font-size:16px;cursor:pointer">🗑</button>`);

  if(writeBlocked&&!isPast)acts.push(`<div style="flex:1;padding:9px;background:#fff0f0;border:.5px solid ${RED};border-radius:8px;color:${RED};font-size:16px;text-align:center;font-weight:650">Mode només lectura</div>`);

  // Modal d'afegir soci (patró)
  const patronAddChoice=(S.patronAddChoice&&S.patronAddChoice[o.id])||{};
  const patronAddMid=patronAddChoice.mid||"";
  const patronAddRole=patronAddChoice.role||"rower";
  const addMemberModal=isPatron&&S.patronAddOuting===o.id?`<div style="padding:10px 14px;border-top:.5px solid #f5f3ee;background:#f8f6f0">
    <div style="font-size:15px;font-weight:700;color:${DARK};text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Afegir soci a la sortida</div>
    <select id="patron-add-role-${o.id}" onchange="setPatronAddRole(${o.id},this.value)" style="width:100%;padding:8px 10px;border-radius:8px;border:.5px solid ${BORDER};font-size:16px;background:#fff;outline:none;margin-bottom:8px">
      <option value="rower" ${patronAddRole==="rower"?"selected":""}>Vogador</option>
      ${(o.helmsmen||0)>0?`<option value="helm" ${patronAddRole==="helm"?"selected":""}>Timonel</option>`:""}
    </select>
    <select id="patron-add-mid-${o.id}" onchange="setPatronAddMid(${o.id},this.value)" style="width:100%;padding:8px 10px;border-radius:8px;border:.5px solid ${BORDER};font-size:16px;background:#fff;outline:none;margin-bottom:8px">
      <option value="" ${patronAddMid?"":"selected"}>— Selecciona soci —</option>
      ${S.membres.filter(m=>!m.pending).sort((a,b)=>a.name.localeCompare(b.name)).map(m=>{
        const inOut=o.signups.some(s=>s.mid===m.id||s.name===m.name);
        const inHelm=o.helmsmanSignups.some(s=>s.mid===m.id||s.name===m.name);
        const inWait=o.waitlist.some(s=>s.mid===m.id||s.name===m.name);
        const taken=inOut||inHelm||inWait;
        return`<option value="${m.id}" ${String(patronAddMid)===String(m.id)?"selected":""} ${taken?"disabled":""} style="color:${taken?MUTED:"#1a1a18"}">${esc(m.name)} · ${esc(gname(m.groupId).split(" · ")[0])}${taken?" ✓":""}</option>`;
      }).join("")}
    </select>
    <div style="display:flex;gap:8px">
      <button onmousedown="rememberPatronAddForm(${o.id})" ontouchstart="rememberPatronAddForm(${o.id})" onclick="patronAddMember(${o.id})" style="flex:1;padding:8px;background:${DARK};border:none;border-radius:8px;color:#fff;font-size:16px;font-weight:700;cursor:pointer">Afegir</button>
      <button onclick="go({patronAddOuting:null})" style="padding:8px 12px;background:transparent;border:.5px solid ${BORDER};border-radius:8px;color:${MUTED};font-size:16px;cursor:pointer">Cancel·lar</button>
    </div>
  </div>`:"";

  const compactClosed=!isPast&&!openTrigger&&!o.isOpen&&!isMyGroup&&!amIn&&!amWait&&!amHelm;
  if(compactClosed){
    const closedHint=isGeneral
      ?`S'obrirà ${formatNaturalOpenLabel(o)}`
      :`Reservada al ${shortGroup(o.groupId)} fins a ${formatNaturalOpenLabel(o)}`;
    const detailsOpen=S.patronAddOuting===o.id?" open":"";
    return`<details${detailsOpen} style="background:#fff;border-radius:14px;margin:10px 14px 0;border:${cardBorder};overflow:hidden">
      ${otherBanner}<summary style="list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;background:#fffdf8">
        <div style="min-width:0">
          <div style="font-size:18px;font-weight:750;color:#1a1a18;line-height:1.2">${esc(outingDisplayTitle(o))} · <span style="white-space:nowrap">${outingShortDate(o)} · ${esc(o.time)} h</span></div>
          <div style="font-size:15px;color:${MUTED};line-height:1.35;margin-top:3px">${closedHint}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0">${badge}<span style="font-size:14px;color:${MUTED};font-weight:800">Detalls ▾</span></div>
      </summary>
      <div style="border-top:.5px solid #f5f3ee;padding:10px 14px 0">
        ${openInfo}
        ${compactStats}
      </div>
      ${peopleDropdown}${renderOutingLogs(o)}${addMemberModal}
      ${acts.length?`<div style="padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap">${acts.join("")}</div>`:""}
    </details>`;
  }

  return`<div style="background:#fff;border-radius:14px;margin:10px 14px 0;border:${cardBorder};overflow:hidden">
    ${otherBanner}<div style="padding:12px 14px;border-bottom:.5px solid #f5f3ee">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:10px">
        <div style="font-size:19px;font-weight:750;color:#1a1a18;line-height:1.2;min-width:0">${esc(outingDisplayTitle(o))} · <span style="white-space:nowrap">${outingShortDate(o)} · ${esc(o.time)} h</span></div>${badge}
      </div>
      ${isPast?`<div style="font-size:16px;color:${MUTED}"><span style="background:#f5f3ee;color:${MUTED};font-size:14px;padding:1px 6px;border-radius:10px;font-weight:600">Sortida passada</span></div>`:""}
      ${personalStatus}
      ${openInfo}
      <div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:15px;color:${MUTED}">Places ocupades</span>
          <span style="font-size:15px;font-weight:600;color:${total>=capacity?RED:DARK}">${total}/${capacity}${o.waitlist.length?` · ${o.waitlist.length} esperant`:""}</span>
        </div>
        <div style="background:#f0ede8;border-radius:4px;height:5px"><div style="background:${total>=capacity?RED:DARK};height:5px;border-radius:4px;width:${pct}%"></div></div>
      </div>
      ${compactStats}
    </div>
    ${peopleDropdown}${renderAttendancePanel(o)}${renderOutingLogs(o)}${addMemberModal}
    ${acts.length?`<div style="padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap">${acts.join("")}</div>`:""}
  </div>`;
}

function getUserVote(p){
  if(!S.userName)return null;
  for(const o of p.options){if((p.votes[o]||[]).includes(S.userName))return o;}
  return null;
}

function renderPollEditForm(p){
  if(!userCanManageContent())return "";
  const opts=(S.editPollId===p.id&&Array.isArray(S.editPollOpts)?S.editPollOpts:(p.options||["",""]));
  const inputs=opts.map((o,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px"><input id="edit-opt-${p.id}-${i}" placeholder="Opció ${i+1}${i<2?" *":""}" value="${esc(o)}" style="flex:1;padding:10px 11px;border-radius:10px;border:.5px solid ${BORDER};font-size:17px;background:${BG};outline:none">${i>=2?`<button onclick="rmEditPollOpt(${p.id},${i})" style="padding:8px 10px;background:#fff;border:.5px solid ${BORDER};border-radius:8px;color:${MUTED};font-size:20px;cursor:pointer;flex-shrink:0">×</button>`:""}</div>`).join("");
  return cc(`${lbl("Editar enquesta")}<div style="font-size:16px;color:${MUTED};line-height:1.45;margin-bottom:10px">Pots corregir la pregunta o les opcions. Els vots es conserven per posició; si elimines una opció, els seus vots deixaran de comptar.</div><input id="edit-poll-q-${p.id}" placeholder="Pregunta *" value="${esc(S.editPollQ||p.question||"")}" style="width:100%;padding:10px 11px;border-radius:10px;border:.5px solid ${BORDER};font-size:17px;background:${BG};outline:none;box-sizing:border-box;margin-bottom:12px">${lbl("Opcions")} ${inputs}${S.editPollErr?`<div style="background:#fff0f0;border:.5px solid ${RED};border-radius:9px;color:${RED};font-size:16px;padding:8px 10px;margin-bottom:10px">${esc(S.editPollErr)}</div>`:""}${opts.length<6?`<button onclick="addEditPollOpt(${p.id})" style="width:100%;padding:9px;background:#fff;border:.5px dashed ${BORDER};border-radius:9px;color:${DARK};font-size:17px;cursor:pointer;margin-bottom:12px;font-weight:600">+ Afegir opció</button>`:"<div style='height:12px'></div>"}<div style="display:flex;gap:8px"><button onclick="savePollEdit(${p.id})" style="flex:1;padding:10px;background:${DARK};border:none;border-radius:9px;color:#fff;font-weight:800;font-size:18px;cursor:pointer">Desar canvis</button><button onclick="cancelPollEdit()" style="padding:10px 14px;background:transparent;border:.5px solid ${BORDER};border-radius:9px;color:${MUTED};font-size:18px;cursor:pointer">Cancel·lar</button></div>`);
}

function renderPollCard(p){
  p.votes=p.votes||{};
  p.options=(p.options||[]).filter(Boolean);
  p.options.forEach(o=>{if(!Array.isArray(p.votes[o]))p.votes[o]=[];});
  if(userCanManageContent()&&S.editPollId===p.id)return renderPollEditForm(p);
  const mv=getUserVote(p);
  const tot=p.options.reduce((a,o)=>a+(p.votes[o]?.length||0),0);
  const counts=p.options.map(o=>p.votes[o]?.length||0);
  const maxVotes=counts.length?Math.max(...counts):0;
  const winners=p.options.filter(o=>(p.votes[o]?.length||0)===maxVotes&&maxVotes>0);
  const canVote=!p.closed&&!!S.userName;
  const status=p.closed
    ?`<span style="background:#fff0f0;color:${RED};font-size:14px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap">Tancada</span>`
    :`<span style="background:#e6f4ee;color:${GREEN};font-size:14px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap">Oberta</span>`;
  const userBadge=mv?`<div style="margin-top:7px;display:inline-flex;align-items:center;gap:5px;background:#eef0fa;color:${DARK};font-size:15px;font-weight:700;padding:4px 8px;border-radius:20px">✓ El teu vot: ${esc(mv)}</div>`:"";
  const rows=p.options.map((opt,optIdx)=>{
    const voters=p.votes[opt]||[];
    const cnt=voters.length;
    const pct=tot>0?Math.round((cnt/tot)*100):0;
    const isMy=mv===opt;
    const isWinner=p.closed&&winners.length===1&&winners[0]===opt;
    const isTie=p.closed&&winners.length>1&&winners.includes(opt);
    const key=pollKey(p.id,opt);
    const open=!!(S.pollVotersOpen&&S.pollVotersOpen[key]);
    const bg=isMy?"#eef0fa":"#fff";
    const br=isMy?DARK:(isWinner?RED:BORDER);
    const barCol=isWinner?RED:(isMy?DARK:"#c8d4f0");
    // Els noms dels votants NO es mostren per defecte: només apareixen en desplegar "Veure votants".
    const topVoters="", extra="";
    const expanded=open?`<div style="margin-top:8px;padding:8px 9px;background:#faf8f3;border-radius:10px;border:.5px solid #f0ede6">
      <div style="font-size:14px;color:${MUTED};font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px">Votants</div>
      ${voters.length?`<div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center">${voters.map(n=>`<span style="display:inline-flex;align-items:center;max-width:100%;background:#fff;border:.5px solid ${BORDER};border-radius:999px;color:#1a1a18;font-size:15px;font-weight:600;line-height:1.2;padding:4px 8px;white-space:nowrap">${esc(n)}</span>`).join("")}</div>`:`<div style="font-size:16px;color:${MUTED};font-style:italic">Encara no hi ha cap vot.</div>`}
    </div>`:"";
    const voteBtn=canVote?`<button onclick="event.stopPropagation();castVoteByIndex(${p.id},${optIdx})" style="margin-top:8px;width:100%;padding:8px;background:${isMy?DARK:"transparent"};border:1px solid ${isMy?DARK:BORDER};border-radius:9px;color:${isMy?"#fff":DARK};font-size:16px;font-weight:700;cursor:pointer">${isMy?"✓ Votat":"Votar aquesta opció"}</button>`:"";
    const votersBtn=`<button onclick="event.stopPropagation();togglePollVotersByIndex(${p.id},${optIdx})" style="margin-top:8px;background:transparent;border:none;color:${cnt?DARK:MUTED};font-size:15px;font-weight:700;cursor:${cnt?"pointer":"default"};padding:0" ${cnt?"":"disabled"}>${open?"Amagar votants":"Veure votants"} · ${cnt}</button>`;
    return`<div style="position:relative;overflow:hidden;margin-bottom:10px;background:${bg};border:1.5px solid ${br};border-radius:13px;padding:10px 10px 9px">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:${isMy?"rgba(27,58,122,.08)":"rgba(200,212,240,.22)"};pointer-events:none"></div>
      <div style="position:relative">
        <div style="display:flex;align-items:flex-start;gap:9px">
          <div style="width:22px;height:22px;border-radius:50%;border:1.5px solid ${isMy?DARK:BORDER};background:${isMy?DARK:"#fff"};color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:1px;font-weight:700">${isMy?"✓":""}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div style="font-size:18px;font-weight:${isMy||isWinner?700:600};line-height:1.35;color:${isWinner?RED:(isMy?DARK:"#1a1a18")};word-break:break-word">${isWinner?"🏆 ":isTie?"↔️ ":""}${esc(opt)}</div>
              <div style="text-align:right;white-space:nowrap"><div style="font-size:17px;font-weight:800;color:${isWinner?RED:DARK}">${cnt}</div><div style="font-size:14px;color:${MUTED};font-weight:700">${pct}%</div></div>
            </div>
            <div style="background:#f0ede8;border-radius:20px;height:7px;overflow:hidden;margin-top:7px"><div style="background:${barCol};height:7px;border-radius:20px;width:${pct}%"></div></div>
            <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:7px">${votersBtn}</div>
            ${expanded}
            ${voteBtn}
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
  const hint=p.closed
    ?`<div style="font-size:15px;color:${MUTED};margin-bottom:10px;line-height:1.45">La votació està tancada. Els resultats queden visibles i pots desplegar els votants.</div>`
    :S.userName?`<div style="font-size:15px;color:${MUTED};margin-bottom:10px;line-height:1.45">Toca una opció per votar o canviar el vot. Els vots no són anònims.</div>`
    :`<div style="font-size:15px;color:${MUTED};margin-bottom:10px;line-height:1.45">Entra com a soci per votar. Pots veure els resultats i desplegar els votants.</div>`;
  const canManagePoll=userCanManageContent();

function renderHomeOutingMini(o){

    ${o.secondBoat?`<span style="display:inline-flex;align-items:center;gap:4px;background:#e8f0fb;border-radius:999px;font-size:15px;padding:4px 8px;color:${DARK};font-weight:700">🚣🚣 2 barques</span>`:""}

    <span style="display:inline-flex;align-items:center;gap:4px;background:#fff8ee;border-radius:999px;font-size:15px;padding:4px 8px;color:#b07a10;font-weight:700">⏳ ${o.waitlist.length}</span>

  return `<div style="border:.5px solid ${BORDER};border-radius:14px;overflow:hidden;margin-bottom:9px;background:#fff"><div style="padding:11px 12px;border-bottom:${closedCompact?"none":".5px solid #f0ede6"};display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="min-width:0"><div style="font-size:18px;font-weight:750;color:#1a1a18;line-height:1.25">${esc(outingDisplayTitle(o))} · <span style="white-space:nowrap">${outingShortDate(o)} · ${esc(o.time||"")} h</span></div>${closedCompact?`<div style="font-size:15px;color:${MUTED};line-height:1.35;margin-top:3px">${closedHint}</div>`:""}</div><span style="font-size:14px;font-weight:800;border-radius:99px;padding:3px 8px;white-space:nowrap;background:${statusBg};color:${statusCol}">${status}</span></div>${closedCompact?"":stats+`<div style="padding:0 10px 9px;font-size:14px;color:${MUTED};font-weight:700;text-align:right">Noms només a Sortides › Veure apuntats</div>`}</div>`;

    return strow([[Math.round(km)+" km","totals"],[sess.length,"sessions"],[`${h}h${m2>0?" "+m2+"m":""}`,"hores"]])+form+cc(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">${lbl("Historial")}${canAdd&&!S.showForm?`<button onclick="go({showForm:true})" style="background:${DARK};border:none;border-radius:8px;color:#fff;padding:5px 12px;font-size:16px;cursor:pointer;font-weight:600">+ Afegir</button>`:""}</div>${sess.length===0?`<div style="font-size:17px;color:${MUTED};text-align:center;padding:1rem 0">Cap sessió</div>`:list}`)+`<div style="height:14px"></div>`;

  const passades=all.filter(o=>isPastOuting(o)).sort((a,b)=>sortOutings(b,a));
  const form=S.showForm&&canCreate?cc(`${lbl("Nova sortida")}<input id="o-title" placeholder="Títol, ex. Sortida oberta" style="width:100%;padding:9px 10px;border-radius:8px;border:.5px solid ${BORDER};font-size:17px;background:${BG};outline:none;box-sizing:border-box;margin-bottom:8px"><div style="display:flex;gap:8px;margin-bottom:8px"><input id="o-date" type="date" value="${td()}" style="flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:.5px solid ${BORDER};font-size:17px;background:${BG};outline:none"><input id="o-time" type="time" value="09:00" style="flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:.5px solid ${BORDER};font-size:17px;background:${BG};outline:none"></div><select id="o-group" style="width:100%;padding:9px 10px;border-radius:8px;border:.5px solid ${BORDER};font-size:17px;background:${BG};outline:none;margin-bottom:8px"><option value="0">Oberta a tots els grups</option>${S.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join("")}</select><div style="font-size:15px;color:${MUTED};line-height:1.4;margin:-2px 0 8px">Si tries “Oberta a tots els grups”, la sortida no queda reservada a cap grup concret.</div><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span style="font-size:17px;color:${MUTED}">Places:</span><input id="o-cap" type="number" value="12" min="1" max="20" style="width:70px;padding:9px 10px;border-radius:8px;border:.5px solid ${BORDER};font-size:17px;background:${BG};outline:none"></div><div style="display:flex;gap:8px"><button onclick="addOut()" style="flex:1;padding:10px;background:${DARK};border:none;border-radius:8px;color:#fff;font-weight:600;font-size:18px;cursor:pointer">Crear</button><button onclick="go({showForm:false})" style="padding:10px 14px;background:transparent;border:.5px solid ${BORDER};border-radius:8px;color:${MUTED};font-size:18px;cursor:pointer">Cancel·lar</button></div>`):"";
  const createBtn=canCreate&&!S.showForm?`<div style="margin:12px 14px 0"><button onclick="go({showForm:true})" style="width:100%;padding:11px;background:${DARK};border:none;border-radius:10px;color:#fff;font-weight:600;font-size:18px;cursor:pointer">+ Nova sortida</button></div>`:"";
  const emptyCard=txt=>cc(`<div style="font-size:17px;color:${MUTED};text-align:center;padding:1rem 0">${txt}</div>`);
  let properesBlock;
  if(S.role==="soci"||S.role==="cap"){
    // Primer el teu grup (i les obertes a tots / on ja estàs apuntat); les d'altres grups, plegades a sota.
    const others=properes.filter(o=>isOtherGroupOuting(o)&&!memberIsInOuting(o));

function attendanceStatsForOutings(outings){
  const out={present:0,absent:0,excused:0,closed:0,pending:0,people:{}};
  safeArr(outings).filter(isPastOuting).forEach(o=>{
    const people=attendancePeople(o);
    if(!people.length)return;
    if(!o.attendance?.closed){out.pending++;return;}
    out.closed++;
    people.forEach(p=>{
      const st=o.attendance.status?.[p.attKey]||"present";
      if(st==="absent")out.absent++;
      else if(st==="excused")out.excused++;
      else {out.present++;out.people[p.name]=(out.people[p.name]||0)+1;}
    });
  });
  out.attPct=(out.present+out.absent)>0?Math.round(out.present/(out.present+out.absent)*100):null;
  return out;
}
function attendanceStatsForMember(m){
  const out={present:0,absent:0,excused:0,closed:0,pending:0,people:{}};
  if(!m)return {...out,attPct:null};
  const targetKey=attendanceKey({mid:m.id,name:m.name,gid:m.groupId});
  const targetName=String(m.name||"").trim().toLowerCase();
  safeArr(S.outings).filter(isPastOuting).forEach(o=>{
    const person=attendancePeople(o).find(p=>p.attKey===targetKey||String(p.name||"").trim().toLowerCase()===targetName);
    if(!person)return;
    if(!o.attendance?.closed){out.pending++;return;}
    out.closed++;
    const st=o.attendance.status?.[person.attKey]||"present";
    if(st==="absent")out.absent++;
    else if(st==="excused")out.excused++;
    else {out.present++;out.people[m.name]=(out.people[m.name]||0)+1;}
  });
  out.attPct=(out.present+out.absent)>0?Math.round(out.present/(out.present+out.absent)*100):null;
  return out;
}

function memberAttendanceHistory(m){
  const out=[];if(!m)return out;
  const targetKey=attendanceKey({mid:m.id,name:m.name,gid:m.groupId});
  const targetName=String(m.name||"").trim().toLowerCase();
  safeArr(S.outings).filter(isPastOuting).forEach(o=>{
    const person=attendancePeople(o).find(p=>p.attKey===targetKey||String(p.name||"").trim().toLowerCase()===targetName);
    if(!person)return;
    const st=o.attendance?.closed?(o.attendance.status?.[person.attKey]||"present"):"pending";
    out.push({o,st,role:person.attRole});
  });
  return out.sort((a,b)=>sortOutings(b.o,a.o));
}
// Desapuntades fetes pel mateix soci (no les que fa el patró). "Última hora" = menys d'1 h abans de la sortida (criteri de Nacho, 2026-11-22).
const UNSIGNUP_LATE_HOURS=1;
function memberUnsignupStats(m){
  const out={total:0,late:0,items:[]};if(!m)return out;
  const nk=normalizeNameKey(m.name),seen=new Set();
  safeArr(S.avisos).forEach(a=>{
    if(a.kind!=="log"||(a.type!=="unsignup"&&a.type!=="helm_unsignup"))return;
    if(a.byRole!=="soci"&&a.byRole!=="cap")return;
    const mine=a.byMemberId?Number(a.byMemberId)===Number(m.id):normalizeNameKey(a.byName)===nk;
    if(!mine)return;
    const k=String(a.outingId)+"|"+String(a.createdAt||a.date||"").slice(0,16);
    if(seen.has(k))return;seen.add(k);
    const o=S.outings.find(x=>String(x.id)===String(a.outingId));
    const start=o?outingStartDateTime(o):null,at=a.createdAt?new Date(a.createdAt):null;
    const late=!!(start&&at&&!isNaN(at)&&(start-at)<UNSIGNUP_LATE_HOURS*3600000);
    out.total++;if(late)out.late++;
    out.items.push({o,late,at:a.createdAt||a.date||""});
  });
  return out;
}
function memberRow(m){
  const hist=memberAttendanceHistory(m);const c={present:0,absent:0,excused:0,pending:0};hist.forEach(h=>c[h.st]++);
  const pct=(c.present+c.absent)>0?Math.round(c.present/(c.present+c.absent)*100):null;
  const un=memberUnsignupStats(m);
  const unPct=(un.total+hist.length)>0?Math.round(un.total/(un.total+hist.length)*100):null;
  const warn=c.absent>=2||(un.total>=3&&unPct>=50)||un.late>=3;
  return {m,hist,c,pct,un,unPct,warn};
}

// Regularitat dels últims 90 dies: % de sortides del seu grup (amb assistència tancada) on ha remat.
const REGULAR_DAYS=90,REGULAR_PCT=50;
function renderGroupRegularity(){
  const since=new Date(Date.now()-REGULAR_DAYS*86400000).toISOString().slice(0,10);
  const active=S.membres.filter(m=>!m.pending);
  const names=list=>list.length?list.map(x=>esc(x.m.name)+(x.n?` <span style="color:${MUTED}">(${x.n})</span>`:"")).join(", "):`<span style="color:${MUTED};font-style:italic">ningú</span>`;
  const blocks=S.groups.map(g=>{
    const ms=active.filter(m=>memberInGroup(m,g.id));
    const gOut=groupOutings(g.id).filter(o=>isPastOuting(o)&&(o.date||"")>=since&&o.attendance?.closed&&attendancePeople(o).length);
    const rows=ms.map(m=>{const n=memberAttendanceHistory(m).filter(h=>h.st==="present"&&(h.o.date||"")>=since).length;return {m,n};});
    const base=gOut.length;
    const reg=[],occ=[],never=[];
    rows.forEach(x=>{if(!x.n)never.push(x);else if(base&&x.n/base*100>=REGULAR_PCT)reg.push(x);else occ.push(x);});
    [reg,occ].forEach(l=>l.sort((a,b)=>b.n-a.n));
    return `<details style="border-top:.5px solid #f0ede6"><summary style="list-style:none;cursor:pointer;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div style="font-size:17px;font-weight:800;color:#1a1a18">${esc(g.name)} · ${ms.length} socis</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px"><span style="font-size:14px;font-weight:800;background:#e6f4ee;color:${GREEN};border-radius:99px;padding:3px 8px">🟢 ${reg.length} regulars</span><span style="font-size:14px;font-weight:800;background:#fff8ee;color:#b07a10;border-radius:99px;padding:3px 8px">🟡 ${occ.length} ocasionals</span><span style="font-size:14px;font-weight:800;background:#fff0f0;color:${RED};border-radius:99px;padding:3px 8px">⚪ ${never.length} mai</span></div></div><div style="font-size:22px;color:${MUTED}">▾</div></summary><div style="font-size:15px;line-height:1.5;padding:0 0 10px;color:#1a1a18">${base?"":`<div style="color:#b07a10;margin-bottom:4px">Encara no hi ha assistències tancades d'aquest grup als últims ${REGULAR_DAYS} dies.</div>`}<div><strong>🟢 Regulars:</strong> ${names(reg)}</div><div><strong>🟡 Ocasionals:</strong> ${names(occ)}</div><div><strong>⚪ Mai:</strong> ${names(never)}</div><div style="color:${MUTED};margin-top:4px">${base} sortides del grup amb assistència tancada.</div></div></details>`;
  }).join("");
  return cc(`${lbl("Socis per grup i regularitat")}<div style="font-size:16px;color:${MUTED};line-height:1.45;margin-bottom:6px">${active.length} socis actius. Últims ${REGULAR_DAYS} dies: <strong>regular</strong> = ha remat a ${REGULAR_PCT}% o més de les sortides del seu grup; <strong>ocasional</strong> = menys; <strong>mai</strong> = cap. Entre parèntesis, vegades que ha remat.</div>${blocks}`);
}

let lastLoginKey=null;
function render(){
  const root=document.getElementById("root");
  if(!root)return;
  // Pantalla de càrrega lleugera fins que Supabase hagi respost
  if(S.supaLoading){
    root.innerHTML=`<div style="min-height:100vh;background:linear-gradient(160deg,${DARK} 60%,#122860);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px"><div style="display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;width:80px;height:80px;border:3px solid ${RED}">${emblema}</div><div style="color:rgba(255,255,255,.5);font-size:17px;letter-spacing:.05em">Carregant...</div></div>`;
    return;
  }
  try{
    if(!S.role||S.loginStep!=="choose"){
      // Conservem el que l'usuari ha escrit (nom, grup, claus) si la pantalla es
      // torna a dibuixar sense canviar de pas (error, botó de secció, refresc...).
      const loginKey=S.loginStep+"|"+(S.selectedMemberId||"");
      const kept={};let focusId=null,selS=null,selE=null;
      const clearPins=clearPinsOnce;clearPinsOnce=false;
      if(lastLoginKey===loginKey){
        root.querySelectorAll("input[id],select[id],textarea[id]").forEach(el=>{if(!(clearPins&&el.type==="password"))kept[el.id]=el.value;});
        const a=document.activeElement;
        if(a&&a.id&&root.contains(a)&&!(clearPins&&a.type==="password")){focusId=a.id;try{selS=a.selectionStart;selE=a.selectionEnd;}catch(e){}}
      }
      lastLoginKey=loginKey;
      root.innerHTML=renderLogin();
      Object.keys(kept).forEach(id=>{const el=document.getElementById(id);if(el&&kept[id]!==undefined&&kept[id]!=="")el.value=kept[id];});
      if(focusId){
        const f=document.getElementById(focusId);
        if(f){f.focus();try{if(selS!=null)f.setSelectionRange(selS,selE);}catch(e){}}
      }
      const p=document.getElementById("pin-in");
      const nomIn=document.getElementById("soci-nom");
      if(nomIn)nomIn.onkeydown=e=>{if(e.key==="Enter")p?.focus();};
      if(p){
        if(!focusId){if(nomIn&&!nomIn.value)nomIn.focus();else p.focus();}
        const fn=S.loginStep==="patron-pin"?tryPin:S.loginStep==="soci-pin"?tryLoginSoci:S.loginStep==="soci-name"?trySociName:null;
        if(fn)p.onkeydown=e=>{if(e.key==="Enter")fn();};
      }
      const p2=document.getElementById("pin-in2");
      if(p2)p2.onkeydown=e=>{if(e.key==="Enter")tryLoginSoci();};
      return;
    }
  lastLoginKey=null;
  const myGid=S.userGroupId||S.capGroupId;
  const opc=S.polls.filter(p=>!p.closed).length;
  const pendingCount=S.role==="patron"?S.membres.filter(m=>m.pending).length:0;
  const avisUnread=unreadAvisosCount();
  const attPending=capPendingAttendanceOutings().length;
  // Permisos de secció: el patró veu tot; socis i caps només les seccions assignades.
  const hasC=S.role==="patron"||S.userSections.includes("competicio");
  const hasS=S.role==="patron"||S.userSections.includes("social");
  const hasBoth=hasC&&hasS;
  // Si una sessió antiga deixa un soci social a competició, el retornem a social.
  if(!hasC&&S.section==="competicio")S.section=hasS?"social":"social";
  if(!hasS&&S.section==="social")S.section=hasC?"competicio":"social";
  if(S.screen==="resultats"&&!hasC)S.screen="inici";
  const nav=[["inici","🏠","Inici",null]];
  if(hasC)nav.push(["entrena","🚣","Entrena","competicio"]);
  if(hasS)nav.push(["entrena","⛵","Sortides","social"]);
  nav.push(["calendari","📅","Calendari",null]);
  nav.push(["vots","📊","Enquestes",null]);
  if(userCanViewStats())nav.push(["estadistiques","📈","Stats",null]);
  if(userIsWebmaster())nav.push(["admin","🛠","Admin",null]);
  if(S.role==="patron")nav.push(["membres","👥","Membres",null]);
  nav.push(["avisos","📢","Avisos",null]);
  if(S.screen==="estadistiques"&&!userCanViewStats())S.screen="inici";
  if(S.screen==="admin"&&!userIsWebmaster())S.screen="inici";
  const screens={inici:renderInici,entrena:renderEntrena,resultats:hasC?renderResultats:renderInici,calendari:()=>renderClubAgenda()+`<div style="height:14px"></div>`,vots:renderVots,estadistiques:renderEstadistiques,admin:renderAdminTecnic,membres:renderMembres,avisos:renderAvisos};
  const titles={inici:"Inici",entrena:S.section==="social"?"Sortides":"Entrenaments",resultats:"Resultats",calendari:"Calendari",vots:"Votacions",estadistiques:"Estadístiques",admin:"Admin tècnic",membres:"Membres",avisos:"Avisos"};
  const userLabel=S.role==="patron"?"Patró":(S.userName||"");
  const userSub=S.role==="cap"?`${userLabel} · Cap ${gname(S.capGroupId).split(" · ")[0]}`:userLabel;
  const rb=S.role==="patron"?`<span style="background:${RED};color:#fff;font-size:14px;padding:2px 8px;border-radius:20px;font-weight:700">PATRÓ</span>`:S.role==="cap"?`<span style="background:rgba(255,255,255,.15);color:#fff;font-size:14px;padding:2px 8px;border-radius:20px;font-weight:600">Cap</span>`:myGid?`<span style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);font-size:14px;padding:2px 8px;border-radius:20px">${gname(myGid).split(" · ")[0]}</span>`:"";
  const btnC=hasC?`<button onclick="go({section:'competicio',showForm:false})" style="flex:1;padding:7px;font-size:17px;font-weight:600;border:none;border-radius:8px;cursor:pointer;background:${S.section==="competicio"?DARK:"transparent"};color:${S.section==="competicio"?"#fff":MUTED}">🏆 Competició</button>`:"";

async function signup(oid,asHelm=false){
  if(!canWriteNow())return;
  const pre=S.outings.find(x=>x.id===oid);
  if(pre&&isOtherGroupOuting(pre)){
    const mine=userGroupIds().map(g=>gname(g)).filter(Boolean).join(" + ")||"el teu grup";
    if(!confirm(`⚠️ Aquesta sortida és del ${gname(pre.groupId)}, no del teu grup (${mine}).\n\nSegur que t'hi vols apuntar?`))return;
  }
  const lock=`signup:${oid}:${S.memberId||"anon"}`;
  return withActionLock(lock,()=>outingTxn(async()=>{
    await refreshOutingsBeforeAction();
    const o=S.outings.find(x=>x.id===oid);
    if(!o||!(S.role==="soci"||S.role==="cap")||isPastOuting(o))return;
    normalizeOutingEntries(o);
    if(!o.waitlist)o.waitlist=[];
    if(!o.helmsmanSignups)o.helmsmanSignups=[];
    const isGeneral=isGeneralOuting(o);
    const isMyGroup=!isGeneral&&userInGroup(o.groupId);
    const isOpen=shouldBeOpen(o);
    const publicWaitlistOpen=canJoinPublicWaitlist(o);
    if(!isMyGroup&&!isOpen&&!publicWaitlistOpen)return;
    const entry={name:S.userName,gid:userEntryGid(o),mid:S.memberId,ts:nowIso()};
    markWaitlistPriority(entry,o);
    reconcileOutingWaitlist(o);
    // No pot ser timonel i vogador alhora, ni duplicar inscripció.
    const amHelm=o.helmsmanSignups.some(entryMatchesCurrent);
    const amRower=o.signups.some(entryMatchesCurrent);
    const amWait=o.waitlist.some(entryMatchesCurrent);
    if(amHelm||amRower||amWait)return;
    // Una inscripció afirmativa substitueix una resposta prèvia de no assistència.
    o.noAttend=o.noAttend.filter(e=>!entryMatchesCurrent(e));
    if(asHelm){
      const maxHelm=o.helmsmen||0;
      if(!maxHelm)return;
      if(o.helmsmanSignups.length>=maxHelm||helmBlockedByMaxTotal(o))return alert("Ja hi ha el màxim de timonels");
      o.helmsmanSignups.push(entry);
      addOutingLog(o,"helm_signup",`${S.userName} s'apunta de timonel a ${outingLabel(o)}.`);
      showToast("ok","T'has apuntat com a timonel.");
    } else {
      if(canTakeRowerSpot(o,entry)){
        o.signups.push(entry);
        addOutingLog(o,"signup",`${S.userName} s'apunta a ${outingLabel(o)}.`);
        showToast("ok","T'has apuntat correctament.");
      }else if(canTakeReserveSpot(o,entry)){
        o.signups.push({...entry,isReserve:true});
        addOutingLog(o,"signup_reserve",`${S.userName} ocupa la plaça de reserva de ${outingLabel(o)}.`);
        showToast("ok","Has entrat com a reserva.");
      }else{
        markWaitlistPriority(entry,o);
        o.waitlist.push(entry);
        addOutingLog(o,"waitlist_join",`${S.userName} entra a la llista d'espera de ${outingLabel(o)}${entry.groupPriority?" amb prioritat de grup":""}.`);
        showToast("ok","Has entrat a la llista d'espera.");
      }
    }
    if(await commitOutings()===TXN_RETRY)return TXN_RETRY;
  }));
}
async function setOutingNoAttend(oid){
  if(!canWriteNow())return;
  const lock=`no-attend:${oid}:${S.memberId||"anon"}`;
  return withActionLock(lock,()=>outingTxn(async()=>{
    await refreshOutingsBeforeAction();
    const o=S.outings.find(x=>String(x.id)===String(oid));
    if(!o||!(S.role==="soci"||S.role==="cap")||isPastOuting(o)||isGeneralOuting(o)||!userInGroup(o.groupId))return;
    normalizeOutingEntries(o);
    const existing=o.noAttend.some(entryMatchesCurrent);
    if(existing){
      o.noAttend=o.noAttend.filter(e=>!entryMatchesCurrent(e));
      addOutingLog(o,"no_attend_cleared",`${S.userName} esborra la resposta de no assistència a ${outingLabel(o)}.`);
      if(await commitOutings()===TXN_RETRY)return TXN_RETRY;
      showToast("ok","Has esborrat la resposta.");
      return;
    }
    const wasHelm=o.helmsmanSignups.some(entryMatchesCurrent);
    const wasIn=o.signups.some(entryMatchesCurrent);
    const wasWait=o.waitlist.some(entryMatchesCurrent);
    o.helmsmanSignups=o.helmsmanSignups.filter(e=>!entryMatchesCurrent(e));
    o.signups=o.signups.filter(e=>!entryMatchesCurrent(e));
    o.waitlist=o.waitlist.filter(e=>!entryMatchesCurrent(e));
    o.noAttend.push({name:S.userName,gid:Number(o.groupId),mid:S.memberId,ts:nowIso()});
    if(wasIn)reconcileOutingWaitlist(o);
    if(wasHelm)addOutingLog(o,"helm_unsignup",`${S.userName} es desapunta de timonel de ${outingLabel(o)}.`);
    if(wasIn)addOutingLog(o,"unsignup",`${S.userName} allibera la plaça de ${outingLabel(o)}.`);
    if(wasWait)addOutingLog(o,"waitlist_leave",`${S.userName} surt de la llista d'espera de ${outingLabel(o)}.`);
    addOutingLog(o,"no_attend",`${S.userName} indica que no pot venir a ${outingLabel(o)}.`);
    if(await commitOutings()===TXN_RETRY)return TXN_RETRY;
    showToast("ok","Has indicat que no pots venir.");
  }));
}
