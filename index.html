async function sha256Hex(text){
  if(!window.crypto?.subtle)throw new Error("Aquest navegador no suporta xifrat segur.");
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function hashPatronPin(pin){return "sha256:"+(await sha256Hex("ldm:patron:"+pin));}
async function hashMemberPin(pin,m){return "sha256:"+(await sha256Hex("ldm:member:"+m.id+":"+m.name+":"+pin));}
function isHashedPin(v){return typeof v==="string"&&/^sha256:[a-f0-9]{64}$/i.test(v);}
async function migrateMemberPins(){
  let changed=false;
  for(const m of S.membres){
    if(m.pin&&!isHashedPin(m.pin)){
      m.pin=await hashMemberPin(m.pin,m);
      changed=true;
    }
  }
  return changed;
}
async function memberPinMatches(m,pin){
  if(!m?.pin)return false;
  if(isHashedPin(m.pin))return (await hashMemberPin(pin,m))===m.pin;
  // Compatibilitat amb dades antigues: si encara hi havia clau en text pla,
  // validem una vegada, migrem a hash i desem.
  if(pin===m.pin){
    m.pin=await hashMemberPin(pin,m);
    save("membres");
    return true;
  }
  return false;
}

function normalizeSections(secs){
  const out=[];
  (Array.isArray(secs)?secs:[]).forEach(sec=>{
    if((sec==="social"||sec==="competicio")&&!out.includes(sec))out.push(sec);
  });
  // Norma del club: qualsevol soci de competició també és soci de social.
  if(out.includes("competicio")&&!out.includes("social"))out.push("social");
  return out.length?out:["social"];
}

function normalizeAllMemberSections(){
  let changed=false;
  S.membres.forEach(m=>{
    const norm=normalizeSections(m.sections);
    if(JSON.stringify(m.sections||[])!==JSON.stringify(norm)){m.sections=norm;changed=true;}
  });
  const me=S.memberId?S.membres.find(m=>m.id===S.memberId):null;
  if(me){S.userSections=normalizeSections(me.sections);}
  return changed;
}

function safeArr(a){return Array.isArray(a)?a:[];}
function memberFromEntry(e){
  if(!e)return null;
  return S.membres.find(m=>e.mid&&m.id===e.mid)||S.membres.find(m=>m.name===e.name&&m.groupId===e.gid)||S.membres.find(m=>m.name===e.name)||null;
}
function entryKey(e){
  const m=memberFromEntry(e);
  if(m?.id)return "id:"+m.id;
  return "name:"+String(e?.name||"").trim().toLowerCase();
}
function entryMatchesCurrent(e){
  if(!e||!S.userName)return false;
  if(S.memberId&&e.mid)return Number(e.mid)===Number(S.memberId);
  const m=memberFromEntry(e);
  if(S.memberId&&m?.id)return Number(m.id)===Number(S.memberId);
  return String(e.name||"")===String(S.userName||"");
}
function entryMatchesPerson(e,name,gid,mid=null){
  if(!e||!name)return false;
  if(mid&&e.mid)return Number(e.mid)===Number(mid);
  const m=memberFromEntry(e);
  if(mid&&m?.id)return Number(m.id)===Number(mid);
  return String(e.name||"")===String(name||"");
}
function entrySamePerson(a,b){
  if(!a||!b)return false;
  const ak=entryKey(a),bk=entryKey(b);
  return ak&&bk&&ak===bk;
}
function normalizeOutingEntries(o){
  if(!o)return false;
  let changed=false;
  if(!Array.isArray(o.signups)){o.signups=[];changed=true;}
  if(!Array.isArray(o.waitlist)){o.waitlist=[];changed=true;}
  const clean=list=>{
    const seen=new Set(),out=[];
    list.forEach(e=>{
      if(!e||!e.name)return;
      const m=memberFromEntry(e);
      const n={...e};
      if(m){
        if(!n.mid){n.mid=m.id;changed=true;}
        if(!n.gid){n.gid=m.groupId;changed=true;}
      }
      const k=entryKey(n);
      if(seen.has(k)){changed=true;return;}
      seen.add(k);out.push(n);
    });
    return out;
  };
  const signups=clean(o.signups);
  const waitlist=clean(o.waitlist).filter(w=>{
    const dup=signups.some(s=>entrySamePerson(s,w));
    if(dup)changed=true;
    return !dup;
  });
  if(signups.length!==o.signups.length||waitlist.length!==o.waitlist.length)changed=true;
  o.signups=signups;o.waitlist=waitlist;
  return changed;
}
function normalizeAllOutingEntries(){
  let changed=false;
  S.outings.forEach(o=>{if(normalizeOutingEntries(o))changed=true;});
  return changed;
}
function outingLabel(o){return `${o.title} · ${new Date(o.date).toLocaleDateString("ca-ES",{weekday:"short",day:"numeric",month:"short"})} · ${o.time} h`;}
function actorLabel(){return S.role==="patron"?"Patró":(S.userName||"Sistema");}

}
function addPersonalAviso(o,entry,type,title,message){
  const m=memberFromEntry(entry)||{};
  pushAviso({kind:"personal",type,outingId:o.id,groupId:o.groupId,toMemberId:m.id||entry.mid||null,toName:entry.name,toGid:entry.gid,title,text:message,message,read:false});
}
function canSeeAvis(a){
  const kind=a.kind||"public";
  if(kind==="public")return true;
  if(S.role==="patron")return true;
  if(kind==="log")return S.role==="cap"&&S.capGroupId===a.groupId;
  if(kind==="personal")return (a.toMemberId&&a.toMemberId===S.memberId)||(!a.toMemberId&&a.toName===S.userName&&a.toGid===S.userGroupId);
  return false;
}
function unreadAvisosCount(){
  if(!S.memberId)return 0;
  return S.avisos.filter(a=>a.kind==="personal"&&!a.read&&canSeeAvis(a)).length;
}
function markAvisRead(id){const a=S.avisos.find(x=>x.id===id);if(a&&a.kind==="personal"&&canSeeAvis(a)){a.read=true;save("avisos");render();}}

  S.avisos.forEach(a=>{if(a.kind==="personal"&&!a.read&&canSeeAvis(a)){a.read=true;changed=true;}});
  if(changed)save("avisos");
  render();
}
function todayStr(){return isoDate(new Date());}
function isPastOuting(o){return (o.date||"")<todayStr();}
function sortOutings(a,b){return (a.date||"").localeCompare(b.date||"")||(a.time||"").localeCompare(b.time||"");}
function memberIsInOuting(o,name=S.userName,gid=S.userGroupId,mid=S.memberId){
  return safeArr(o.signups).some(s=>entryMatchesPerson(s,name,gid,mid))||safeArr(o.waitlist).some(s=>entryMatchesPerson(s,name,gid,mid));
}
function canSeeOuting(o){
  if(S.role==="patron")return true;
  if(S.role==="cap")return o.groupId===S.capGroupId||o.isOpen;
  if(S.role==="soci")return o.groupId===S.userGroupId||o.isOpen||memberIsInOuting(o);
  return false;
}

      ${btnT("Enrere","go({loginStep:'soci-list',pinErr:false,pinErrMsg:''})")}

  }

  // ── FORMULARI DE REGISTRE ─────────────────────────────────────────────────
  if(S.loginStep==="register"){
    const grpOpts=S.groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join("");
    const secBtn=(sec,label)=>`<button onclick="togRegSec('${sec}')" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid ${S.regSections.includes(sec)?"#fff":"rgba(255,255,255,.2)"};background:${S.regSections.includes(sec)?"rgba(255,255,255,.15)":"transparent"};color:#fff;font-size:13px;font-weight:${S.regSections.includes(sec)?700:400};cursor:pointer">${label}</button>`;
    return wrap(`<div style="width:100%;max-width:320px">
      <div style="color:#fff;font-size:18px;font-weight:700;text-align:center;margin-bottom:18px">Crear compte nou</div>
      ${txtInp("reg-nom","Nom i cognom *")}
      <select id="reg-grup" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(27,58,122,.9);color:#fff;font-size:14px;outline:none;box-sizing:border-box;margin-bottom:10px">${grpOpts}</select>

        <div style="display:flex;gap:8px">${secBtn("competicio","🏆 Competició")}${secBtn("social","⚓ Social")}</div>
      </div>
      ${pinInp("reg-pin","Crea la teva clau (mínim 6 car.) *")}
      ${pinInp("reg-pin2","Confirma la clau *")}
      ${errDiv(S.regErr)}
      ${btnP("ENVIAR SOL·LICITUD","submitRegister()")}
      ${btnT("Enrere","go({loginStep:'choose'})")}
      <div style="color:rgba(255,255,255,.3);font-size:11px;text-align:center;margin-top:8px">El patró haurà d'aprovar el teu compte</div>
    </div>`);
  }

  // ── CONFIRMACIÓ DE REGISTRE ───────────────────────────────────────────────
  if(S.loginStep==="register-ok")return wrap(`<div style="width:100%;max-width:300px;text-align:center">
    <div style="font-size:56px;margin-bottom:16px">✅</div>
    <div style="color:#fff;font-size:20px;font-weight:700;margin-bottom:10px">Sol·licitud enviada!</div>
    <div style="color:rgba(255,255,255,.5);font-size:14px;margin-bottom:28px;line-height:1.6">El patró rebrà la teva petició i t'avisarà quan el compte estigui aprovat.</div>
    ${btnS("Tornar a l'inici","go({loginStep:'choose'})")}
  </div>`);

  return wrap("");
}

// ── Funcions d'autenticació ────────────────────────────────────────────────────
async function tryPin(){
  const v=document.getElementById("pin-in")?.value||"";
  try{
    if(await hashPatronPin(v)===PATRON_HASH){
      store.set("ldm:session",{role:"patron",authVersion:SECURITY_VERSION});
      go({role:"patron",loginStep:"choose",pinErr:false,pinErrMsg:""});
    } else {
      go({pinErr:true,pinErrMsg:"Codi incorrecte"});
    }
  }catch(e){
    go({pinErr:true,pinErrMsg:e.message||"No s'ha pogut validar la clau"});
  }
}

function selectSoci(id){
  go({selectedMemberId:id,loginStep:"soci-pin",pinErr:false,pinErrMsg:""});
}

async function tryLoginSoci(){
  const m=S.membres.find(x=>x.id===S.selectedMemberId);
  if(!m)return;
  const pin=document.getElementById("pin-in")?.value||"";
  try{
    if(!m.pin){
      // Primera vegada: creació de clau. Es guarda sempre en hash, mai en text pla.
      const pin2=document.getElementById("pin-in2")?.value||"";
      if(pin.length<MIN_PIN_LEN)return go({pinErr:true,pinErrMsg:`La clau ha de tenir mínim ${MIN_PIN_LEN} caràcters`});
      if(pin!==pin2)return go({pinErr:true,pinErrMsg:"Les claus no coincideixen"});
      m.pin=await hashMemberPin(pin,m);
      save("membres");
    } else {
      if(!(await memberPinMatches(m,pin)))return go({pinErr:true,pinErrMsg:"Clau incorrecta"});
    }
    doLoginSoci(m);
  }catch(e){
    go({pinErr:true,pinErrMsg:e.message||"No s'ha pogut validar la clau"});
  }
}

function doLoginSoci(m){
  m.sections=normalizeSections(m.sections);
  const role=m.isCap?"cap":"soci";
  store.set("ldm:session",{role,memberId:m.id,pinHash:m.pin,authVersion:SECURITY_VERSION});
  go({role,capGroupId:m.isCap?m.groupId:null,memberId:m.id,userName:m.name,
      userGroupId:m.groupId,userSections:m.sections,loginStep:"choose",
      pinErr:false,pinErrMsg:"",section:m.sections.includes("competicio")?"competicio":"social"});
}

function togRegSec(sec){
  const next=S.regSections.includes(sec)?S.regSections.filter(x=>x!==sec):[...S.regSections,sec];
  go({regSections:normalizeSections(next)});
}

async function submitRegister(){
  const nom=(document.getElementById("reg-nom")?.value||"").trim();
  const gid=parseInt(document.getElementById("reg-grup")?.value)||S.groups[0]?.id;
  const pin=document.getElementById("reg-pin")?.value||"";
  const pin2=document.getElementById("reg-pin2")?.value||"";
  if(!nom)return go({regErr:"El nom és obligatori"});
  if(!S.regSections.length)return go({regErr:"Selecciona almenys una secció"});
  if(pin.length<MIN_PIN_LEN)return go({regErr:`La clau ha de tenir mínim ${MIN_PIN_LEN} caràcters`});
  if(pin!==pin2)return go({regErr:"Les claus no coincideixen"});
  try{
    const member={id:Date.now(),name:nom,groupId:gid,sections:normalizeSections(S.regSections),pin:null,isCap:false,pending:true};
    member.pin=await hashMemberPin(pin,member);
    S.membres.push(member);
    save("membres");
    go({loginStep:"register-ok"});
  }catch(e){
    go({regErr:e.message||"No s'ha pogut crear la clau"});
  }
}

// ── Accions del panell de membres ──────────────────────────────────────────────
function approvePending(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m){m.sections=normalizeSections(m.sections);m.pending=false;save("membres");render();}}
function rejectPending(id){if(S.role!=="patron")return;if(!confirm("Rebutjar la sol·licitud?"))return;S.membres=S.membres.filter(m=>m.id!==id);save("membres");render();}
function resetMemberPin(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m&&confirm("Reset de clau de "+m.name+"?\nHaurà de crear una nova clau al proper accés.")){m.pin=null;save("membres");render();}}
function toggleIsCap(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m){m.isCap=!m.isCap;save("membres");render();}}

function fetchMeteo(){
  fetch("https://api.open-meteo.com/v1/forecast?latitude=41.7833&longitude=3.0167&current=temperature_2m,wind_speed_10m,wind_direction_10m,weathercode&daily=temperature_2m_max&timezone=Europe%2FMadrid&forecast_days=5")
    .then(r=>r.json()).then(d=>{S.meteo=d;S.meteoLoading=false;render();}).catch(()=>{S.meteoLoading=false;render();});
}

function renderCalendar(){
  const y=S.calYear,mo=S.calMonth,dim=new Date(y,mo+1,0).getDate();
  let sdow=new Date(y,mo,1).getDay();sdow=sdow===0?6:sdow-1;
  const sessDates=new Set(S.sessions.map(s=>s.date)),tod=td();
  const hdr=["Dl","Dt","Dc","Dj","Dv","Ds","Dg"].map(d=>`<div style="font-size:10px;color:${MUTED};text-align:center;padding:3px 0">${d}</div>`).join("");
  let cells="";for(let i=0;i<sdow;i++)cells+=`<div></div>`;
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,mo,d),dow=dt.getDay(),isWC=dow===1||dow===3;
    const ds=`${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const hasSess=sessDates.has(ds),isToday=ds===tod,isPast=ds<tod;
    let bg="transparent",col=isPast?"#c5c0b8":"#1a1a18",fw=400,brd="none";
    if(isWC){bg=hasSess?DARK:(isPast?"#dde5f5":"#e8edf8");col=hasSess?"#fff":(isPast?MUTED:DARK);fw=600;}
    if(isToday)brd=`2px solid ${RED}`;
    cells+=`<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:${bg};color:${col};font-size:12px;font-weight:${fw};border:${brd}">${d}</div>`;
  }
  const prev=mo===0?{m:11,y:y-1}:{m:mo-1,y:y},next=mo===11?{m:0,y:y+1}:{m:mo+1,y:y};
  return cc(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><button onclick="go({calMonth:${prev.m},calYear:${prev.y}})" style="background:none;border:none;color:${MUTED};font-size:22px;cursor:pointer;padding:0 8px">‹</button><div style="font-size:14px;font-weight:600;color:#1a1a18">${MONTHS[mo]} ${y}</div><button onclick="go({calMonth:${next.m},calYear:${next.y}})" style="background:none;border:none;color:${MUTED};font-size:22px;cursor:pointer;padding:0 8px">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${hdr}${cells}</div><div style="display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:.5px solid #f0ede6"><div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:3px;background:#e8edf8"></div><span style="font-size:10px;color:${MUTED}">Entreno Dl/Dc</span></div><div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:3px;background:${DARK}"></div><span style="font-size:10px;color:${MUTED}">Registrat</span></div></div>`);
}

function renderOutingCard(o){
  normalizeOutingEntries(o);
  const grp=S.groups.find(g=>g.id===o.groupId);
  if(!o.waitlist)o.waitlist=[];
  const total=o.signups.length,pct=Math.min(100,Math.round((total/o.capacity)*100)),isFull=total>=o.capacity,isPast=isPastOuting(o);
  const prefList=o.signups.filter(s=>s.gid===o.groupId),openList=o.signups.filter(s=>s.gid!==o.groupId);
  const isMyGroup=S.userGroupId===o.groupId||S.capGroupId===o.groupId;
  const isMyCap=S.role==="cap"&&S.capGroupId===o.groupId,isPatron=S.role==="patron";
  const amIn=S.role==="soci"&&o.signups.some(entryMatchesCurrent);
  const amInWait=S.role==="soci"&&o.waitlist.some(entryMatchesCurrent);
  const canAccess=isMyGroup||o.isOpen;
  const canJoin=S.role==="soci"&&!isPast&&!amIn&&!amInWait&&!isFull&&canAccess;
  const canWait=S.role==="soci"&&!isPast&&!amIn&&!amInWait&&isFull&&canAccess;
  const cantAccess=S.role==="soci"&&!isPast&&!amIn&&!amInWait&&!isMyGroup&&!o.isOpen;
  const dateStr=new Date(o.date).toLocaleDateString("ca-ES",{weekday:"short",day:"numeric",month:"short"});
  const shortGroup=gid=>esc(gname(gid).split(" · ")[0]||"—");
  const personChips=(arr,mode="signups")=>arr.length?`<div style="display:flex;flex-wrap:wrap;gap:6px">${arr.map(s=>{
    const m=memberFromEntry(s),gid=s.gid||m?.groupId;
    const hasOwner=o.groupId!==null&&o.groupId!==undefined&&o.groupId!=="";
    const isOwner=hasOwner&&Number(gid)===Number(o.groupId);
    const isWait=mode==="wait";
    const bg=isWait?"#e8a020":(isOwner?DARK:GREEN);
    const br=isWait?"#d38b00":(isOwner?DARK:GREEN);
    const groupTxt=hasOwner?shortGroup(gid):"Club";
    const title=isWait?"Llista d'espera":(isOwner?"Del grup de la sortida":"D'un altre grup");
    return `<span title="${title}" style="display:inline-flex;align-items:center;gap:6px;max-width:100%;background:${bg};border:1px solid ${br};border-radius:999px;padding:5px 9px;color:#fff;font-size:12px;font-weight:600;line-height:1.15;box-shadow:0 1px 2px rgba(0,0,0,.06)">
      <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px">${esc(s.name)}</span>
      <span style="font-size:10px;font-weight:700;opacity:.78;background:rgba(255,255,255,.18);border-radius:999px;padding:1px 6px;white-space:nowrap">${groupTxt}</span>
    </span>`;
  }).join("")}</div>`:"";
  const outingLegend=o.groupId&&o.isOpen?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"><span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:${MUTED}"><span style="width:9px;height:9px;border-radius:50%;background:${DARK}"></span>Del grup</span><span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:${MUTED}"><span style="width:9px;height:9px;border-radius:50%;background:${GREEN}"></span>Altres grups</span></div>`:"";
  // 🔒/🔓 badge — autogenerades comencen tancades, cap/patró les obre
  const badge=o.isOpen
    ?`<span style="background:#e6f4ee;color:${GREEN};font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600">🔓 Oberta</span>`
    :`<span style="background:#eef0fa;color:${DARK};font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600">🔒 ${grp?.name||""}</span>`;

  // Llista d'espera (visible sempre que n'hi hagi)
  const waitBlock=o.waitlist.length?`<div style="padding:8px 14px;border-bottom:.5px solid #f5f3ee;background:#fffdf7"><div style="font-size:10px;color:#b07a10;margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">⏳ LLISTA D'ESPERA (${o.waitlist.length})</div>${personChips(o.waitlist,"wait")}</div>`:"";

function getUserVote(p){
  if(!S.userName)return null;
  for(const o of p.options){if((p.votes[o]||[]).includes(S.userName))return o;}
  return null;
}

function renderPollCard(p){
  p.votes=p.votes||{};
  p.options=(p.options||[]).filter(Boolean);
  p.options.forEach(o=>{if(!Array.isArray(p.votes[o]))p.votes[o]=[];});
  const mv=getUserVote(p);
  const tot=p.options.reduce((a,o)=>a+(p.votes[o]?.length||0),0);
  const win=p.closed&&p.options.length?p.options.reduce((a,b)=>(p.votes[b]?.length||0)>(p.votes[a]?.length||0)?b:a,p.options[0]):null;
  const canVote=!p.closed&&!!S.userName;
  const rows=p.options.map((opt,optIdx)=>{
    const voters=p.votes[opt]||[];
    const cnt=voters.length;
    const pct=tot>0?Math.round((cnt/tot)*100):0;
    const isW=win===opt,isMy=mv===opt;
    const key=pollKey(p.id,opt);
    const open=!!(S.pollVotersOpen&&S.pollVotersOpen[key]);
    const barCol=isW?RED:(isMy?DARK:"#c8d4f0");
    const voteAction=canVote?`onclick="castVoteByIndex(${p.id},${optIdx})"`:"";
    const voterList=open?`<div style="margin-top:8px;padding:8px 10px;background:#faf8f3;border-radius:10px;border:.5px solid #f0ede6"><div style="font-size:10px;color:${MUTED};font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Votants</div>${voters.length?voters.map(n=>`<span style="display:inline-block;background:#fff;border:.5px solid ${BORDER};border-radius:20px;font-size:11px;padding:3px 8px;margin:2px;color:#1a1a18">${esc(n)}</span>`).join(""):`<div style="font-size:12px;color:${MUTED};font-style:italic">Encara no hi ha cap vot</div>`}</div>`:"";
    return`<div style="margin-bottom:9px;padding:10px 10px 9px;background:${isMy?"#eef0fa":"#f8f9ff"};border:1.5px solid ${isMy?DARK:BORDER};border-radius:12px;${canVote?"cursor:pointer":""}" ${voteAction}>
      <div style="display:flex;align-items:flex-start;gap:9px">
        <div style="width:18px;height:18px;border-radius:50%;border:1.5px solid ${isMy?DARK:BORDER};background:${isMy?DARK:"#fff"};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px">${isMy?"✓":""}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px">
            <div style="font-size:13px;font-weight:${isMy||isW?700:500};color:${isW?RED:(isMy?DARK:"#1a1a18")};line-height:1.35;word-break:break-word">${isW&&p.closed?"🏆 ":""}${esc(opt)}</div>
            <div style="font-size:12px;font-weight:700;color:${isW?RED:DARK};white-space:nowrap">${cnt} · ${pct}%</div>
          </div>
          <div style="background:#f0ede8;border-radius:20px;height:8px;overflow:hidden"><div style="background:${barCol};height:8px;border-radius:20px;width:${pct}%"></div></div>
          <button onclick="event.stopPropagation();togglePollVotersByIndex(${p.id},${optIdx})" style="margin-top:7px;background:transparent;border:none;color:${DARK};font-size:11px;font-weight:700;cursor:pointer;padding:0">${open?"Amagar votants":"Veure votants"} · ${cnt}</button>
          ${voterList}
        </div>
      </div>
    </div>`;
  }).join("");
  const sb=p.closed?`<span style="background:#fff0f0;color:${RED};font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600">Tancada</span>`:`<span style="background:#e6f4ee;color:${GREEN};font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600">Oberta</span>`;
  const pa=S.role==="patron"?`<div style="display:flex;gap:8px;padding:10px 14px;border-top:.5px solid #f5f3ee">${!p.closed?`<button onclick="closePoll(${p.id})" style="flex:1;padding:8px;background:transparent;border:.5px solid ${RED};border-radius:8px;color:${RED};font-size:12px;cursor:pointer;font-weight:600">Tancar votació</button>`:""}<button onclick="delPoll(${p.id})" style="padding:8px 12px;background:transparent;border:.5px solid ${BORDER};border-radius:8px;color:${MUTED};font-size:12px;cursor:pointer">🗑</button></div>`:"";
  const hint=!p.closed&&S.userName?`<div style="font-size:11px;color:${MUTED};margin-bottom:10px">Pots tocar una opció per votar o canviar el vot. Els vots són visibles per a tothom.</div>`:"";
  return`<div style="background:#fff;border-radius:14px;margin:10px 14px 0;border:.5px solid ${BORDER};overflow:hidden"><div style="padding:12px 14px 0"><div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px"><div style="font-size:14px;font-weight:700;color:#1a1a18;flex:1;line-height:1.35">${esc(p.question)}</div>${sb}</div><div style="font-size:11px;color:${MUTED};margin-bottom:8px">${tot} vot${tot!==1?"s":""} · ${esc(p.date||"")}</div>${hint}${rows}${mv&&!p.closed?`<div style="font-size:11px;color:${MUTED};margin-top:2px;margin-bottom:12px">Has votat: <strong>${esc(mv)}</strong></div>`:`<div style="height:12px"></div>`}</div>${pa}</div>`;
}

  const personalCards=personal.map(a=>`<div style="border-radius:12px;margin:8px 14px 0;overflow:hidden;border:1.5px solid ${a.read?BORDER:GREEN}"><div style="background:${a.read?"#f5f5f5":"#e6f4ee"};padding:4px 12px;font-size:10px;font-weight:700;color:${a.read?MUTED:GREEN};text-transform:uppercase">${a.read?"✓ Avís llegit":"🔔 Avís personal"}</div><div style="background:#fff;padding:12px 14px"><div style="font-size:14px;font-weight:700;color:#1a1a18;margin-bottom:5px">${a.title||"Avís"}</div><div style="font-size:13px;color:#1a1a18;line-height:1.55;margin-bottom:8px">${a.message||a.text||""}</div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="font-size:11px;color:${MUTED}">${a.toName?`Per a ${a.toName} · `:""}${a.date||""}</span>${!a.read&&S.role!=="patron"?`<button onclick="markAvisRead(${a.id})" style="background:${GREEN};border:none;border-radius:6px;color:#fff;font-size:11px;padding:4px 8px;cursor:pointer;font-weight:600">Marcar llegit</button>`:""}</div></div></div>`).join("");
  const logCards=logs.slice(0,120).map(a=>`<div style="background:#fff;border-radius:10px;margin:6px 14px 0;padding:10px 12px;border:.5px solid ${BORDER}"><div style="font-size:13px;color:#1a1a18;line-height:1.4">${a.text}</div><div style="font-size:10px;color:${MUTED};margin-top:5px">${gname(a.groupId)} · ${a.byName||"Sistema"} · ${a.date||""}</div></div>`).join("");

  return createBtn+form+filterBar+markAll+body+empty+`<div style="height:14px"></div>`;

function renderEstadistiques(){
  const scope=S.role==="patron"?S.outings:S.role==="cap"?S.outings.filter(o=>o.groupId===S.capGroupId):S.outings.filter(o=>memberIsInOuting(o));
  const past=scope.filter(isPastOuting);
  const future=scope.filter(o=>!isPastOuting(o));
  const signups=scope.reduce((a,o)=>a+safeArr(o.signups).length,0);
  const waits=scope.reduce((a,o)=>a+safeArr(o.waitlist).length,0);
  const capTotal=scope.reduce((a,o)=>a+(o.capacity||0),0);
  const occ=capTotal?Math.round((signups/capTotal)*100):0;
  const mine=S.role==="soci"?scope.filter(o=>safeArr(o.signups).some(s=>s.name===S.userName&&s.gid===S.userGroupId)):[];
  let html=strow([[scope.length,"sortides"],[future.length,"properes"],[past.length,"històric"]]);
  html+=strow([[signups,"apuntats"],[waits,"espera"],[occ+"%","ocupació"]]);
  if(S.role==="soci"){
    html+=cc(`${lbl("La meva activitat")}<div style="font-size:14px;color:#1a1a18;line-height:1.6">Has estat apuntat/da a <strong>${mine.length}</strong> sortida${mine.length!==1?"s":""}. ${scope.length-mine.length>0?`Tens <strong>${scope.length-mine.length}</strong> sortida${scope.length-mine.length!==1?"s":""} on has estat o estàs en llista d'espera.`:""}</div>`);
  }
  if(S.role==="patron"||S.role==="cap"){
    const groups=(S.role==="patron"?S.groups:S.groups.filter(g=>g.id===S.capGroupId)).map(g=>{
      const os=S.outings.filter(o=>o.groupId===g.id);
      const s=os.reduce((a,o)=>a+safeArr(o.signups).length,0);
      const c=os.reduce((a,o)=>a+(o.capacity||0),0);
      const w=os.reduce((a,o)=>a+safeArr(o.waitlist).length,0);
      const avg=c?Math.round((s/c)*100):0;
      return {g,os,s,c,w,avg};
    });
    const rows=groups.map(x=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:.5px solid #f0ede6"><div><div style="font-size:13px;font-weight:600;color:#1a1a18">${x.g.name}</div><div style="font-size:11px;color:${MUTED}">${x.os.length} sortides · ${x.s}/${x.c||0} places · ${x.w} espera</div></div><div style="font-size:18px;font-weight:700;color:${x.avg>=80?RED:DARK}">${x.avg}%</div></div>`).join("");
    html+=cc(`${lbl(S.role==="patron"?"Ocupació per grup":"Ocupació del meu grup")}${rows||`<div style="font-size:13px;color:${MUTED};text-align:center;padding:1rem 0">Encara no hi ha dades</div>`}`);
    const count={};
    scope.forEach(o=>safeArr(o.signups).forEach(s=>{count[s.name]=(count[s.name]||0)+1;}));
    const top=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,8);
    if(top.length){
      html+=cc(`${lbl("Socis amb més assistència")} ${top.map(([n,c],i)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:${i<top.length-1?'.5px solid #f0ede6':'none'}"><span style="font-size:13px;color:#1a1a18">${n}</span><strong style="font-size:13px;color:${DARK}">${c}</strong></div>`).join("")}`);
    }
  }
  return html+`<div style="height:14px"></div>`;
}

function render(){

    root.innerHTML=renderLogin();
    // Focus + Enter per al camp de PIN
    const p=document.getElementById("pin-in");
    if(p){
      p.focus();
      const fn=S.loginStep==="patron-pin"?tryPin:S.loginStep==="soci-pin"?tryLoginSoci:null;
      if(fn)p.onkeydown=e=>{if(e.key==="Enter")fn();};
    }

    if(p2)p2.onkeydown=e=>{if(e.key==="Enter")tryLoginSoci();};
    return;
  }
  const myGid=S.userGroupId||S.capGroupId;

  const hasC=S.role==="patron"||S.userSections.includes("competicio");

  const hasBoth=hasC&&hasS;

  if(!hasC&&S.section==="competicio")S.section=hasS?"social":"social";
  if(!hasS&&S.section==="social")S.section=hasC?"competicio":"social";
  if(S.screen==="resultats"&&!hasC)S.screen="inici";

  if(hasS)nav.push(["entrena","⛵","Sortides","social"]);
  if(hasC)nav.push(["resultats","🏆","Resultats",null]);
  nav.push(["vots","📊","Vots",null]);
  nav.push(["estadistiques","📈","Stats",null]);
  if(S.role==="patron")nav.push(["membres","👥","Membres",null]);
  nav.push(["avisos","📢","Avisos",null]);
  const screens={inici:renderInici,entrena:renderEntrena,resultats:hasC?renderResultats:renderInici,vots:renderVots,estadistiques:renderEstadistiques,membres:renderMembres,avisos:renderAvisos};
  const titles={inici:"Inici",entrena:S.section==="social"?"Sortides":"Entrenaments",resultats:"Resultats",vots:"Votacions",estadistiques:"Estadístiques",membres:"Membres",avisos:"Avisos"};
  const userLabel=S.role==="patron"?"Patró":(S.userName||"");
  const userSub=S.role==="cap"?`${userLabel} · Cap ${gname(S.capGroupId).split(" · ")[0]}`:userLabel;
  const rb=S.role==="patron"?`<span style="background:${RED};color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700">PATRÓ</span>`:S.role==="cap"?`<span style="background:rgba(255,255,255,.15);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600">Cap</span>`:myGid?`<span style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);font-size:10px;padding:2px 8px;border-radius:20px">${gname(myGid).split(" · ")[0]}</span>`:"";

  const btnS=hasS?`<button onclick="go({section:'social',showForm:false})" style="flex:1;padding:7px;font-size:13px;font-weight:600;border:none;border-radius:8px;cursor:pointer;background:${S.section==="social"?DARK:"transparent"};color:${S.section==="social"?"#fff":MUTED}">⚓ Social</button>`:"";

  root.innerHTML=`<div style="background:linear-gradient(135deg,${DARK},#122860);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:10px;min-width:0"><div style="background:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:2px solid ${RED};flex-shrink:0">${emblema.replace('width="50" height="50"','width="28" height="28"')}</div><div style="min-width:0"><div style="font-size:11px;opacity:.5;letter-spacing:.05em">LLOP DE MAR</div><div style="font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${titles[S.screen]||"Inici"}</div>${userSub?`<div style="font-size:11px;opacity:.75;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px">👤 ${userSub}</div>`:""}</div></div><div style="display:flex;align-items:center;gap:8px;flex-shrink:0">${rb}<button onclick="doLogout()" style="background:rgba(255,255,255,.1);border:none;border-radius:6px;color:rgba(255,255,255,.6);padding:5px 10px;font-size:12px;cursor:pointer">Sortir</button></div></div>${st}<div style="padding-bottom:70px">${(screens[S.screen]||renderInici)()}</div><div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;border-top:.5px solid ${BORDER};background:#fff;z-index:100">${nav.map(([k,ic,lb,sec])=>{const isActive=S.screen===k&&(!sec||S.section===sec);const clk=sec?`go({screen:'${k}',section:'${sec}',showForm:false,showAvisForm:false,showMembreForm:false,showOutingHistory:false})`:`go({screen:'${k}',showForm:false,showAvisForm:false,showMembreForm:false,showOutingHistory:false})`;return`<button onclick="${clk}" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px 10px;cursor:pointer;font-size:9px;color:${isActive?DARK:MUTED};gap:2px;border:none;background:none;font-weight:${isActive?700:400};position:relative"><span style="font-size:20px">${ic}</span>${lb}${k==="vots"&&opc>0&&S.screen!=="vots"?`<span style="position:absolute;top:5px;right:calc(50% - 18px);background:${RED};color:#fff;font-size:9px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center">${opc}</span>`:""}${k==="membres"&&pendingCount>0&&S.screen!=="membres"?`<span style="position:absolute;top:5px;right:calc(50% - 18px);background:${RED};color:#fff;font-size:9px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center">${pendingCount}</span>`:""}${k==="avisos"&&avisUnread>0&&S.screen!=="avisos"?`<span style="position:absolute;top:5px;right:calc(50% - 18px);background:${GREEN};color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;padding:0 4px;border-radius:9px;display:flex;align-items:center;justify-content:center">${avisUnread}</span>`:""}</button>`}).join("")}</div>${S.showLogoutConfirm?renderLogoutModal():""}`;

// ── Accions generals ────────────────────────────────────────────────────────────
function togSec(sec){const s=S.membreSections.includes(sec)?S.membreSections.filter(x=>x!==sec):[...S.membreSections,sec];go({membreSections:normalizeSections(s)});}
function addMembre(){if(S.role!=="patron")return;const n=document.getElementById("m-nom")?.value?.trim()||"";if(!n||!S.membreSections.length)return;const gid=parseInt(document.getElementById("m-grup")?.value)||S.groups[0]?.id;S.membres.push({id:Date.now(),name:n,groupId:gid,sections:normalizeSections(S.membreSections),pin:null,isCap:false,pending:false});save("membres");go({showMembreForm:false,membreSections:["social"]});}
function delMembre(id){if(S.role!=="patron")return;if(!confirm("Eliminar el soci?"))return;S.membres=S.membres.filter(m=>m.id!==id);save("membres");render();}
function signup(oid){
  const o=S.outings.find(x=>x.id===oid);
  if(!o||S.role!=="soci"||isPastOuting(o))return;
  normalizeOutingEntries(o);
  if(!o.waitlist)o.waitlist=[];
  const isMyGroup=S.userGroupId===o.groupId;
  if(!isMyGroup&&!o.isOpen)return;
  const alreadyIn=o.signups.some(entryMatchesCurrent);
  const alreadyWait=o.waitlist.some(entryMatchesCurrent);
  if(alreadyIn||alreadyWait)return;
  const entry={name:S.userName,gid:S.userGroupId,mid:S.memberId};
  if(o.signups.length>=o.capacity){
    o.waitlist.push(entry);
    addOutingLog(o,"waitlist_join",`${S.userName} entra a la llista d'espera de ${outingLabel(o)}.`);
  } else {
    o.signups.push(entry);
    addOutingLog(o,"signup",`${S.userName} s'apunta a ${outingLabel(o)}.`);
  }
  save("outings");save("avisos");render();
}
function unsignup(oid){
  const o=S.outings.find(x=>x.id===oid);
  if(!o||S.role!=="soci"||isPastOuting(o))return;
  normalizeOutingEntries(o);
  if(!o.waitlist)o.waitlist=[];
  const wasIn=o.signups.some(entryMatchesCurrent);
  const wasWait=o.waitlist.some(entryMatchesCurrent);
  o.signups=o.signups.filter(s=>!entryMatchesCurrent(s));
  o.waitlist=o.waitlist.filter(s=>!entryMatchesCurrent(s));
  if(wasIn)addOutingLog(o,"unsignup",`${S.userName} es desapunta de ${outingLabel(o)}.`);
  if(wasWait)addOutingLog(o,"waitlist_leave",`${S.userName} surt de la llista d'espera de ${outingLabel(o)}.`);
  // Si estava a signups i hi ha gent esperant, el primer entra automàticament
  if(wasIn&&o.waitlist.length>0&&o.signups.length<o.capacity){
    const promoted=o.waitlist.shift();
    o.signups.push(promoted);
    addPersonalAviso(o,promoted,"waitlist_promoted","Has entrat a la sortida",`S'ha alliberat una plaça i has entrat automàticament a ${outingLabel(o)}.`);
    addOutingLog(o,"waitlist_promoted",`${promoted.name} entra automàticament des de la llista d'espera a ${outingLabel(o)}.`);
  }
  save("outings");save("avisos");render();
}
function openOut(oid){
  const o=S.outings.find(x=>x.id===oid);
  if(!o||isPastOuting(o))return;
  const isPatron=S.role==="patron";
  const isOwnCap=S.role==="cap"&&S.capGroupId===o.groupId;
  if(!isPatron&&!(isOwnCap&&o.signups.length<=8))return;
  if(!o.isOpen){
    o.isOpen=true;
    addOutingLog(o,"outing_opened",`${actorLabel()} obre a tothom la inscripció de ${outingLabel(o)}.`);
    save("outings");save("avisos");render();
  }
}
function delOut(oid){
  if(S.role!=="patron")return;
  if(!confirm("Cancel·lar la sortida?"))return;
  const o=S.outings.find(x=>x.id===oid);
  if(o)addOutingLog(o,"outing_deleted",`El patró cancel·la ${outingLabel(o)}.`);
  S.outings=S.outings.filter(o=>o.id!==oid);
  save("outings");save("avisos");render();
}
function addOut(){
  if(S.role!=="patron")return;
  const t=document.getElementById("o-title")?.value?.trim();if(!t)return;
  const d=document.getElementById("o-date")?.value||td();

  S.outings.push(o);
  addOutingLog(o,"outing_created",`El patró crea ${outingLabel(o)}.`);
  save("outings");save("avisos");go({showForm:false});
}
function addSess(){if(!(S.role==="patron"||(S.role==="cap"&&S.userSections.includes("competicio"))))return;const t=document.getElementById("f-type")?.value||"";if(!t)return;S.sessions.unshift({id:Date.now(),type:t,date:document.getElementById("f-date")?.value||"",duration:parseInt(document.getElementById("f-dur")?.value)||0,km:parseFloat(document.getElementById("f-km")?.value)||0,section:"competicio",note:""});save("sessions");go({showForm:false});}
function delSess(id){S.sessions=S.sessions.filter(s=>s.id!==id);save("sessions");render();}
function addRes(){const r=document.getElementById("r-race")?.value||"";if(!r)return;S.results.unshift({id:Date.now(),race:r,date:document.getElementById("r-date")?.value||"",place:document.getElementById("r-place")?.value||"",pos:S.newPos,points:PTS[S.newPos]||10});save("results");go({showForm:false,newPos:1});}
function delRes(id){S.results=S.results.filter(r=>r.id!==id);save("results");render();}
function createAvis(){const t=document.getElementById("avis-text")?.value?.trim()||"";if(!t)return;const pin=document.getElementById("avis-pin")?.checked||false;pushAviso({kind:"public",text:t,pin});save("avisos");go({showAvisForm:false});}
function delAvis(id){S.avisos=S.avisos.filter(a=>a.id!==id);save("avisos");render();}
function togglePin(id){const a=S.avisos.find(x=>x.id===id);if(a){a.pin=!a.pin;save("avisos");render();}}
function addOpt(){go({pollOpts:[...S.pollOpts,""]});}
function rmOpt(i){go({pollOpts:S.pollOpts.filter((_,j)=>j!==i)});}
function togglePollVoters(pid,opt){const key=pollKey(pid,opt);const open=Object.assign({},S.pollVotersOpen||{});open[key]=!open[key];go({pollVotersOpen:open});}
function togglePollVotersByIndex(pid,idx){const p=S.polls.find(x=>x.id===pid);const opt=p?.options?.[idx];if(opt==null)return;togglePollVoters(pid,opt);}
function createPoll(){const q=document.getElementById("poll-q")?.value?.trim()||"";if(!q)return;const opts=S.pollOpts.map((_,i)=>document.getElementById(`opt-${i}`)?.value?.trim()||"").filter(Boolean);if(opts.length<2)return;const votes={};opts.forEach(o=>votes[o]=[]);S.polls.unshift({id:Date.now(),question:q,options:opts,votes,closed:false,date:td()});save("polls");go({showForm:false,pollQ:"",pollOpts:["",""]});}
function castVote(pid,opt,name){const p=S.polls.find(x=>x.id===pid);name=name||S.userName;if(!p||p.closed||!name)return;p.votes=p.votes||{};(p.options||[]).forEach(o=>{if(!Array.isArray(p.votes[o]))p.votes[o]=[];p.votes[o]=p.votes[o].filter(n=>n!==name);});if(!p.votes[opt])p.votes[opt]=[];if(!p.votes[opt].includes(name))p.votes[opt].push(name);save("polls");render();}
function castVoteByIndex(pid,idx){const p=S.polls.find(x=>x.id===pid);const opt=p?.options?.[idx];if(opt==null)return;castVote(pid,opt,S.userName);}
function closePoll(pid){const p=S.polls.find(x=>x.id===pid);if(p){p.closed=true;save("polls");render();}}
function delPoll(pid){S.polls=S.polls.filter(p=>p.id!==pid);save("polls");render();}

// ── Sortides automàtiques (dissabte → genera Dl+Dc setmana vinent) ────────────
const GROUP_TIMES={1:"20:15",2:"19:00",3:"17:45",4:"16:30",5:"09:15",6:"08:00"};

// Data local YYYY-MM-DD. Evita el desplaçament d'un dia que pot provocar toISOString()
// quan el navegador està en zona Europe/Madrid a primera hora del dia.
function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dateAtLocalNoon(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12,0,0,0);}
function daysBetweenDates(a,b){
  const da=dateAtLocalNoon(a), db=dateAtLocalNoon(b);
  return Math.round((da-db)/86400000);
}
function parseLocalDate(ds){
  const [y,m,d]=(ds||"").split("-").map(Number);
  return y&&m&&d?new Date(y,m-1,d,12,0,0,0):null;
}
function nextWeekMonWed(now){
  const ref=dateAtLocalNoon(now);
  const dow=ref.getDay(); // 0=dg,1=dl,...,6=ds
  let daysToMon=(8-dow)%7;
  if(daysToMon===0)daysToMon=7;
  const mon=new Date(ref); mon.setDate(ref.getDate()+daysToMon);
  const wed=new Date(mon); wed.setDate(mon.getDate()+2);
  return {mon,wed,monStr:isoDate(mon),wedStr:isoDate(wed)};
}

function maybeAutoGenOutings(){
  const now=new Date();
  if(now.getDay()!==6)return;                          // Només dissabte

  const todayStr=isoDate(now);
  const {mon,wed,monStr,wedStr}=nextWeekMonWed(now);
  const wanted=[{ds:monStr,day:"Dl",date:mon},{ds:wedStr,day:"Dc",date:wed}];

  const base=Date.now();
  let changed=false;

  S.groups.forEach((g,gi)=>{
    const t=GROUP_TIMES[g.id]||"09:00";
    wanted.forEach(({ds,day,date},di)=>{
      // Si ja hi ha una sortida per aquest grup i dia correcte, no dupliquem.
      let existing=S.outings.find(o=>o.date===ds&&o.groupId===g.id);

      // Si en una versió anterior s'havia creat amb data desplaçada per zona horària
      // però el títol indicava Dl/Dc, la corregim en lloc de crear un duplicat.
      if(!existing){
        const wrong=S.outings.find(o=>
          o.groupId===g.id&&o.isAuto&&(o.title||"").includes(`· ${day}`)&&
          parseLocalDate(o.date)&&Math.abs(daysBetweenDates(parseLocalDate(o.date),date))<=2
        );
        if(wrong){
          wrong.date=ds;
          wrong.time=wrong.time||t;
          wrong.capacity=wrong.capacity||8;
          wrong.signups=safeArr(wrong.signups);
          wrong.waitlist=safeArr(wrong.waitlist);
          existing=wrong;
          changed=true;
        }
      }

      if(!existing){
        S.outings.push({
          id:base+gi*10+di,
          groupId:g.id,
          title:`Sortida setmanal · ${day}`,
          date:ds, time:t, capacity:8,
          isOpen:false, signups:[], waitlist:[], isAuto:true
        });
        changed=true;
      } else {
        if(!Array.isArray(existing.signups)){existing.signups=[];changed=true;}
        if(!Array.isArray(existing.waitlist)){existing.waitlist=[];changed=true;}
      }
    });
  });

  // Marquem la generació només després d'haver comprovat que dilluns i dimecres existeixen.
  store.set("ldm:lastAutoGen",todayStr);
  if(changed){
    save("outings");
    console.log("✅ Sortides automàtiques revisades/generades ("+monStr+" + "+wedStr+")");
  }
}

// ── Inicialització amb Supabase ───────────────────────────────────────────────
async function initApp(){
  document.getElementById("root").innerHTML=`<div style="min-height:100vh;background:linear-gradient(160deg,${DARK} 60%,#122860);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px"><div style="display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;width:80px;height:80px;border:3px solid ${RED}">${emblema}</div><div style="color:rgba(255,255,255,.6);font-size:14px;letter-spacing:.05em">Carregant dades del club...</div><div style="width:40px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden"><div id="ldg-bar" style="height:100%;width:0%;background:${RED};border-radius:2px;transition:width .4s ease"></div></div></div>`;
  const bar=document.getElementById("ldg-bar");
  if(bar)bar.style.width="30%";

  try{
    const {data,error}=await supa
      .from("app_data")
      .select("key,value")
      .in("key",SUPA_KEYS.map(k=>"ldm:"+k));

    if(bar)bar.style.width="80%";

    if(!error&&data&&data.length){
      const map={};
      data.forEach(r=>{map[r.key]=r.value;});
      if(map["ldm:groups"])  {S.groups=map["ldm:groups"];   store.set("ldm:groups",  S.groups);}
      if(map["ldm:membres"]) {S.membres=map["ldm:membres"]; store.set("ldm:membres", S.membres);}
      if(map["ldm:avisos"])  {S.avisos=map["ldm:avisos"];   store.set("ldm:avisos",  S.avisos);}
      if(map["ldm:outings"]) {S.outings=map["ldm:outings"]; store.set("ldm:outings", S.outings);}
      if(map["ldm:sessions"]){S.sessions=map["ldm:sessions"];store.set("ldm:sessions",S.sessions);}
      if(map["ldm:results"]) {S.results=map["ldm:results"]; store.set("ldm:results", S.results);}
      if(map["ldm:polls"])   {S.polls=map["ldm:polls"];     store.set("ldm:polls",   S.polls);}
      console.log("✅ Dades carregades de Supabase ("+data.length+" claus)");
    } else if(error){
      console.warn("⚠️ Error Supabase, usant dades locals:",error.message);
    } else {
      console.log("ℹ️ Supabase buit, usant dades per defecte (primera vegada)");
    }
  }catch(e){
    console.warn("⚠️ Supabase no disponible, mode offline:",e.message);
  }

  // Manté les dades antigues coherents amb la norma: competició implica social.
  let membresChanged=normalizeAllMemberSections();
  try{
    if(await migrateMemberPins())membresChanged=true;
  }catch(e){
    console.warn("⚠️ No s'han pogut migrar algunes claus:",e.message);
  }
  if(membresChanged){save("membres");}
  if(normalizeAllOutingEntries()){save("outings");}

  if(bar)bar.style.width="100%";
  await new Promise(r=>setTimeout(r,200));

  maybeAutoGenOutings();   // ← Genera sortides si és dissabte

  // ── Recuperar sessió guardada ─────────────────────────────────────────────
  const session=store.get("ldm:session");
  if(session?.role==="patron"){
    Object.assign(S,{role:"patron",loginStep:"choose"});
  } else if(session?.memberId){
    const m=S.membres.find(x=>x.id===session.memberId&&!x.pending&&x.pin);
    let ok=false;
    if(m&&session.pinHash&&m.pin===session.pinHash)ok=true;
    // Compatibilitat amb sessions antigues que encara guardaven la clau en text pla.
    if(m&&!ok&&session.pin){
      try{
        if(await memberPinMatches(m,session.pin)){
          store.set("ldm:session",{role:m.isCap?"cap":"soci",memberId:m.id,pinHash:m.pin,authVersion:SECURITY_VERSION});
          ok=true;
        }
      }catch(e){console.warn("⚠️ Sessió antiga no validada:",e.message);}
    }
    if(m&&ok){
      m.sections=normalizeSections(m.sections);
      Object.assign(S,{
        role:m.isCap?"cap":"soci",
        capGroupId:m.isCap?m.groupId:null,
        memberId:m.id,userName:m.name,
        userGroupId:m.groupId,userSections:m.sections,
        loginStep:"choose",
        section:m.sections.includes("competicio")?"competicio":"social"
      });
    } else if(session?.memberId){
      store.set("ldm:session",null);
    }
  }

  fetchMeteo();
  render();
}

initApp();

</script>
