async function sha256Hex(text){
  if(!window.crypto?.subtle)throw new Error("Aquest navegador no suporta xifrat segur.");
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function hashPatronPin(pin){return "sha256:"+(await sha256Hex("ldm:patron:"+pin));}
async function hashMemberPin(pin,m){return "sha256:"+(await sha256Hex("ldm:member:"+m.id+":"+m.name+":"+pin));}
function isHashedPin(v){return typeof v==="string"&&/^sha256:[a-f0-9]{64}$/i.test(v);}
async function migrateMemberPins(){
  let changed=false;
  for(const m of S.membres){
    if(m.pin&&!isHashedPin(m.pin)){
      m.pin=await hashMemberPin(m.pin,m);
      changed=true;
    }
  }
  return changed;
}
async function memberPinMatches(m,pin){
  if(!m?.pin)return false;
  if(isHashedPin(m.pin))return (await hashMemberPin(pin,m))===m.pin;
  // Compatibilitat amb dades antigues: si encara hi havia clau en text pla,
  // validem una vegada, migrem a hash i desem.
  if(pin===m.pin){
    m.pin=await hashMemberPin(pin,m);
    save("membres");
    return true;
  }
  return false;
}

function normalizeSections(secs){
  const out=[];
  (Array.isArray(secs)?secs:[]).forEach(sec=>{
    if((sec==="social"||sec==="competicio")&&!out.includes(sec))out.push(sec);
  });
  // Norma del club: qualsevol soci de competició també és soci de social.
  if(out.includes("competicio")&&!out.includes("social"))out.push("social");
  return out.length?out:["social"];
}

function applySupabaseRows(data,{renderNow=false}={}){
  if(!Array.isArray(data)||!data.length)return false;
  const map={};
  data.forEach(r=>{map[r.key]=r.value;});
  let changed=false;
  SUPA_KEYS.forEach(k=>{
    if(Object.prototype.hasOwnProperty.call(map,"ldm:"+k)){
      S[k]=map["ldm:"+k]??DEF[k]??[];
      store.set("ldm:"+k,S[k]);
      changed=true;
    }
  });
  if(changed){
    S.lastSyncAt=new Date().toISOString();
    S.syncErr="";
    normalizeAllMemberSections();
    normalizeAllOutingEntries();
    if(renderNow)render();
  }
  return changed;
}
async function refreshKeysFromSupabase(keys=SUPA_KEYS,{renderNow=false,silent=true}={}){
  if(!silent){S.supaSyncing=true;S.syncErr="";render();}
  try{
    const {data,error}=await supa.from("app_data").select("key,value").in("key",keys.map(k=>"ldm:"+k));
    if(error)throw error;
    const changed=applySupabaseRows(data,{renderNow:false});
    if(renderNow||!silent)render();
    return changed;
  }catch(e){
    S.syncErr=e?.message||"No s'ha pogut sincronitzar";
    console.warn("⚠️ Error sincronitzant Supabase:",S.syncErr);
    if(!silent||renderNow)render();
    return false;
  }finally{
    if(!silent){S.supaSyncing=false;render();}
  }
}

function fetchMeteo(){
  const meteoUrl="https://api.open-meteo.com/v1/forecast?latitude=41.7833&longitude=3.0167&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code,precipitation&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_sum&timezone=Europe%2FMadrid&forecast_days=7";
  const marineUrl="https://marine-api.open-meteo.com/v1/marine?latitude=41.7833&longitude=3.0167&hourly=wave_height,wave_direction,wave_period,wind_wave_height,wind_wave_direction,swell_wave_height,swell_wave_direction,swell_wave_period&timezone=Europe%2FMadrid&forecast_days=7&cell_selection=sea";
  S.meteoLoading=true;S.marineLoading=true;
  Promise.allSettled([
    fetch(meteoUrl).then(r=>{if(!r.ok)throw new Error("meteo");return r.json();}),
    fetch(marineUrl).then(r=>{if(!r.ok)throw new Error("marine");return r.json();})
  ]).then(([meteo,marine])=>{
    if(meteo.status==="fulfilled")S.meteo=meteo.value;
    if(marine.status==="fulfilled")S.marine=marine.value;
    S.meteoLoading=false;S.marineLoading=false;
    if(!S.selectedMeteoDate&&S.meteo?.daily?.time?.length)S.selectedMeteoDate=firstRegularOutingDate(S.meteo.daily.time);
    render();
  }).catch(()=>{S.meteoLoading=false;S.marineLoading=false;render();});
}

function entryKey(e){
  const m=memberFromEntry(e);
  if(m?.id)return "id:"+m.id;
  return "name:"+String(e?.name||"").trim().toLowerCase();
}
function entryMatchesCurrent(e){

  if(S.memberId&&e.mid)return Number(e.mid)===Number(S.memberId);
  const m=memberFromEntry(e);
  if(S.memberId&&m?.id)return Number(m.id)===Number(S.memberId);
  return String(e.name||"")===String(S.userName||"");
}
function entryMatchesPerson(e,name,gid,mid=null){
  if(!e||!name)return false;
  if(mid&&e.mid)return Number(e.mid)===Number(mid);
  const m=memberFromEntry(e);
  if(mid&&m?.id)return Number(m.id)===Number(mid);
  return String(e.name||"")===String(name||"");
}
function entrySamePerson(a,b){
  if(!a||!b)return false;
  const ak=entryKey(a),bk=entryKey(b);
  return ak&&bk&&ak===bk;
}
function normalizeOutingEntries(o){
  if(!o)return false;
  let changed=false;
  if(!Array.isArray(o.signups)){o.signups=[];changed=true;}
  if(!Array.isArray(o.waitlist)){o.waitlist=[];changed=true;}
  if(!Array.isArray(o.helmsmanSignups)){o.helmsmanSignups=[];changed=true;}
  // Migra sortides antigues sense camps de timonel/reserva
  if(o.helmsmen===undefined||o.helmsmen===null){
    const cfg=getOutingCfg(o.groupId,o.date);
    if(cfg){o.helmsmen=cfg.helmsmen;o.helmsmanRequired=cfg.helmsmanRequired;o.reserve=cfg.reserve;if(!o.capacity||o.capacity<cfg.capacity)o.capacity=cfg.capacity;}
    else{o.helmsmen=0;o.helmsmanRequired=false;o.reserve=1;}
    changed=true;
  }
  const clean=list=>{
    const seen=new Set(),out=[];
    list.forEach(e=>{
      if(!e||!e.name)return;
      const m=memberFromEntry(e);
      const n={...e};
      if(m){
        if(!n.mid){n.mid=m.id;changed=true;}
        if(!n.gid){n.gid=m.groupId;changed=true;}
      }
      const k=entryKey(n);
      if(seen.has(k)){changed=true;return;}
      seen.add(k);out.push(n);
    });
    return out;
  };
  const signups=clean(o.signups);
  const waitlist=clean(o.waitlist).filter(w=>{
    const dup=signups.some(s=>entrySamePerson(s,w));
    if(dup)changed=true;
    return !dup;
  });
  if(signups.length!==o.signups.length||waitlist.length!==o.waitlist.length)changed=true;
  o.signups=signups;o.waitlist=waitlist;
  if(normalizeReserveSlots(o))changed=true;
  return changed;
}
function normalizeAllOutingEntries(){
  let changed=false;
  S.outings.forEach(o=>{if(normalizeOutingEntries(o))changed=true;});
  return changed;

function outingDisplayTitle(o){
  if(!o)return "Sortida";

    // Evita duplicar l'hora quan una sortida oberta antiga la tenia dins del títol
    // i la targeta ja la mostra a la primera línia.
    let title=String(o.title||"Sortida oberta").trim();
    title=title.replace(/\s*·\s*Dv\s*\d{1,2}[:.]\d{2}\s*$/i,"");
    title=title.replace(/\s*·\s*\d{1,2}[:.]\d{2}\s*h?\s*$/i,"");
    return title||"Sortida oberta";
  }
  // Les sortides setmanals per grup es mostren amb el nom del grup (Grup A, Grup C...),
  // no amb el títol tècnic "Sortida setmanal".
  if(o.groupId){
    const gn=gname(o.groupId).split(" · ")[0];
    if(gn&&gn!=="—")return gn;

}

function outingStartDateTime(o){

  const [hh,mm]=normalizeTimeStr(o?.time||GROUP_TIMES?.[o?.groupId]||"00:00").split(":").map(Number);

function outingPastDateTime(o){

  const end=new Date(start);

    <div style="color:rgba(255,255,255,.65);font-size:14px;text-align:center;margin-bottom:12px">Codi del patró</div>

    ${errDiv(S.pinErrMsg)}

  if(S.loginStep==="soci-list"){

  // ── PIN DEL SOCI (inclou primer accés) ───────────────────────────────────
  if(S.loginStep==="soci-pin"){

      ${isFirst?`<div style="background:rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:rgba(255,255,255,.55);line-height:1.5;text-align:center">Primera vegada al dispositiu.<br>Crea la teva clau d'accés personal (mínim 6 caràcters).</div>`:""}
      ${pinInp("pin-in",isFirst?"Nova clau":"Clau d'accés",S.pinErr)}
      ${isFirst?pinInp("pin-in2","Confirma la clau"):""}
      ${errDiv(S.pinErrMsg)}
      ${btnP(isFirst?"CREAR CLAU I ENTRAR":"ENTRAR","tryLoginSoci()")}
      ${btnT("Enrere","go({loginStep:'soci-list',pinErr:false,pinErrMsg:''})")}
    </div>`);
  }

  // ── FORMULARI DE REGISTRE ─────────────────────────────────────────────────
  if(S.loginStep==="register"){
    const grpOpts=S.groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join("");
    const secBtn=(sec,label)=>`<button onclick="togRegSec('${sec}')" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid ${S.regSections.includes(sec)?"#fff":"rgba(255,255,255,.2)"};background:${S.regSections.includes(sec)?"rgba(255,255,255,.15)":"transparent"};color:#fff;font-size:13px;font-weight:${S.regSections.includes(sec)?700:400};cursor:pointer">${label}</button>`;
    return wrap(`<div style="width:100%;max-width:320px">
      <div style="color:#fff;font-size:18px;font-weight:700;text-align:center;margin-bottom:18px">Crear compte nou</div>
      ${txtInp("reg-nom","Nom i cognom *")}
      <select id="reg-grup" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(27,58,122,.9);color:#fff;font-size:14px;outline:none;box-sizing:border-box;margin-bottom:10px">${grpOpts}</select>
      <div style="margin-bottom:12px">
        <div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em">Seccions *</div>
        <div style="display:flex;gap:8px">${secBtn("competicio","🏆 Competició")}${secBtn("social","⚓ Social")}</div>
      </div>
      ${pinInp("reg-pin","Crea la teva clau (mínim 6 car.) *")}
      ${pinInp("reg-pin2","Confirma la clau *")}
      ${errDiv(S.regErr)}
      ${btnP("ENVIAR SOL·LICITUD","submitRegister()")}
      ${btnT("Enrere","go({loginStep:'choose'})")}
      <div style="color:rgba(255,255,255,.3);font-size:11px;text-align:center;margin-top:8px">El patró haurà d'aprovar el teu compte</div>
    </div>`);
  }

  // ── CONFIRMACIÓ DE REGISTRE ───────────────────────────────────────────────
  if(S.loginStep==="register-ok")return wrap(`<div style="width:100%;max-width:300px;text-align:center">
    <div style="font-size:56px;margin-bottom:16px">✅</div>
    <div style="color:#fff;font-size:20px;font-weight:700;margin-bottom:10px">Sol·licitud enviada!</div>
    <div style="color:rgba(255,255,255,.5);font-size:14px;margin-bottom:28px;line-height:1.6">El patró rebrà la teva petició i t'avisarà quan el compte estigui aprovat.</div>
    ${btnS("Tornar a l'inici","go({loginStep:'choose'})")}
  </div>`);

  return wrap("");
}

// ── Funcions d'autenticació ────────────────────────────────────────────────────
async function tryPin(){
  const v=document.getElementById("pin-in")?.value||"";
  try{
    if(await hashPatronPin(v)===PATRON_HASH){
      store.set("ldm:session",{role:"patron",authVersion:SECURITY_VERSION});
      go({role:"patron",loginStep:"choose",pinErr:false,pinErrMsg:""});
    } else {
      go({pinErr:true,pinErrMsg:"Codi incorrecte"});
    }
  }catch(e){
    go({pinErr:true,pinErrMsg:e.message||"No s'ha pogut validar la clau"});
  }
}

function selectSoci(id){
  go({selectedMemberId:id,loginStep:"soci-pin",pinErr:false,pinErrMsg:""});
}

async function tryLoginSoci(){
  const m=S.membres.find(x=>x.id===S.selectedMemberId);
  if(!m)return;
  const pin=document.getElementById("pin-in")?.value||"";
  try{
    if(!m.pin){
      // Primera vegada: creació de clau. Es guarda sempre en hash, mai en text pla.
      const pin2=document.getElementById("pin-in2")?.value||"";
      if(pin.length<MIN_PIN_LEN)return go({pinErr:true,pinErrMsg:`La clau ha de tenir mínim ${MIN_PIN_LEN} caràcters`});
      if(pin!==pin2)return go({pinErr:true,pinErrMsg:"Les claus no coincideixen"});
      m.pin=await hashMemberPin(pin,m);
      save("membres");
    } else {
      if(!(await memberPinMatches(m,pin)))return go({pinErr:true,pinErrMsg:"Clau incorrecta"});
    }
    doLoginSoci(m);
  }catch(e){
    go({pinErr:true,pinErrMsg:e.message||"No s'ha pogut validar la clau"});
  }
}

function doLoginSoci(m){
  m.sections=normalizeSections(m.sections);
  const role=m.isCap?"cap":"soci";
  store.set("ldm:session",{role,memberId:m.id,pinHash:m.pin,authVersion:SECURITY_VERSION});
  go({role,capGroupId:m.isCap?m.groupId:null,memberId:m.id,userName:m.name,
      userGroupId:m.groupId,userSections:m.sections,loginStep:"choose",
      pinErr:false,pinErrMsg:"",section:m.sections.includes("competicio")?"competicio":"social"});
}

function togRegSec(sec){
  const next=S.regSections.includes(sec)?S.regSections.filter(x=>x!==sec):[...S.regSections,sec];
  go({regSections:normalizeSections(next)});
}

async function submitRegister(){
  const nom=(document.getElementById("reg-nom")?.value||"").trim();
  const gid=parseInt(document.getElementById("reg-grup")?.value)||S.groups[0]?.id;
  const pin=document.getElementById("reg-pin")?.value||"";
  const pin2=document.getElementById("reg-pin2")?.value||"";
  if(!nom)return go({regErr:"El nom és obligatori"});
  if(!S.regSections.length)return go({regErr:"Selecciona almenys una secció"});
  if(pin.length<MIN_PIN_LEN)return go({regErr:`La clau ha de tenir mínim ${MIN_PIN_LEN} caràcters`});
  if(pin!==pin2)return go({regErr:"Les claus no coincideixen"});
  try{
    const member={id:Date.now(),name:nom,groupId:gid,sections:normalizeSections(S.regSections),pin:null,isCap:false,pending:true};
    member.pin=await hashMemberPin(pin,member);
    S.membres.push(member);
    save("membres");
    go({loginStep:"register-ok"});
  }catch(e){
    go({regErr:e.message||"No s'ha pogut crear la clau"});
  }
}

// ── Accions del panell de membres ──────────────────────────────────────────────
function approvePending(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m){m.sections=normalizeSections(m.sections);m.pending=false;save("membres");render();}}
function rejectPending(id){if(S.role!=="patron")return;if(!confirm("Rebutjar la sol·licitud?"))return;S.membres=S.membres.filter(m=>m.id!==id);save("membres");render();}
function resetMemberPin(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m&&confirm("Reset de clau de "+m.name+"?\nHaurà de crear una nova clau al proper accés.")){m.pin=null;save("membres");render();}}
function toggleIsCap(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m){m.isCap=!m.isCap;save("membres");render();}}

// ── Helpers de UI ─────────────────────────────────────────────────────────────
function num(v,d=1){return Number.isFinite(Number(v))?Number(v).toFixed(d).replace(".0",""):"—";}
function firstVal(...vals){for(const v of vals){if(v!==undefined&&v!==null&&!Number.isNaN(Number(v)))return v;}return null;}
function weatherCodeFrom(obj){return firstVal(obj?.weather_code,obj?.weathercode);}
function meteoHourlyIndex(data,date,time){
  const times=data?.hourly?.time||[];
  const wanted=`${date}T${time}`;
  let idx=times.indexOf(wanted);
  if(idx>=0)return idx;
  let best=-1,bestDiff=9999;
  const [th,tm]=(time||"00:00").split(":").map(Number);
  const target=(th||0)*60+(tm||0);
  times.forEach((t,i)=>{
    if(!String(t).startsWith(date+"T"))return;
    const hh=Number(t.slice(11,13)),mm=Number(t.slice(14,16));
    const diff=Math.abs((hh*60+mm)-target);
    if(diff<bestDiff){best=i;bestDiff=diff;}
  });
  return best;
}
function seaStateLabel(h){
  const v=Number(h);
  if(!Number.isFinite(v))return "Mar no disponible";
  if(v>=1)return "Mar moguda";
  if(v>=0.6)return "Mar moderada";
  return "Mar tranquil·la";
}
function isRegularOutingDay(ds){
  const dow=parseLocalDate(ds)?.getDay();
  return dow===1||dow===3||dow===5; // dilluns, dimecres i divendres
}
function firstRegularOutingDate(days){
  return (days||[]).find(isRegularOutingDay)||(days||[])[0]||td();
}
function renderMeteo(){
  if(S.meteoLoading&&!S.meteo)return`<div style="background:${DARK};border-radius:14px;margin:10px 14px 0;padding:16px;color:rgba(255,255,255,.5);font-size:13px">Carregant meteo del port...</div>`;
  if(!S.meteo)return`<div style="background:${DARK};border-radius:14px;margin:10px 14px 0;padding:16px;color:rgba(255,255,255,.5);font-size:13px">Meteo no disponible</div>`;

  const m=S.meteo;
  const availableDays=(m.daily?.time||[]).slice(0,7);
  const outingDays=availableDays.filter(isRegularOutingDay);
  const dayList=outingDays.length?outingDays:availableDays.slice(0,5);
  let sel=S.selectedMeteoDate||firstRegularOutingDate(availableDays);
  if(dayList.length&&!dayList.includes(sel))sel=dayList[0];

  const windState=v=>{
    const n=Number(v);
    if(!Number.isFinite(n))return "—";
    if(n>=20)return "Molt fort";
    if(n>=15)return "Fort";
    if(n>=10)return "Moderat";
    return "Fluix";
  };
  const riskBg=warn=>warn?"rgba(255,107,107,.14)":"rgba(255,255,255,.075)";
  const riskBorder=warn=>warn?"rgba(255,107,107,.36)":"rgba(255,255,255,.1)";
  const riskColor=warn=>warn?"#ffb4b4":"#fff";

  const curCode=weatherCodeFrom(m.current);
  const curKn=Math.round((m.current?.wind_speed_10m||0)*.539957);
  const curDir=wDir(m.current?.wind_direction_10m||0);
  const selIndex=availableDays.indexOf(sel);
  const max=selIndex>=0?m.daily?.temperature_2m_max?.[selIndex]:null;
  const min=selIndex>=0?m.daily?.temperature_2m_min?.[selIndex]:null;
  const rainDay=selIndex>=0?m.daily?.precipitation_sum?.[selIndex]:null;
  const dayButtons=dayList.map((d,i)=>{
    const dy=parseLocalDate(d)||new Date(d);
    const idx=availableDays.indexOf(d);
    const isSel=d===sel;
    const maxDay=idx>=0?m.daily?.temperature_2m_max?.[idx]:null;
    const code=weatherCodeFrom({weather_code:idx>=0?m.daily?.weather_code?.[idx]:null,weathercode:idx>=0?m.daily?.weathercode?.[idx]:null});
    const label=d===td()?"Avui":DAYS[dy.getDay()];
    return`<button onclick="go({selectedMeteoDate:'${d}',meteoHoursOpen:false})" style="flex:1;text-align:center;font-size:10px;color:${isSel?'#fff':'rgba(255,255,255,.62)'};background:${isSel?'rgba(255,255,255,.16)':'transparent'};border:${isSel?'1px solid rgba(255,255,255,.28)':'1px solid transparent'};border-radius:9px;padding:6px 3px;cursor:pointer"><div style="font-weight:800;margin-bottom:2px">${label}</div><div style="font-size:15px;line-height:1">${wIcon(code)}</div><div style="font-size:11px;font-weight:700;margin-top:2px">${maxDay!==null&&maxDay!==undefined?Math.round(maxDay)+'°':'—'}</div></button>`;
  }).join("");

  const hourSlots=["08:00","11:00","14:00","17:00","20:00"];
  const slotData=hourSlots.map(t=>{
    const wi=meteoHourlyIndex(m,sel,t),mi=meteoHourlyIndex(S.marine,sel,t);
    const h=m.hourly||{},mh=S.marine?.hourly||{};
    const temp=wi>=0?h.temperature_2m?.[wi]:null;
    const wkn=wi>=0?Math.round((h.wind_speed_10m?.[wi]||0)*.539957):null;
    const wdeg=wi>=0?h.wind_direction_10m?.[wi]:null;
    const code=wi>=0?firstVal(h.weather_code?.[wi],h.weathercode?.[wi]):null;
    const rain=wi>=0?h.precipitation?.[wi]:null;
    const wh=mi>=0?mh.wave_height?.[mi]:null;
    const wdir=mi>=0?mh.wave_direction?.[mi]:null;
    const wp=mi>=0?mh.wave_period?.[mi]:null;
    return {t,temp,wkn,wdeg,code,rain,wh,wdir,wp};
  });
  const bestWind=slotData.reduce((best,x)=>Number(x.wkn)>Number(best?.wkn??-1)?x:best,null);
  const bestWave=slotData.reduce((best,x)=>Number(x.wh)>Number(best?.wh??-1)?x:best,null);
  const maxWind=Number(bestWind?.wkn);
  const maxWave=Number(bestWave?.wh);
  const windWarn=Number.isFinite(maxWind)&&maxWind>=15;
  const seaWarn=Number.isFinite(maxWave)&&maxWave>=0.8;
  const strong=curKn>=15||windWarn||seaWarn;

  const rows=slotData.map(x=>{
    const warn=(Number(x.wkn)>=15)||(Number(x.wh)>=0.8);
    return`<div style="display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;background:${riskBg(warn)};border:1px solid ${riskBorder(warn)};border-radius:10px;padding:7px 8px;margin-top:6px;font-size:12px;color:rgba(255,255,255,.82);line-height:1.25">
      <div style="font-weight:850;color:#fff;flex-shrink:0">${x.t.slice(0,2)}h</div>
      <div style="min-width:0">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;color:${riskColor(warn)};font-weight:850"><span>💨 ${x.wkn!==null&&x.wkn!==undefined?x.wkn+' kn':'—'} ${x.wdeg!==null?wDir(x.wdeg):''}</span><span>🌊 ${x.wh!==null&&x.wh!==undefined?num(x.wh,1)+' m':'—'} ${x.wdir!==null?wDir(x.wdir):''}</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;color:rgba(255,255,255,.58);font-size:11px"><span>${wIcon(x.code)} ${x.temp!==null&&x.temp!==undefined?Math.round(x.temp)+'°':'—'}${x.rain!==null&&x.rain!==undefined&&Number(x.rain)>0?` · 🌧️ ${num(x.rain,1)} mm`:''}</span><span>${x.wp!==null&&x.wp!==undefined?num(x.wp,0)+'s':''}</span></div>
      </div>
    </div>`;
  }).join("");

  const selDate=parseLocalDate(sel)||new Date(sel);
  const selTitle=selDate.toLocaleDateString("ca-ES",{weekday:"long",day:"numeric",month:"long"});
  const marineNote=S.marine?"":"<div style='font-size:11px;color:rgba(255,255,255,.48);margin-top:8px'>Estat del mar no disponible ara mateix.</div>";
  const daySummary=`${min!==null&&min!==undefined?Math.round(min)+'° / ':''}${max!==null&&max!==undefined?Math.round(max)+'°':''}${rainDay!==null&&rainDay!==undefined&&Number(rainDay)>0?` · Pluja ${num(rainDay,1)} mm`:''}`;
  const windMain=Number.isFinite(maxWind)?`${maxWind} kn ${bestWind?.wdeg!==null&&bestWind?.wdeg!==undefined?wDir(bestWind.wdeg):''}`:"—";
  const seaMain=Number.isFinite(maxWave)?`${num(maxWave,1)} m ${bestWave?.wdir!==null&&bestWave?.wdir!==undefined?wDir(bestWave.wdir):''}`:"—";
  const seaLabel=Number.isFinite(maxWave)?seaStateLabel(maxWave):"Mar no disponible";
  const hoursOpen=!!S.meteoHoursOpen;
  const hoursDropdown=`<button onclick="go({meteoHoursOpen:${hoursOpen?'false':'true'}})" style="width:100%;margin-top:8px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:9px 10px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;text-align:left">
    <span style="font-size:12px;font-weight:800">${hoursOpen?'Amagar detall per franges':'Veure detall per franges'}</span>
    <span style="font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap">${hoursOpen?'▲':'vent i mar ▾'}</span>
  </button>`;

  return`<div style="background:linear-gradient(135deg,${DARK},#122860);border-radius:14px;margin:10px 14px 0;padding:12px;color:#fff">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px">
      <div><div style="font-size:11px;opacity:.55">📍 Port de Sant Feliu de Guíxols</div><div style="font-size:13px;font-weight:850;margin-top:2px">Vent i estat del mar</div></div>
      <div style="text-align:right"><div style="font-size:10px;opacity:.55">Vent ara</div><div style="font-size:15px;font-weight:850;color:${curKn>=15?'#ffb4b4':'#fff'}">${curKn} kn ${curDir}</div><div style="font-size:10px;opacity:.55">${wIcon(curCode)} ${Math.round(m.current?.temperature_2m??0)}°</div></div>
    </div>
    <div style="display:flex;gap:5px;padding-top:8px;border-top:.5px solid rgba(255,255,255,.15)">${dayButtons}</div>
    <div style="margin-top:9px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><div style="font-size:13px;font-weight:850;text-transform:capitalize;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${selTitle}</div><div style="font-size:11px;color:rgba(255,255,255,.58);white-space:nowrap">${daySummary}</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px">
        <div style="background:${riskBg(windWarn)};border:1px solid ${riskBorder(windWarn)};border-radius:10px;padding:9px 10px"><div style="font-size:10px;color:rgba(255,255,255,.58);font-weight:800;text-transform:uppercase;letter-spacing:.04em">💨 Vent màxim</div><div style="font-size:17px;font-weight:900;color:${riskColor(windWarn)};margin-top:2px">${windMain}</div><div style="font-size:11px;color:rgba(255,255,255,.58);margin-top:2px">${windState(maxWind)}${bestWind?.t?` · ${bestWind.t.slice(0,2)}h`:''}</div></div>
        <div style="background:${riskBg(seaWarn)};border:1px solid ${riskBorder(seaWarn)};border-radius:10px;padding:9px 10px"><div style="font-size:10px;color:rgba(255,255,255,.58);font-weight:800;text-transform:uppercase;letter-spacing:.04em">🌊 Ona màxima</div><div style="font-size:17px;font-weight:900;color:${riskColor(seaWarn)};margin-top:2px">${seaMain}</div><div style="font-size:11px;color:rgba(255,255,255,.58);margin-top:2px">${seaLabel}${bestWave?.t?` · ${bestWave.t.slice(0,2)}h`:''}</div></div>
      </div>
      ${hoursDropdown}
      ${hoursOpen?rows:""}${marineNote}
    </div>
  </div>${strong?`<div style="background:#fff0f0;border:.5px solid ${RED};border-radius:10px;margin:8px 14px 0;padding:10px 12px;display:flex;gap:8px;align-items:center">⚠️<span style="font-size:12px;color:${RED}">Reviseu les condicions: ${windWarn?`vent fins a ${maxWind} kn`:curKn>=15?`vent ara ${curKn} kn`:''}${(windWarn||curKn>=15)&&seaWarn?' · ':''}${seaWarn?`ona fins a ${num(maxWave,1)} m`:''}. Consulteu amb el patró.</span></div>`:""}`;
}

function eventCfg(type){return EVENT_TYPES[type]||EVENT_TYPES.altres;}
function normalizeEventType(type){return EVENT_TYPES[type]?type:"altres";}
function allCalendarEvents(){
  const manual=safeArr(S.events).map(e=>({source:"event",...e,type:normalizeEventType(e.type)}));
  const regates=safeArr(S.results).filter(r=>r.date).map(r=>({
    id:"res-"+r.id,source:"result",type:"regata_competicio",title:r.race||"Regata",date:r.date,time:"",place:r.place||"",desc:`${POS[r.pos]||((r.pos||"")+"è")}${r.points?` · ${r.points} pts`:""}`,resultId:r.id
  }));
  return [...manual,...regates].filter(e=>e.date).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.time||"").localeCompare(b.time||"")||(a.title||"").localeCompare(b.title||""));
}
function eventsByDate(){
  const out={};
  allCalendarEvents().forEach(e=>{(out[e.date]=out[e.date]||[]).push(e);});

}
function selectedDayEvents(date=S.selectedCalDate){return allCalendarEvents().filter(e=>e.date===date);}

function renderClubCalendar(){
  const y=S.calYear,mo=S.calMonth,dim=new Date(y,mo+1,0).getDate();
  let sdow=new Date(y,mo,1).getDay();sdow=sdow===0?6:sdow-1;

  let cells="";for(let i=0;i<sdow;i++)cells+=`<div></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const evs=byDate[ds]||[],isToday=ds===tod,isSel=ds===S.selectedCalDate;
    const firstCfg=evs.length?eventCfg(evs[0].type):null;

    const eventColor=firstCfg?.color||BORDER;
    const dots=evs.slice(0,4).map(e=>`<span style="width:5px;height:5px;border-radius:50%;background:${eventCfg(e.type).color};display:inline-block"></span>`).join("");
    const border=isSel?`.5px solid ${DARK}`:(isToday?`2px solid ${RED}`:(evs.length?`1.5px solid ${eventColor}`:`.5px solid transparent`));
    const shadow=evs.length&&!isSel?`box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);`:(isSel?`box-shadow:0 2px 8px rgba(27,58,122,.22);`:"");
    const bg=isSel?DARK:(evs.length?eventBg:"transparent");
    const col=isSel?"#fff":(evs.length?"#1a1a18":(ds<tod?"#b9b3a9":"#1a1a18"));
    const common=`aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;color:${col};font-size:12px;font-weight:${evs.length||isToday?800:400};border:${border};position:relative;${shadow}`;
    if(evs.length){
      const label=evs.length===1?eventCfg(evs[0].type).short:`${evs.length} events`;
      cells+=`<button title="${esc(label)}" onclick="go({selectedCalDate:'${ds}',showEventForm:false,editEventId:null,eventErr:''})" style="${common};background:${bg};cursor:pointer"><span>${d}</span><span style="display:flex;gap:2px;min-height:6px;margin-top:2px">${dots}</span></button>`;
    }else{
      cells+=`<div style="${common};background:${bg};cursor:default"><span>${d}</span><span style="display:flex;gap:2px;min-height:6px;margin-top:2px"></span></div>`;
    }

  const prev=mo===0?{m:11,y:y-1}:{m:mo-1,y:y},next=mo===11?{m:0,y:y+1}:{m:mo+1,y:y};

  return cc(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><button onclick="go({calMonth:${prev.m},calYear:${prev.y},selectedCalDate:null,showEventForm:false,editEventId:null})" style="background:none;border:none;color:${MUTED};font-size:22px;cursor:pointer;padding:0 8px">‹</button><div style="font-size:14px;font-weight:700;color:#1a1a18">${MONTHS[mo]} ${y}</div><button onclick="go({calMonth:${next.m},calYear:${next.y},selectedCalDate:null,showEventForm:false,editEventId:null})" style="background:none;border:none;color:${MUTED};font-size:22px;cursor:pointer;padding:0 8px">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${hdr}${cells}</div><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;padding-top:10px;border-top:.5px solid #f0ede6">${legend}</div><div style="font-size:11px;color:${MUTED};line-height:1.4;margin-top:9px">Els dies il·luminats tenen esdeveniments del club. Les sortides tenen secció pròpia.</div>`);

      ${maxHelm>0?`<div style="font-size:10px;color:${MUTED};font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">⛵ Timonels ${o.helmsmanSignups.length}/${maxHelm}${helmsRequired?" · obligatori":""}</div>${o.helmsmanSignups.length?personChips(o.helmsmanSignups,"helm"):`<div style="font-size:12px;color:${helmsRequired?RED:MUTED};font-style:italic;margin-bottom:8px">${helmsRequired?"Cal timoner per fer la sortida":"Sense timoner assignat"}</div>`}`:""}

  // Botons d'acció
  const acts=[];
  const busy=!!S.actionBusy;
  if((S.role==="soci"||S.role==="cap")&&!isPast&&!writeBlocked){
    const canJoinHelm=maxHelm>0&&!amHelm&&!amIn&&!amWait&&canAccess&&o.helmsmanSignups.length<maxHelm;

    if(canJoinHelm)
      acts.push(`<button onclick="signup(${o.id},true)" style="flex:1;padding:9px;background:#4a7a3d;border:none;border-radius:8px;color:#fff;font-weight:600;font-size:12px;cursor:pointer">⛵ Timoner</button>`);

      acts.push(`<div style="flex:1;padding:9px;background:#fff8ee;border:.5px solid #e8a020;border-radius:8px;color:#b07a10;font-size:12px;text-align:center;font-weight:500">⏳ Llista d'espera · pos.${o.waitlist.findIndex(entryMatchesCurrent)+1}<br><button onclick="unsignup(${o.id})" style="background:none;border:none;color:#b07a10;font-size:11px;cursor:pointer;text-decoration:underline;margin-top:2px;padding:0">Sortir</button></div>`);

    acts.push(`<button onclick="closeOut(${o.id})" style="padding:9px 12px;background:#fff;border:.5px solid ${RED};border-radius:8px;color:${RED};font-size:12px;font-weight:700;cursor:pointer">🔒 Tancar a tots</button>`);
  if(isPatron&&!isPast&&!writeBlocked)
    acts.push(`<button onclick="go({patronAddOuting:${o.id}})" style="padding:9px 12px;background:#fff;border:.5px solid ${DARK};border-radius:8px;color:${DARK};font-size:12px;font-weight:600;cursor:pointer">+ Afegir soci</button>`);

    acts.push(`<button onclick="delOut(${o.id})" style="padding:9px 10px;background:transparent;border:.5px solid ${BORDER};border-radius:8px;color:${MUTED};font-size:12px;cursor:pointer">🗑</button>`);

  // Modal d'afegir soci (patró)
  const patronAddChoice=(S.patronAddChoice&&S.patronAddChoice[o.id])||{};
  const patronAddMid=patronAddChoice.mid||"";
  const patronAddRole=patronAddChoice.role||"rower";
  const addMemberModal=isPatron&&S.patronAddOuting===o.id?`<div style="padding:10px 14px;border-top:.5px solid #f5f3ee;background:#f8f6f0">
    <div style="font-size:11px;font-weight:700;color:${DARK};text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Afegir soci a la sortida</div>

        const inOut=o.signups.some(s=>s.mid===m.id||s.name===m.name);

      </div>

function getUserVote(p){
  if(!S.userName)return null;
  for(const o of p.options){if((p.votes[o]||[]).includes(S.userName))return o;}
  return null;
}

function renderPollCard(p){
  p.votes=p.votes||{};
  p.options=(p.options||[]).filter(Boolean);
  p.options.forEach(o=>{if(!Array.isArray(p.votes[o]))p.votes[o]=[];});
  const mv=getUserVote(p);
  const tot=p.options.reduce((a,o)=>a+(p.votes[o]?.length||0),0);
  const counts=p.options.map(o=>p.votes[o]?.length||0);
  const maxVotes=counts.length?Math.max(...counts):0;
  const winners=p.options.filter(o=>(p.votes[o]?.length||0)===maxVotes&&maxVotes>0);
  const canVote=!p.closed&&!!S.userName;
  const status=p.closed
    ?`<span style="background:#fff0f0;color:${RED};font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap">Tancada</span>`
    :`<span style="background:#e6f4ee;color:${GREEN};font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap">Oberta</span>`;
  const userBadge=mv?`<div style="margin-top:7px;display:inline-flex;align-items:center;gap:5px;background:#eef0fa;color:${DARK};font-size:11px;font-weight:700;padding:4px 8px;border-radius:20px">✓ El teu vot: ${esc(mv)}</div>`:"";
  const rows=p.options.map((opt,optIdx)=>{
    const voters=p.votes[opt]||[];
    const cnt=voters.length;
    const pct=tot>0?Math.round((cnt/tot)*100):0;
    const isMy=mv===opt;
    const isWinner=p.closed&&winners.length===1&&winners[0]===opt;
    const isTie=p.closed&&winners.length>1&&winners.includes(opt);
    const key=pollKey(p.id,opt);
    const open=!!(S.pollVotersOpen&&S.pollVotersOpen[key]);
    const bg=isMy?"#eef0fa":"#fff";
    const br=isMy?DARK:(isWinner?RED:BORDER);
    const barCol=isWinner?RED:(isMy?DARK:"#c8d4f0");
    // Els noms dels votants NO es mostren per defecte: només apareixen en desplegar "Veure votants".
    const topVoters="", extra="";
    const expanded=open?`<div style="margin-top:8px;padding:8px 9px;background:#faf8f3;border-radius:10px;border:.5px solid #f0ede6">
      <div style="font-size:10px;color:${MUTED};font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px">Votants</div>
      ${voters.length?`<div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center">${voters.map(n=>`<span style="display:inline-flex;align-items:center;max-width:100%;background:#fff;border:.5px solid ${BORDER};border-radius:999px;color:#1a1a18;font-size:11px;font-weight:600;line-height:1.2;padding:4px 8px;white-space:nowrap">${esc(n)}</span>`).join("")}</div>`:`<div style="font-size:12px;color:${MUTED};font-style:italic">Encara no hi ha cap vot.</div>`}
    </div>`:"";
    const voteBtn=canVote?`<button onclick="event.stopPropagation();castVoteByIndex(${p.id},${optIdx})" style="margin-top:8px;width:100%;padding:8px;background:${isMy?DARK:"transparent"};border:1px solid ${isMy?DARK:BORDER};border-radius:9px;color:${isMy?"#fff":DARK};font-size:12px;font-weight:700;cursor:pointer">${isMy?"✓ Votat":"Votar aquesta opció"}</button>`:"";
    const votersBtn=`<button onclick="event.stopPropagation();togglePollVotersByIndex(${p.id},${optIdx})" style="margin-top:8px;background:transparent;border:none;color:${cnt?DARK:MUTED};font-size:11px;font-weight:700;cursor:${cnt?"pointer":"default"};padding:0" ${cnt?"":"disabled"}>${open?"Amagar votants":"Veure votants"} · ${cnt}</button>`;
    return`<div style="position:relative;overflow:hidden;margin-bottom:10px;background:${bg};border:1.5px solid ${br};border-radius:13px;padding:10px 10px 9px">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:${isMy?"rgba(27,58,122,.08)":"rgba(200,212,240,.22)"};pointer-events:none"></div>
      <div style="position:relative">
        <div style="display:flex;align-items:flex-start;gap:9px">
          <div style="width:22px;height:22px;border-radius:50%;border:1.5px solid ${isMy?DARK:BORDER};background:${isMy?DARK:"#fff"};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:1px;font-weight:700">${isMy?"✓":""}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div style="font-size:14px;font-weight:${isMy||isWinner?700:600};line-height:1.35;color:${isWinner?RED:(isMy?DARK:"#1a1a18")};word-break:break-word">${isWinner?"🏆 ":isTie?"↔️ ":""}${esc(opt)}</div>
              <div style="text-align:right;white-space:nowrap"><div style="font-size:13px;font-weight:800;color:${isWinner?RED:DARK}">${cnt}</div><div style="font-size:10px;color:${MUTED};font-weight:700">${pct}%</div></div>
            </div>
            <div style="background:#f0ede8;border-radius:20px;height:7px;overflow:hidden;margin-top:7px"><div style="background:${barCol};height:7px;border-radius:20px;width:${pct}%"></div></div>
            <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:7px">${votersBtn}</div>
            ${expanded}
            ${voteBtn}
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
  const hint=p.closed
    ?`<div style="font-size:11px;color:${MUTED};margin-bottom:10px;line-height:1.45">La votació està tancada. Els resultats queden visibles i pots desplegar els votants.</div>`
    :S.userName?`<div style="font-size:11px;color:${MUTED};margin-bottom:10px;line-height:1.45">Toca una opció per votar o canviar el vot. Els vots no són anònims.</div>`
    :`<div style="font-size:11px;color:${MUTED};margin-bottom:10px;line-height:1.45">Entra com a soci per votar. Pots veure els resultats i desplegar els votants.</div>`;
  const patronActions=S.role==="patron"?`<div style="display:flex;gap:8px;padding:10px 14px;border-top:.5px solid #f5f3ee;background:#fbfaf7">${!p.closed?`<button onclick="closePoll(${p.id})" style="flex:1;padding:8px;background:#fff;border:.5px solid ${RED};border-radius:8px;color:${RED};font-size:12px;cursor:pointer;font-weight:700">Tancar votació</button>`:`<button onclick="reopenPoll(${p.id})" style="flex:1;padding:8px;background:#fff;border:.5px solid ${GREEN};border-radius:8px;color:${GREEN};font-size:12px;cursor:pointer;font-weight:700">Reobrir votació</button>`}<button onclick="delPoll(${p.id})" style="padding:8px 12px;background:#fff;border:.5px solid ${BORDER};border-radius:8px;color:${MUTED};font-size:12px;cursor:pointer">🗑</button></div>`:"";
  return`<div style="background:#fff;border-radius:15px;margin:10px 14px 0;border:.5px solid ${BORDER};overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.02)">
    <div style="padding:13px 14px 0">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px;gap:8px"><div style="font-size:15px;font-weight:800;color:#1a1a18;flex:1;line-height:1.35">${esc(p.question)}</div>${status}</div>
      <div style="font-size:11px;color:${MUTED};margin-bottom:5px">${tot} vot${tot!==1?"s":""} · ${esc(p.date||"")}</div>
      ${userBadge}
      <div style="height:10px"></div>
      ${hint}
      ${rows}
      <div style="height:3px"></div>
    </div>${patronActions}
  </div>`;
}

function renderHomeOutingMini(o){

  const cfg=getOutingCfg(o.groupId,o.date);
  const maxHelm=o.helmsmen||cfg?.helmsmen||0;

  const statusBg=open?(noSpots?"#fff8ee":"#e6f4ee"):"#fff8ee";

  const stats=`<div style="padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap">
    <span style="display:inline-flex;align-items:center;gap:4px;background:#f5f3ee;border-radius:999px;font-size:11px;padding:4px 8px;color:#1a1a18;font-weight:700">🚣 ${rowerCount}/${capacity}${reserve?` + ${reserve}R`:""}</span>

}
function renderHomeSortides(){
  const list=visibleOutings().filter(o=>!isPastOuting(o)).sort(sortOutings).slice(0,2);
  const body=list.length?list.map(renderHomeOutingMini).join(""):`<div style="font-size:13px;color:${MUTED};text-align:center;padding:.8rem 0">Cap sortida programada</div>`;
  return cc(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">${lbl("⛵ Sortides")}<span style="background:#e6f4ee;color:${GREEN};font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px">${list.length}</span></div>${body}<div style="font-size:11px;color:${MUTED};line-height:1.35;margin-top:4px">Les sortides es gestionen a la seva pròpia secció i no formen part del calendari d'esdeveniments.</div><div style="display:flex;justify-content:flex-end;margin-top:8px"><button onclick="go({screen:'entrena',section:'social'})" style="border:none;background:${BG};border-radius:8px;color:${DARK};font-size:11px;font-weight:800;padding:6px 9px;cursor:pointer">Veure sortides</button></div>`);
}
function renderHomePollMini(p){
  const tot=Object.values(p.votes||{}).reduce((a,v)=>a+(Array.isArray(v)?v.length:0),0);
  const rows=(p.options||[]).slice(0,3).map(opt=>{const cnt=(p.votes?.[opt]||[]).length,pct=tot>0?Math.round(cnt/tot*100):0;return `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>${esc(opt)}</span><strong>${cnt} · ${pct}%</strong></div><div style="height:7px;background:#f0ede8;border-radius:999px;overflow:hidden"><span style="display:block;height:100%;background:${DARK};border-radius:999px;width:${pct}%"></span></div></div>`;}).join("");
  return `<div style="border:.5px solid ${BORDER};border-radius:14px;padding:11px 12px;background:#fff"><div style="font-size:14px;font-weight:750;color:#1a1a18;margin-bottom:9px">${esc(p.question)}</div>${rows}</div>`;
}
function renderHomeEnquestes(){
  const open=S.polls.filter(p=>!p.closed);
  const body=open.length?renderHomePollMini(open[0]):`<div style="font-size:13px;color:${MUTED};text-align:center;padding:.8rem 0">Cap enquesta oberta</div>`;
  return cc(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">${lbl("📊 Enquestes")}<span style="background:#eef0fa;color:${DARK};font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px">${open.length}</span></div>${body}<div style="display:flex;justify-content:flex-end;margin-top:8px"><button onclick="go({screen:'vots'})" style="border:none;background:${BG};border-radius:8px;color:${DARK};font-size:11px;font-weight:800;padding:6px 9px;cursor:pointer">Veure enquestes</button></div>`);
}
function renderInici(){
  return renderHomeAvisos()+renderMeteo()+renderHomeSortides()+renderHomeEnquestes()+`<div style="margin:12px 14px 4px">${lbl("📅 Calendari del club")}</div>`+renderClubAgenda()+`<div style="height:14px"></div>`;

    return strow([[Math.round(km)+" km","totals"],[sess.length,"sessions"],[`${h}h${m2>0?" "+m2+"m":""}`,"hores"]])+form+cc(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">${lbl("Historial")}${canAdd&&!S.showForm?`<button onclick="go({showForm:true})" style="background:${DARK};border:none;border-radius:8px;color:#fff;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:600">+ Afegir</button>`:""}</div>${sess.length===0?`<div style="font-size:13px;color:${MUTED};text-align:center;padding:1rem 0">Cap sessió</div>`:list}`)+`<div style="height:14px"></div>`;
  }

function renderEstadistiques(){
  if(!userCanViewStats())return cc(`<div style="font-size:13px;color:${MUTED};text-align:center;padding:1.5rem 0">Accés restringit</div>`);
  const scope=S.role==="patron"?S.outings:S.role==="cap"?S.outings.filter(o=>o.groupId===S.capGroupId):S.outings.filter(o=>memberIsInOuting(o));
  const past=scope.filter(isPastOuting);
  const future=scope.filter(o=>!isPastOuting(o));
  const signups=scope.reduce((a,o)=>a+safeArr(o.signups).length,0);
  const waits=scope.reduce((a,o)=>a+safeArr(o.waitlist).length,0);
  let confirmed=0,absent=0,excused=0,closed=0;
  const peopleCount={};
  past.forEach(o=>{
    const att=o.attendance;
    if(att?.closed){
      closed++;
      attendancePeople(o).forEach(p=>{
        const st=att.status?.[p.attKey]||"present";
        if(st==="present"){confirmed++;peopleCount[p.name]=(peopleCount[p.name]||0)+1;}
        else if(st==="absent")absent++;
        else excused++;
      });
    }
  });
  let html=strow([[scope.length,"sortides"],[future.length,"properes"],[past.length,"històric"]]);
  html+=strow([[signups,"apuntats"],[waits,"espera"],[confirmed,"assistència real"]]);
  if(S.role==="patron"||S.role==="cap")html+=renderAttendanceManager(5);
  html+=cc(`${lbl("Criteri de dades")}<div style="font-size:13px;color:#1a1a18;line-height:1.55"><strong>Apuntat no vol dir assistència.</strong> Les estadístiques fiables es basen en sortides amb <strong>assistència tancada</strong>. Ara hi ha ${closed} sortida${closed!==1?"s":""} tancada${closed!==1?"s":""}.</div>`);
  html+=strow([[closed,"tancades"],[absent,"no presentats"],[excused,"baixa/justificat"]]);
  if(S.role==="soci"){
    const mineConfirmed=past.filter(o=>o.attendance?.closed&&attendancePeople(o).some(p=>entryMatchesCurrent(p)&&(o.attendance.status?.[p.attKey]||"present")==="present")).length;
    const mineWait=scope.filter(o=>safeArr(o.waitlist).some(entryMatchesCurrent)).length;
    html+=cc(`${lbl("La meva activitat")}<div style="font-size:14px;color:#1a1a18;line-height:1.6">Assistència confirmada: <strong>${mineConfirmed}</strong>. Sortides on has estat en llista d'espera: <strong>${mineWait}</strong>.</div>`);
  }
  if(S.role==="patron"||S.role==="cap"){
    const groups=(S.role==="patron"?S.groups:S.groups.filter(g=>g.id===S.capGroupId)).map(g=>{
      const os=S.outings.filter(o=>o.groupId===g.id);
      const s=os.reduce((a,o)=>a+safeArr(o.signups).length,0);
      const w=os.reduce((a,o)=>a+safeArr(o.waitlist).length,0);
      const done=os.filter(o=>o.attendance?.closed).length;
      return {g,os,s,w,done};
    });
    const rows=groups.map(x=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:.5px solid #f0ede6"><div><div style="font-size:13px;font-weight:650;color:#1a1a18">${x.g.name}</div><div style="font-size:11px;color:${MUTED}">${x.os.length} sortides · ${x.s} apuntats · ${x.w} espera · ${x.done} assistències tancades</div></div></div>`).join("");
    html+=cc(`${lbl(S.role==="patron"?"Resum per grup":"Resum del meu grup")}${rows||`<div style="font-size:13px;color:${MUTED};text-align:center;padding:1rem 0">Encara no hi ha dades</div>`}`);
    const top=Object.entries(peopleCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
    if(top.length){html+=cc(`${lbl("Assistència confirmada")} ${top.map(([n,c],i)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:${i<top.length-1?'.5px solid #f0ede6':'none'}"><span style="font-size:13px;color:#1a1a18">${esc(n)}</span><strong style="font-size:13px;color:${DARK}">${c}</strong></div>`).join("")}`);}
  }
  return html+`<div style="height:14px"></div>`;
}

  return strow([[S.membres.filter(m=>!m.pending).length,"socis"],[future,"sortides futures"],[pendingAtt,"assistències pendents"]])+
    cc(`${lbl("Estat de l'app")}<div style="font-size:13px;color:#1a1a18;line-height:1.65"><strong>Sincronització:</strong> ${esc(syncAgeLabel())}<br><strong>Error:</strong> ${S.syncErr?esc(S.syncErr):"cap"}<br><strong>Última sync:</strong> ${S.lastSyncAt?esc(S.lastSyncAt.slice(0,19).replace("T"," ")):"pendent"}</div>`)+
    cc(`${lbl("Eines")}<div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="exportBackup()" style="flex:1;padding:10px;background:${DARK};border:none;border-radius:9px;color:#fff;font-size:13px;font-weight:800;cursor:pointer">Exportar còpia</button><button onclick="copyDiagnostics()" style="flex:1;padding:10px;background:#fff;border:.5px solid ${BORDER};border-radius:9px;color:${DARK};font-size:13px;font-weight:800;cursor:pointer">Copiar diagnòstic</button></div>`)+
    cc(`${lbl("Checklist beta")}<div style="font-size:12px;color:${MUTED};line-height:1.45;margin-bottom:8px">Toca cada element per alternar: pendent → funciona → revisar.</div>${checkHtml}`)+`<div style="height:14px"></div>`;

async function signup(oid,asHelm=false){
  if(!canWriteNow())return;
  const lock=`signup:${oid}:${S.memberId||"anon"}`;
  return withActionLock(lock,async()=>{
    await refreshOutingsBeforeAction();
    const o=S.outings.find(x=>x.id===oid);
    if(!o||!(S.role==="soci"||S.role==="cap")||isPastOuting(o))return;
    normalizeOutingEntries(o);
    if(!o.waitlist)o.waitlist=[];
    if(!o.helmsmanSignups)o.helmsmanSignups=[];
    const isGeneral=isGeneralOuting(o);
    const isMyGroup=!isGeneral&&Number(S.userGroupId)===Number(o.groupId);
    const isOpen=shouldBeOpen(o);
    const publicWaitlistOpen=canJoinPublicWaitlist(o);
    if(!isMyGroup&&!isOpen&&!publicWaitlistOpen)return;
    const entry={name:S.userName,gid:S.userGroupId,mid:S.memberId,ts:nowIso()};
    markWaitlistPriority(entry,o);
    reconcileOutingWaitlist(o);
    // No pot ser timoner i vogador alhora, ni duplicar inscripció.
    const amHelm=o.helmsmanSignups.some(entryMatchesCurrent);
    const amRower=o.signups.some(entryMatchesCurrent);
    const amWait=o.waitlist.some(entryMatchesCurrent);
    if(amHelm||amRower||amWait)return;
    if(asHelm){
      const maxHelm=o.helmsmen||0;
      if(!maxHelm)return;
      if(o.helmsmanSignups.length>=maxHelm)return alert("Ja hi ha el màxim de timonels");
      o.helmsmanSignups.push(entry);
      addOutingLog(o,"helm_signup",`${S.userName} s'apunta de timoner a ${outingLabel(o)}.`);
      showToast("ok","T'has apuntat com a timoner.");
    } else {
      if(canTakeRowerSpot(o,entry)){
        o.signups.push(entry);
        addOutingLog(o,"signup",`${S.userName} s'apunta a ${outingLabel(o)}.`);
        showToast("ok","T'has apuntat correctament.");
      }else if(canTakeReserveSpot(o,entry)){
        o.signups.push({...entry,isReserve:true});
        addOutingLog(o,"signup_reserve",`${S.userName} ocupa la plaça de reserva de ${outingLabel(o)}.`);
        showToast("ok","Has entrat com a reserva.");
      }else{
        markWaitlistPriority(entry,o);
        o.waitlist.push(entry);
        addOutingLog(o,"waitlist_join",`${S.userName} entra a la llista d'espera de ${outingLabel(o)}${entry.groupPriority?" amb prioritat de grup":""}.`);
        showToast("ok","Has entrat a la llista d'espera.");
      }
    }
    await saveMany(["outings","avisos"]);
  });
}
async function unsignup(oid){
  if(!canWriteNow())return;
  const lock=`unsignup:${oid}:${S.memberId||"anon"}`;
  return withActionLock(lock,async()=>{
    await refreshOutingsBeforeAction();
    const o=S.outings.find(x=>x.id===oid);
    if(!o||!(S.role==="soci"||S.role==="cap")||isPastOuting(o))return;
    normalizeOutingEntries(o);
    if(!o.waitlist)o.waitlist=[];
    if(!o.helmsmanSignups)o.helmsmanSignups=[];
    const wasHelm=o.helmsmanSignups.some(entryMatchesCurrent);
    const wasIn=o.signups.some(entryMatchesCurrent);
    const wasWait=o.waitlist.some(entryMatchesCurrent);
    o.helmsmanSignups=o.helmsmanSignups.filter(s=>!entryMatchesCurrent(s));
    o.signups=o.signups.filter(s=>!entryMatchesCurrent(s));
    o.waitlist=o.waitlist.filter(s=>!entryMatchesCurrent(s));
    if(wasHelm)addOutingLog(o,"helm_unsignup",`${S.userName} es desapunta de timoner de ${outingLabel(o)}.`);
    if(wasIn)addOutingLog(o,"unsignup",`${S.userName} es desapunta de ${outingLabel(o)}.`);
    if(wasWait)addOutingLog(o,"waitlist_leave",`${S.userName} surt de la llista d'espera de ${outingLabel(o)}.`);
    // Si allibera plaça de vogador, primer es respecta la llista d'espera del grup.
    // La resta de la llista només puja si la sortida ja està oberta a tothom.
    if(wasIn){reconcileOutingWaitlist(o);}
    await saveMany(["outings","avisos"]);
    if(wasHelm||wasIn||wasWait)showToast("ok","T'has desapuntat correctament.");
  });
}

async function patronAddMember(oid){
  if(S.role!=="patron")return;
  if(!canWriteNow())return;
  // IMPORTANT: guardem la selecció en estat. En alguns mòbils o amb Realtime,
  // un render pot reconstruir el desplegable entre seleccionar i prémer Afegir.
  // Així evitem falsos avisos de "Selecciona un soci".
  rememberPatronAddForm(oid);
  const choice=(S.patronAddChoice&&S.patronAddChoice[oid])||{};
  const midRaw=choice.mid||document.getElementById(`patron-add-mid-${oid}`)?.value||"";
  const role=choice.role||document.getElementById(`patron-add-role-${oid}`)?.value||"rower";
  const mid=parseInt(midRaw,10);
  if(!mid)return alert("Selecciona un soci.");

  const lock=`patron-add:${oid}:${mid}:${role}`;
  return withActionLock(lock,async()=>{
    await refreshOutingsBeforeAction();
    const o=S.outings.find(x=>String(x.id)===String(oid));
    if(!o)return alert("No s'ha trobat aquesta sortida. Actualitza i torna-ho a provar.");
    if(isPastOuting(o))return alert("Aquesta sortida ja és passada.");

    normalizeOutingEntries(o);
    if(!o.waitlist)o.waitlist=[];
    if(!o.helmsmanSignups)o.helmsmanSignups=[];

    const m=S.membres.find(x=>Number(x.id)===Number(mid));
    if(!m)return alert("No s'ha trobat aquest soci.");

    const entry={name:m.name,gid:m.groupId,mid:m.id,ts:nowIso()};
    markWaitlistPriority(entry,o);
    const same=e=>Number(e.mid)===Number(m.id)||String(e.name||"")===String(m.name||"");
    const alreadyIn=o.signups.some(same);
    const alreadyHelm=o.helmsmanSignups.some(same);
    const alreadyWait=o.waitlist.some(same);
    if(alreadyIn||alreadyHelm||alreadyWait){
      const lloc=alreadyIn?"apuntat":alreadyHelm?"apuntat com a timoner":"a la llista d'espera";
      return alert(`${m.name} ja consta ${lloc} en aquesta sortida.`);
    }

    // Abans que el patró afegeixi algú manualment, respectem possibles esperes pendents.
    // Això evita que el patró ocupi una plaça lliure si abans hi havia un soci amb prioritat.
    reconcileOutingWaitlist(o);

    if(role==="helm"){
      const maxHelm=o.helmsmen||getOutingCfg(o.groupId,o.date)?.helmsmen||0;
      if(!maxHelm)return alert("Aquesta sortida no admet timonels.");
      if(o.helmsmanSignups.length>=maxHelm)return alert("Ja hi ha el màxim de timonels.");
      o.helmsmanSignups.push(entry);
      addOutingLog(o,"helm_signup_patron",`El patró apunta ${m.name} de timoner a ${outingLabel(o)}.`);
    } else {
      if(canTakeRowerSpot(o,entry)){
        o.signups.push(entry);
        addOutingLog(o,"signup_patron",`El patró apunta ${m.name} a ${outingLabel(o)}.`);
      }else if(canTakeReserveSpot(o,entry)){
        o.signups.push({...entry,isReserve:true});
        addOutingLog(o,"signup_patron_reserve",`El patró apunta ${m.name} a la plaça de reserva de ${outingLabel(o)}.`);
      }else{
        markWaitlistPriority(entry,o);
        o.waitlist.push(entry);
        addOutingLog(o,"waitlist_join_patron",`El patró posa ${m.name} a la llista d'espera de ${outingLabel(o)}${entry.groupPriority?" amb prioritat de grup":""}.`);
      }
    }

    await saveMany(["outings","avisos"]);
    showToast("ok","Soci afegit a la sortida.");
    if(S.patronAddChoice)delete S.patronAddChoice[oid];
    go({patronAddOuting:null});
  });
}

async function patronRemovePerson(oid,listName,idx=null,mid="",nameArg=""){
  if(S.role!=="patron")return;
  if(!canWriteNow())return;
  const allowed={signups:"signups",helmsmanSignups:"helmsmanSignups",waitlist:"waitlist"};
  const list=allowed[listName];
  if(!list)return alert("No s'ha pogut identificar la llista.");
  const lock=`patron-remove-person:${oid}:${list}:${mid||idx||nameArg||"x"}`;
  return withActionLock(lock,async()=>{
    await refreshOutingsBeforeAction();
    const o=S.outings.find(x=>String(x.id)===String(oid));
    if(!o)return alert("No s'ha trobat aquesta sortida. Actualitza i torna-ho a provar.");
    if(isPastOuting(o))return alert("Aquesta sortida ja és passada.");
    normalizeOutingEntries(o);
    const arr=safeArr(o[list]);
    const midStr=String(mid||"");
    const nameStr=String(nameArg||"");
    let pos=-1;
    if(midStr){
      pos=arr.findIndex(s=>String(s.mid||memberFromEntry(s)?.id||"")===midStr);
    }
    if(pos<0&&nameStr){
      pos=arr.findIndex(s=>String(s.name||"")===nameStr);
    }
    const idxNum=Number(idx);
    if(pos<0&&Number.isInteger(idxNum)&&idxNum>=0&&idxNum<arr.length){
      pos=idxNum;
    }
    if(pos<0)return alert("No s'ha trobat aquest soci. Actualitza i torna-ho a provar.");

    const [removed]=arr.splice(pos,1);
    o[list]=arr;
    const name=removed?.name||nameStr||"un soci";
    if(list==="helmsmanSignups"){
      addOutingLog(o,"helm_unsignup_patron",`El patró desapunta ${name} de timoner a ${outingLabel(o)}.`);
    }else if(list==="waitlist"){
      addOutingLog(o,"waitlist_leave_patron",`El patró treu ${name} de la llista d'espera de ${outingLabel(o)}.`);
    }else{
      addOutingLog(o,"unsignup_patron",`El patró desapunta ${name} de ${outingLabel(o)}.`);
      reconcileOutingWaitlist(o);
    }
    await saveMany(["outings","avisos"]);
    showToast("ok","Soci retirat de la sortida.");
  });
}

async function openOut(oid){
  if(!canWriteNow())return;
  const lock=`open:${oid}`;

    await refreshOutingsBeforeAction();

    normalizeOutingEntries(o);
    const isPatron=S.role==="patron";
    const isOwnCap=!isGeneralOuting(o)&&S.role==="cap"&&S.capGroupId===o.groupId;
    if(!isPatron&&!isOwnCap)return;
    const changed=reconcileOutingWaitlist(o);
    if(!o.isOpen){
      o.isOpen=true;
      o.openedAt=nowIso();
      addOutingLog(o,"outing_opened",`${actorLabel()} obre a tothom la inscripció de ${outingLabel(o)}.`);
      reconcileOutingWaitlist(o);
      await saveMany(["outings","avisos"]);
      showToast("ok","Sortida oberta a tothom.");
    }else if(changed){
      await saveMany(["outings","avisos"]);
    }
  });
}
async function closeOut(oid){

    await refreshOutingsBeforeAction();
