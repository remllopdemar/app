// ── Sortides automàtiques i obertura natural ─────────────────────────────────
const GROUP_TIMES={1:"20:15",2:"19:00",3:"17:45",4:"16:30",5:"09:15",6:"08:00"};
const FRIDAY_GENERAL_TIMES=["17:30","18:45"];
const FRIDAY_GENERAL_CONFIG={capacity:12,reserve:0,helmsmen:4,helmsmanRequired:false};

// Les sortides de cada setmana s'obren dissabte a les 08:00 i es mantenen fins que s'acaba aquella setmana.
// Si durant la setmana falta alguna sortida, la revisió la crea en obrir l'app.
const OUTING_OPEN_RULES={
  autoGenHour:"08:00",
  morningCutoffHour:10,
  morning:{dayOffset:-1,hour:"20:00"},      // sortides abans de les 10:00 → vigília 20:00
  afternoon:{dayOffset:0,hour:"07:30"},     // sortides de tarda/vespre → mateix dia 07:30
  fridayGeneral:{dayOffset:-4,hour:"07:30"} // sortides obertes de divendres → dilluns 07:30
};

// Configuració per grup i dia (dow: 1=Dl, 3=Dc). Els divendres són sortides generals.
// capacity: places de vogador base
// reserve: +1 plaça reserva per al grup
// helmsmen: places de timoner
// helmsmanRequired: si cal timoner per sortir
const OUTING_CONFIG={
  1:{Dl:{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false},
     Dc:{capacity:8,reserve:1,helmsmen:2,helmsmanRequired:true}},
  2:{Dl:{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false},
     Dc:{capacity:8,reserve:1,helmsmen:2,helmsmanRequired:true}},
  3:{Dl:{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false},
     Dc:{capacity:8,reserve:1,helmsmen:2,helmsmanRequired:true}},
  4:{Dl:{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false},
     Dc:{capacity:8,reserve:1,helmsmen:2,helmsmanRequired:true}},
  5:{Dl:{capacity:16,reserve:1,helmsmen:2,helmsmanRequired:true},
     Dc:{capacity:16,reserve:1,helmsmen:1,helmsmanRequired:true}},
  6:{Dl:{capacity:8,reserve:1,helmsmen:1,helmsmanRequired:true},
     Dc:{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false}},
};

function normalizeTimeStr(t){
  const parts=String(t||"").replace(".",":").split(":");
  const h=Number(parts[0]||0),m=Number(parts[1]||0);
  return `${String(Number.isFinite(h)?h:0).padStart(2,"0")}:${String(Number.isFinite(m)?m:0).padStart(2,"0")}`;
}
function isGeneralOuting(o){return !!o?.openAllGroups||Number(o?.groupId)===0;}
function isFridayGeneralOuting(o){
  const d=parseLocalDate(o?.date);
  return !!o&&d?.getDay()===5&&isGeneralOuting(o)&&FRIDAY_GENERAL_TIMES.includes(normalizeTimeStr(o.time));
}
function getOutingCfg(groupId,dateStr){
  const dow=parseLocalDate(dateStr)?.getDay();
  if(Number(groupId)===0&&dow===5)return FRIDAY_GENERAL_CONFIG;
  const day=dow===1?"Dl":dow===3?"Dc":null;
  return (day&&OUTING_CONFIG[groupId])?OUTING_CONFIG[groupId][day]:null;
}

function outingTimeParts(o){
  const raw=String(o?.time||GROUP_TIMES[o?.groupId]||"00:00").replace(".",":");
  const [h,m]=(raw||"00:00").split(":").map(Number);
  return {h:Number.isFinite(h)?h:0,m:Number.isFinite(m)?m:0};
}
function naturalOpenRule(o){
  if(isFridayGeneralOuting(o))return OUTING_OPEN_RULES.fridayGeneral;
  const {h}=outingTimeParts(o);
  return h<OUTING_OPEN_RULES.morningCutoffHour?OUTING_OPEN_RULES.morning:OUTING_OPEN_RULES.afternoon;
}
function getNaturalOpenDate(o){
  // Dilluns/dimecres tenen obertura natural per grup; divendres és una sortida general.
  const cfg=getOutingCfg(o.groupId,o.date);
  if(!cfg)return null;
  const outingDate=parseLocalDate(o.date);
  if(!outingDate)return null;
  const rule=naturalOpenRule(o);
  const openDate=new Date(outingDate);
  openDate.setDate(openDate.getDate()+rule.dayOffset);
  const [hh,mm]=(rule.hour||"07:30").split(":").map(Number);
  openDate.setHours(hh,mm,0,0);
  return openDate;
}
function formatHHMM(d){return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}
function formatNaturalOpenLabel(o){
  const openDate=getNaturalOpenDate(o);
  if(!openDate)return "quan el cap o el patró l'obrin";
  const diff=daysBetweenDates(openDate,new Date());
  const hora=formatHHMM(openDate);
  if(diff===0)return `avui a les ${hora}`;
  if(diff===1)return `demà a les ${hora}`;
  if(diff===-1)return `ahir a les ${hora}`;
  return `${openDate.toLocaleDateString("ca-ES",{weekday:"short",day:"numeric",month:"short"})} a les ${hora}`;
}

function outingCapacity(o){
  const cfg=getOutingCfg(o?.groupId,o?.date);
  // En sortides de grup amb reserva, la capacitat base és la configurada del grup
  // (8 o 16 vogadors normals). Algunes dades antigues podien tenir guardada
  // una capacity que incloïa la reserva; per evitar que el 9è deixi de ser reserva,
  // fem prevaldre la configuració quan existeix. En sortides generals/divendres,
  // la capacity guardada sí és la capacitat total de vogadors.
  if(cfg&&!isGeneralOuting(o))return Number(cfg.capacity||8);
  return Number(o?.capacity||cfg?.capacity||8);
}
function waitEntryGroupId(w){
  return Number(w?.gid||memberFromEntry(w)?.groupId||0);
}
function waitEntryBelongsToGroup(w,o){
  if(isGeneralOuting(o))return false;
  return waitEntryGroupId(w)===Number(o?.groupId||0);
}
function generalOpenCutoff(o){
  if(!o)return null;
  if(o.isOpen&&o.openedAt){
    const d=new Date(o.openedAt);
    if(!Number.isNaN(d.getTime()))return d;
  }
  return getNaturalOpenDate(o);
}
function entryJoinedBeforeGeneralOpen(w,o){
  const cutoff=generalOpenCutoff(o);
  if(!cutoff)return false;
  const ts=w?.ts?new Date(w.ts):null;
  if(!ts||Number.isNaN(ts.getTime()))return !openTriggerReached(o);
  return ts<cutoff;
}
function shouldHaveGroupPriority(entry,o){
  return waitEntryBelongsToGroup(entry,o)&&entryJoinedBeforeGeneralOpen(entry,o);
}
function markWaitlistPriority(entry,o){
  if(!entry)return entry;
  if(shouldHaveGroupPriority(entry,o))entry.groupPriority=true;
  else delete entry.groupPriority;
  return entry;
}
function waitEntryHasGroupPriority(w,o){
  if(!waitEntryBelongsToGroup(w,o))return false;
  if(w?.groupPriority===true)return true;
  if(w?.groupPriority===false)return false;
  return entryJoinedBeforeGeneralOpen(w,o);
}
function hasPriorityGroupWaitlist(o){
  if(isGeneralOuting(o))return false;
  return safeArr(o?.waitlist).some(w=>waitEntryHasGroupPriority(w,o));
}
// Compatibilitat amb codi anterior: ara "llista del grup" vol dir només la prioritària.
function hasOpenGeneralSpots(o){
  // Hi ha plaça directa per a gent del general només si no hi ha espera prioritària del grup.
  return normalRowerCount(o)<outingCapacity(o)&&!hasPriorityGroupWaitlist(o);
}

function autoOpenReached(o){
  const openDate=getNaturalOpenDate(o);
  return openDate?new Date()>=openDate:false;
}
function openTriggerReached(o){
  if(o?.isOpen)return true; // obertura manual del cap/patró
  return autoOpenReached(o);
}

// Calcula si la sortida ja està en fase d'obertura general, independentment de si hi ha places.
function shouldBeOpen(o){
  return openTriggerReached(o);
}

// Quan arriba l'hora d'obertura general, qualsevol soci pot entrar a la llista d'espera,
// encara que la sortida estigui plena o hi hagi una espera prioritària del grup.
function canJoinPublicWaitlist(o){
  return openTriggerReached(o);
}

function outingReserve(o){
  if(!o||isGeneralOuting(o))return 0;
  const cfg=getOutingCfg(o.groupId,o.date);
  return Number(o.reserve ?? cfg?.reserve ?? 0)||0;
}
function canTakeRowerSpot(o,entry){
  if(!o||!entry)return false;
  if(normalRowerCount(o)>=outingCapacity(o))return false;
  if(hasPriorityGroupWaitlist(o))return false;
  if(isGeneralOuting(o))return openTriggerReached(o);
  const isOwn=Number(entry.gid)===Number(o.groupId);
  return isOwn||openTriggerReached(o);
}
function canTakeReserveSpot(o,entry){
  if(!o||!entry||isGeneralOuting(o))return false;
  if(Number(entry.gid)!==Number(o.groupId))return false;
  if(hasPriorityGroupWaitlist(o))return false;
  return normalRowerCount(o)>=outingCapacity(o)&&reserveRowerCount(o)<outingReserve(o);
}
function normalRowerCount(o){
  return safeArr(o?.signups).filter(s=>!s.isReserve).length;
}
function reserveRowerCount(o){
  return safeArr(o?.signups).filter(s=>!!s.isReserve).length;
}
// Manté les marques de reserva coherents amb l'ordre de la llista.
// En sortides amb reserva: primer van les places normals i després la reserva.
// Si un vogador normal marxa, el primer reserva passa automàticament a plaça normal.
function normalizeReserveSlots(o){
  if(!o||!Array.isArray(o.signups))return false;
  let changed=false;
  const cap=outingCapacity(o);
  const reserve=outingReserve(o);
  if(reserve<=0){
    o.signups=o.signups.map(s=>{
      if(s&&s.isReserve){changed=true;const n={...s};delete n.isReserve;return n;}
      return s;
    });
    return changed;
  }

  // Separem primer vogadors normals i reserves explícites. Això fa que,
  // quan marxa un vogador normal, la reserva existent avanci a plaça normal
  // abans de mirar la llista d'espera.
  const normals=o.signups.filter(s=>s&&!s.isReserve);
  const reserves=o.signups.filter(s=>s&&s.isReserve);
  const ordered=[...normals,...reserves];
  if(ordered.length!==o.signups.length||ordered.some((s,i)=>s!==o.signups[i]))changed=true;

  o.signups=ordered.map((s,i)=>{
    const shouldReserve=i>=cap && i<cap+reserve;
    if(Boolean(s.isReserve)!==shouldReserve){
      changed=true;
      const n={...s};
      if(shouldReserve)n.isReserve=true;
      else delete n.isReserve;
      return n;
    }
    return s;
  });
  return changed;
}

function nextWaitlistCandidate(o,priorityOnly=false,allowOthers=false){
  const wait=safeArr(o?.waitlist);
  if(!wait.length)return null;
  const priority=wait.find(w=>waitEntryHasGroupPriority(w,o));
  if(priorityOnly)return priority||null;
  if(priority)return priority;
  return allowOthers?wait[0]:null;
}

function removeFromWaitlist(o,entry){
  if(!entry)return false;
  const before=safeArr(o.waitlist).length;
  o.waitlist=safeArr(o.waitlist).filter(w=>!entrySamePerson(w,entry));
  return o.waitlist.length!==before;
}

function promoteWaitlistEntry(o,entry,asReserve=false){
  if(!entry)return false;
  if(!removeFromWaitlist(o,entry))return false;
  const promoted={...entry};
  if(asReserve)promoted.isReserve=true;
  else delete promoted.isReserve;
  o.signups.push(promoted);
  addPersonalAviso(o,promoted,"waitlist_promoted","Has entrat a la sortida",`S'ha alliberat una plaça i has entrat automàticament a ${outingLabel(o)}${asReserve?" com a reserva":""}.`);
  addOutingLog(o,"waitlist_promoted",`${promoted.name} entra automàticament des de la llista d'espera a ${outingLabel(o)}${asReserve?" com a reserva":""}.`);
  return true;
}

// Llista d'espera amb prioritat de grup. Si groupOnly=true, només puja gent del grup de la sortida.
function reconcileOutingWaitlist(o){
  if(!o||isPastOuting(o))return false;
  let changed=normalizeOutingEntries(o);
  if(normalizeReserveSlots(o))changed=true;

  const cap=outingCapacity(o);
  const reserve=outingReserve(o);
  const allowOthers=openTriggerReached(o);

  // Sortides sense reserva, inclosos els divendres generals: es manté la lògica anterior.
  if(reserve<=0){
    while(normalRowerCount(o)<cap&&safeArr(o.waitlist).length>0){
      const cand=nextWaitlistCandidate(o,false,allowOthers);
      if(!cand)break;
      if(!promoteWaitlistEntry(o,cand,false))break;
      changed=true;
    }
    return changed;
  }

  // 1) Primer omplim places normals.
  // Si hi havia una reserva i marxa un vogador normal, normalizeReserveSlots() ja l'ha passat a normal.
  // Si encara falta una plaça normal, puja algú de la llista: grup primer; altres només si ja és oberta.
  while(normalRowerCount(o)<cap&&safeArr(o.waitlist).length>0){
    const cand=nextWaitlistCandidate(o,false,allowOthers);
    if(!cand)break;
    if(!promoteWaitlistEntry(o,cand,false))break;
    changed=true;
    if(normalizeReserveSlots(o))changed=true;
  }

  // 2) Després mantenim coberta la plaça de reserva si hi ha llista d'espera.
  // Si marxa un normal: reserva -> normal; primer/a de llista -> reserva.
  // Si marxa directament la reserva: primer/a de llista -> reserva.
  while(normalRowerCount(o)>=cap && reserveRowerCount(o)<reserve && safeArr(o.waitlist).length>0){
    // Si hi ha una plaça de reserva lliure i algú ja és a la llista d'espera,
    // el primer candidat ha de passar a reserva. No depèn de l'obertura general.
    const cand=nextWaitlistCandidate(o,false,true);
    if(!cand)break;
    if(!promoteWaitlistEntry(o,cand,true))break;
    changed=true;
    if(normalizeReserveSlots(o))changed=true;
  }

  return changed;
}

// Data local YYYY-MM-DD. Evita el desplaçament d'un dia que pot provocar toISOString()
// quan el navegador està en zona Europe/Madrid a primera hora del dia.
function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dateAtLocalNoon(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12,0,0,0);}
function daysBetweenDates(a,b){
  const da=dateAtLocalNoon(a), db=dateAtLocalNoon(b);
  return Math.round((da-db)/86400000);
}
function parseLocalDate(ds){
  const [y,m,d]=(ds||"").split("-").map(Number);
  return y&&m&&d?new Date(y,m-1,d,12,0,0,0):null;
}
function ensureAutoOutingFields(o,cfg){
  let changed=false;
  if(!Array.isArray(o.signups)){o.signups=[];changed=true;}
  if(!Array.isArray(o.waitlist)){o.waitlist=[];changed=true;}
  if(!Array.isArray(o.helmsmanSignups)){o.helmsmanSignups=[];changed=true;}
  if(cfg){
    if(o.capacity!==cfg.capacity){o.capacity=cfg.capacity;changed=true;}
    if(o.reserve!==cfg.reserve){o.reserve=cfg.reserve;changed=true;}
    if(o.helmsmen!==cfg.helmsmen){o.helmsmen=cfg.helmsmen;changed=true;}
    if(o.helmsmanRequired!==cfg.helmsmanRequired){o.helmsmanRequired=cfg.helmsmanRequired;changed=true;}
  }
  return changed;
}

function getActiveAutoGenWeek(now=new Date()){
  // Model setmanal: la setmana de sortides s'obre dissabte a les 08:00
  // i correspon al dilluns/dimecres/divendres següents. Si durant la setmana
  // alguna sortida faltava, es crea igualment en obrir l'app.
  const ref=new Date(now);
  const dow=ref.getDay(); // 0=Dg, 1=Dl, ..., 6=Ds
  const minutes=ref.getHours()*60+ref.getMinutes();
  const [openH,openM]=OUTING_OPEN_RULES.autoGenHour.split(":").map(Number);
  const saturdayOpenMinutes=(openH||8)*60+(openM||0);

  // Dissabte abans de les 08:00: encara no s'obre la setmana següent.
  if(dow===6&&minutes<saturdayOpenMinutes)return null;

  const noon=dateAtLocalNoon(ref);
  const mon=new Date(noon);
  if(dow===6){
    // Dissabte des de les 08:00: obrim la setmana que comença dilluns.
    mon.setDate(noon.getDate()+2);
  }else if(dow===0){
    // Diumenge: encara estem dins la finestra oberta dissabte per al dilluns següent.
    mon.setDate(noon.getDate()+1);
  }else{
    // Dilluns-divendres: setmana en curs.
    mon.setDate(noon.getDate()-(dow-1));
  }
  const wed=new Date(mon);wed.setDate(mon.getDate()+2);
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const start=new Date(mon);start.setDate(mon.getDate()-2);start.setHours(openH||8,openM||0,0,0);
  const end=new Date(fri);end.setHours(23,59,59,999);
  return {
    mon,wed,fri,start,end,
    monStr:isoDate(mon),wedStr:isoDate(wed),friStr:isoDate(fri),
    dates:[isoDate(mon),isoDate(wed),isoDate(fri)]
  };
}

function autoOutingHasActivity(o){
  return safeArr(o.signups).length||safeArr(o.waitlist).length||safeArr(o.helmsmanSignups).length;
}

function pruneAutoOutingsOutsideWeek(week){
  // Neteja conservadora: només elimina sortides automàtiques buides fora de la setmana activa.
  // Si hi ha algú apuntat, en espera o com a timoner, es conserva sempre.
  const validDates=new Set(week?.dates||[]);
  const before=S.outings.length;
  S.outings=S.outings.filter(o=>{
    if(!o.isAuto)return true;
    if(autoOutingHasActivity(o))return true;
    if(validDates.has(o.date))return true;
    return false;
  });
  return S.outings.length!==before;
}

function generateAutoOutingsForWeekCycle(now=new Date()){
  const week=getActiveAutoGenWeek(now);
  let changed=false;
  const generated=[];

  if(pruneAutoOutingsOutsideWeek(week))changed=true;
  if(!week){
    store.set("ldm:lastAutoGen",isoDate(now));
    return {changed,generated,week:null};
  }

  const base=Date.now();
  let counter=0;

  const ensureGroupDay=(ds,day)=>{
    S.groups.forEach(g=>{
      const t=GROUP_TIMES[g.id]||"09:00";
      let existing=S.outings.find(o=>o.date===ds&&Number(o.groupId)===Number(g.id)&&!isGeneralOuting(o));
      const cfg=OUTING_CONFIG[g.id]?.[day]||{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false};
      if(!existing){
        S.outings.push({
          id:base+(counter++),
          groupId:g.id,
          openAllGroups:false,
          title:gname(g.id).split(" · ")[0]||`Grup ${g.id}`,
          date:ds,time:t,
          capacity:cfg.capacity,
          reserve:cfg.reserve,
          helmsmen:cfg.helmsmen,
          helmsmanRequired:cfg.helmsmanRequired,
          helmsmanSignups:[],
          isOpen:false,signups:[],waitlist:[],isAuto:true
        });
        generated.push(`${day} ${ds}`);
        changed=true;
      }else if(existing.isAuto){
        existing.openAllGroups=false;
        if(!existing.time){existing.time=t;changed=true;}
        if(ensureAutoOutingFields(existing,cfg))changed=true;
      }
    });
  };

  // Dilluns i dimecres: una sortida reservada inicialment per a cada grup.
  ensureGroupDay(week.monStr,"Dl");
  ensureGroupDay(week.wedStr,"Dc");

  // Divendres: dues sortides generals, directament per a tots els grups.
  FRIDAY_GENERAL_TIMES.forEach(time=>{
    let existing=S.outings.find(o=>o.date===week.friStr&&isGeneralOuting(o)&&normalizeTimeStr(o.time)===normalizeTimeStr(time));
    if(!existing){
      // Compatibilitat amb possibles sortides antigues de divendres ja marcades com automàtiques.
      existing=S.outings.find(o=>o.isAuto&&o.date===week.friStr&&(o.title||"").includes("Dv")&&normalizeTimeStr(o.time)===normalizeTimeStr(time));
      if(existing){
        existing.groupId=0;
        existing.openAllGroups=true;
        changed=true;
      }
    }
    if(!existing){
      S.outings.push({
        id:base+(counter++),
        groupId:0,
        openAllGroups:true,
        title:"Sortida oberta",
        date:week.friStr,time,
        capacity:FRIDAY_GENERAL_CONFIG.capacity,
        reserve:FRIDAY_GENERAL_CONFIG.reserve,
        helmsmen:FRIDAY_GENERAL_CONFIG.helmsmen,
        helmsmanRequired:FRIDAY_GENERAL_CONFIG.helmsmanRequired,
        helmsmanSignups:[],isOpen:false,signups:[],waitlist:[],isAuto:true
      });
      generated.push(`Dv ${week.friStr} ${time}`);
      changed=true;
    }else if(existing.isAuto||isGeneralOuting(existing)){
      existing.groupId=0;
      existing.openAllGroups=true;
      existing.title=existing.title||"Sortida oberta";
      if(ensureAutoOutingFields(existing,FRIDAY_GENERAL_CONFIG))changed=true;
    }
  });

  store.set("ldm:lastAutoGen",isoDate(now));
  return {changed,generated,week};
}

function generateAutoOutingsForNextWeek(now=new Date()){
  return generateAutoOutingsForWeekCycle(now);
}

function shouldRunAutoGenOutings(now=new Date()){
  // Revisem sempre en obrir l'app: si ja existeix la setmana activa, no duplica res.
  return true;
}

function maybeAutoGenOutings(){
  const now=new Date();
  if(!shouldRunAutoGenOutings(now))return;
  const info=generateAutoOutingsForWeekCycle(now);
  if(info.changed){
    save("outings");
    const weekTxt=info.week?`${info.week.monStr}–${info.week.friStr}`:"pendent de dissabte 08:00";
    console.log("✅ Sortides automàtiques revisades/generades per cicle setmanal",weekTxt,info.generated);
  }
}

// ── Inicialització amb Supabase ───────────────────────────────────────────────
async function initApp(){
  clearDemoLocalStorage(); // Neteja dades de demo si existeixen
  const session=store.get("ldm:session");
  if(session?.role==="patron"){
    Object.assign(S,{role:"patron",loginStep:"choose"});
  } else if(session?.memberId){
    const m=S.membres.find(x=>x.id===session.memberId&&!x.pending&&x.pin);
    let ok=false;
    if(m&&session.pinHash&&m.pin===session.pinHash)ok=true;
    if(m&&ok){
      m.sections=normalizeSections(m.sections);
      Object.assign(S,{
        role:m.isCap?"cap":"soci",
        capGroupId:m.isCap?m.groupId:null,
        memberId:m.id,userName:m.name,
        userGroupId:m.groupId,userSections:m.sections,
        loginStep:"choose",
        section:m.sections.includes("competicio")?"competicio":"social"
      });
    } else {
      store.set("ldm:session",null);
    }
  }
  render(); // ← L'usuari ja veu l'app amb les dades del localStorage

  fetchMeteo(); // ← En paral·lel, sense bloquejar

  // ── 2. Sincronització Supabase en segon pla ────────────────────────────────
  try{
    const {data,error}=await supa
      .from("app_data")
      .select("key,value")
      .in("key",SUPA_KEYS.map(k=>"ldm:"+k));

    if(!error&&data&&data.length){
      let changed=applySupabaseRows(data,{renderNow:false});
      console.log("✅ Supabase sincronitzat ("+data.length+" claus)");

      // Migracions lleugeres (ara que tenim les dades fresques)
      let membresChanged=normalizeAllMemberSections();
      try{if(await migrateMemberPins())membresChanged=true;}catch(e){}
      if(membresChanged)save("membres");
      if(normalizeAllOutingEntries())save("outings");

      // Valida sessió activa contra dades fresques de Supabase
      if(session?.memberId){
        const m=S.membres.find(x=>x.id===session.memberId&&!x.pending&&x.pin);
        let ok=false;
        if(m&&session.pinHash&&m.pin===session.pinHash)ok=true;
        if(m&&!ok&&session.pin){
          try{
            if(await memberPinMatches(m,session.pin)){
              store.set("ldm:session",{role:m.isCap?"cap":"soci",memberId:m.id,pinHash:m.pin,authVersion:SECURITY_VERSION});
              ok=true;
            }
          }catch(e){}
        }
        if(m&&ok){
          m.sections=normalizeSections(m.sections);
          Object.assign(S,{
            role:m.isCap?"cap":"soci",
            capGroupId:m.isCap?m.groupId:null,
            memberId:m.id,userName:m.name,
            userGroupId:m.groupId,userSections:m.sections,
          });
        } else if(session?.memberId&&S.role!=="patron"){
          store.set("ldm:session",null);
          Object.assign(S,{role:null,loginStep:"choose",memberId:null,userName:""});
        }
      }

      maybeAutoGenOutings();
      if(changed){S.supaLoading=false;render();}
      else{S.supaLoading=false;render();}
    } else if(error){
      console.warn("⚠️ Error Supabase, usant dades locals:",error.message);
      S.supaLoading=false;render();
    }
  }catch(e){
    console.warn("⚠️ Supabase no disponible, mode offline:",e.message);
    S.supaLoading=false;render();
  }

  setupRealtimeSync();
  setupForegroundRefresh();

  // ── Refresc automàtic cada 60s com a xarxa de seguretat ───────────────────
  setInterval(()=>refreshFromSupabase({renderNow:true,silent:true}),60000);
}

let realtimeChannel=null;
function setupRealtimeSync(){
  try{
    if(realtimeChannel)return;
    realtimeChannel=supa.channel("ldm-app-data")
      .on("postgres_changes",{event:"*",schema:"public",table:"app_data"},payload=>{
        const row=payload.new||payload.old||{};
        const key=String(row.key||"");
        if(!key.startsWith("ldm:"))return;
        const short=key.replace("ldm:","");
        if(!SUPA_KEYS.includes(short))return;
        if(payload.eventType==="DELETE"){
          S[short]=DEF[short]||[];
        }else{
          S[short]=row.value??DEF[short]??[];
        }
        store.set(key,S[short]);
        S.lastSyncAt=new Date().toISOString();
        S.syncErr="";
        normalizeAllMemberSections();
        normalizeAllOutingEntries();
        render();
      })
      .subscribe(status=>{
        if(status==="SUBSCRIBED"){
          S.lastSyncAt=new Date().toISOString();
          S.syncErr="";
          render();
        }
      });
  }catch(e){
    console.warn("⚠️ Realtime no disponible:",e?.message||e);
  }
}
let lastForegroundRefreshAt=0;
function setupForegroundRefresh(){
  const maybe=()=>{
    if(document.hidden)return;
    const now=Date.now();
    if(now-lastForegroundRefreshAt<10000)return;
    lastForegroundRefreshAt=now;
    refreshFromSupabase({renderNow:true,silent:true});
  };
  document.addEventListener("visibilitychange",maybe);
  window.addEventListener("focus",maybe);
  window.addEventListener("online",()=>refreshFromSupabase({renderNow:true,silent:false}));
}

initApp();

</script>
