function renderMeteo(){
  if(S.meteoLoading)return`<div style="background:${DARK};border-radius:14px;margin:10px 14px 0;padding:16px;color:rgba(255,255,255,.5);font-size:13px">Carregant meteo del port...</div>`;

  const m=S.meteo,kn=Math.round(m.current.wind_speed_10m*.539957),strong=kn>=15;
  const days=m.daily.time.slice(0,5).map((d,i)=>{const dy=new Date(d);return`<div style="flex:1;text-align:center;font-size:10px;color:${i===0?"#fff":"rgba(255,255,255,.5)"}"><div style="${i===0?`background:${RED};border-radius:5px;padding:1px 0;font-weight:700`:""}">${DAYS[dy.getDay()]}</div><div style="font-size:13px;font-weight:${i===0?600:400};margin-top:3px">${Math.round(m.daily.temperature_2m_max[i])}°</div></div>`;}).join("");
  return`<div style="background:linear-gradient(135deg,${DARK},#122860);border-radius:14px;margin:10px 14px 0;padding:16px;color:#fff"><div style="font-size:11px;opacity:.5;margin-bottom:10px">📍 Port de Sant Feliu de Guíxols</div><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:40px;font-weight:700;line-height:1">${Math.round(m.current.temperature_2m)}°</div><div style="font-size:12px;opacity:.65;margin-top:5px">${wIcon(m.current.weathercode)} ${wDesc(m.current.weathercode)}</div></div><div style="text-align:right"><div style="font-size:10px;opacity:.5;margin-bottom:2px">Vent</div><div style="font-size:28px;font-weight:700;color:${strong?"#ff6b6b":"#7ec8e3"}">${kn} kn</div><div style="font-size:11px;opacity:.5">${wDir(m.current.wind_direction_10m)}</div></div></div><div style="display:flex;gap:4px;margin-top:14px;padding-top:12px;border-top:.5px solid rgba(255,255,255,.15)">${days}</div></div>${strong?`<div style="background:#fff0f0;border:.5px solid ${RED};border-radius:10px;margin:8px 14px 0;padding:10px 12px;display:flex;gap:8px;align-items:center">⚠️<span style="font-size:12px;color:${RED}">Vent fort (${kn} kn). Consulteu amb el patró.</span></div>`:""}`;
}

function renderCalendar(){
  const y=S.calYear,mo=S.calMonth,dim=new Date(y,mo+1,0).getDate();
  let sdow=new Date(y,mo,1).getDay();sdow=sdow===0?6:sdow-1;
  const sessDates=new Set(S.sessions.map(s=>s.date)),tod=td();
  const hdr=["Dl","Dt","Dc","Dj","Dv","Ds","Dg"].map(d=>`<div style="font-size:10px;color:${MUTED};text-align:center;padding:3px 0">${d}</div>`).join("");
  let cells="";for(let i=0;i<sdow;i++)cells+=`<div></div>`;
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,mo,d),dow=dt.getDay(),isWC=dow===3||dow===5;
    const ds=`${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const hasSess=sessDates.has(ds),isToday=ds===tod,isPast=ds<tod;
    let bg="transparent",col=isPast?"#c5c0b8":"#1a1a18",fw=400,brd="none";
    if(isWC){bg=hasSess?DARK:(isPast?"#dde5f5":"#e8edf8");col=hasSess?"#fff":(isPast?MUTED:DARK);fw=600;}
    if(isToday)brd=`2px solid ${RED}`;
    cells+=`<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:${bg};color:${col};font-size:12px;font-weight:${fw};border:${brd}">${d}</div>`;
  }
  const prev=mo===0?{m:11,y:y-1}:{m:mo-1,y:y},next=mo===11?{m:0,y:y+1}:{m:mo+1,y:y};
  return cc(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><button onclick="go({calMonth:${prev.m},calYear:${prev.y}})" style="background:none;border:none;color:${MUTED};font-size:22px;cursor:pointer;padding:0 8px">‹</button><div style="font-size:14px;font-weight:600;color:#1a1a18">${MONTHS[mo]} ${y}</div><button onclick="go({calMonth:${next.m},calYear:${next.y}})" style="background:none;border:none;color:${MUTED};font-size:22px;cursor:pointer;padding:0 8px">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${hdr}${cells}</div><div style="display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:.5px solid #f0ede6"><div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:3px;background:#e8edf8"></div><span style="font-size:10px;color:${MUTED}">Entreno Dc/Dv</span></div><div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:3px;background:${DARK}"></div><span style="font-size:10px;color:${MUTED}">Registrat</span></div></div>`);
}

function renderOutingCard(o){
  const grp=S.groups.find(g=>g.id===o.groupId),total=o.signups.length,pct=Math.round((total/o.capacity)*100),isFull=total>=o.capacity;
  const prefList=o.signups.filter(s=>s.gid===o.groupId),openList=o.signups.filter(s=>s.gid!==o.groupId);
  const isMyGroup=S.userGroupId===o.groupId||S.capGroupId===o.groupId;
  const isMyCap=S.role==="cap"&&S.capGroupId===o.groupId,isPatron=S.role==="patron";
  const amIn=S.role==="soci"&&o.signups.some(s=>s.name===S.userName&&s.gid===S.userGroupId);
  const canJoin=S.role==="soci"&&!amIn&&!isFull&&(isMyGroup||o.isOpen);
  const cantJoin=S.role==="soci"&&!amIn&&!isMyGroup&&!o.isOpen;
  const dateStr=new Date(o.date).toLocaleDateString("ca-ES",{weekday:"short",day:"numeric",month:"short"});
  const names=(arr,col)=>arr.length?arr.map(s=>`<span style="display:inline-block;background:${col};border-radius:20px;font-size:11px;padding:3px 9px;margin:2px;color:#fff;font-weight:500">${s.name}</span>`).join(""):"";
  const badge=o.isOpen?`<span style="background:#e6f4ee;color:${GREEN};font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600">🔓 Oberta</span>`:`<span style="background:#eef0fa;color:${DARK};font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600">🔒 ${grp?.name||""}</span>`;
  const acts=[];
  if(canJoin)acts.push(`<button onclick="signup(${o.id})" style="flex:1;padding:9px;background:${DARK};border:none;border-radius:8px;color:#fff;font-weight:600;font-size:13px;cursor:pointer">✋ Apuntar-me</button>`);
  if(amIn)acts.push(`<button onclick="unsignup(${o.id})" style="flex:1;padding:9px;background:transparent;border:.5px solid ${RED};border-radius:8px;color:${RED};font-weight:500;font-size:13px;cursor:pointer">Desapuntar-me</button>`);

function getUserVote(p){if(!S.userName)return null;for(const o of p.options){if(p.votes[o]?.includes(S.userName))return o;}return null;}

function renderPollCard(p){

    if(canV)return`<button onclick="castVote(${p.id},'${opt.replace(/'/g,"\\'")}','${S.userName.replace(/'/g,"\\'")}' )" style="width:100%;padding:10px 12px;background:${isMy?"#eef0fa":"#f8f9ff"};border:1.5px solid ${isMy?DARK:BORDER};border-radius:10px;cursor:pointer;text-align:left;font-size:13px;color:#1a1a18;margin-bottom:6px;font-weight:${isMy?600:400}">${opt}</button>`;

    return`<div style="padding:10px 12px;background:#f8f9ff;border:1px solid ${BORDER};border-radius:10px;font-size:13px;color:#1a1a18;margin-bottom:6px">${opt}</div>`;

  const sorted=[...S.avisos].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.date||"").localeCompare(a.date||""));
  const form=S.showAvisForm?cc(`${lbl("Nou avís del patró")}<textarea id="avis-text" placeholder="Escriu el missatge..." style="width:100%;padding:10px;border-radius:8px;border:.5px solid ${BORDER};font-size:13px;background:${BG};outline:none;box-sizing:border-box;min-height:80px;resize:vertical;margin-bottom:10px"></textarea><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><input type="checkbox" id="avis-pin" style="width:16px;height:16px;accent-color:${RED}"><label for="avis-pin" style="font-size:13px;color:#1a1a18;cursor:pointer">Fixar a dalt (important)</label></div><div style="display:flex;gap:8px"><button onclick="createAvis()" style="flex:1;padding:10px;background:${RED};border:none;border-radius:8px;color:#fff;font-weight:700;font-size:14px;cursor:pointer">Publicar</button><button onclick="go({showAvisForm:false})" style="padding:10px 14px;background:transparent;border:.5px solid ${BORDER};border-radius:8px;color:${MUTED};font-size:14px;cursor:pointer">Cancel·lar</button></div>`):"";
  const cards=sorted.map(a=>`<div style="border-radius:12px;margin:8px 14px 0;overflow:hidden;border:.5px solid ${a.pin?RED:BORDER}">${a.pin?`<div style="background:${RED};padding:4px 12px;font-size:10px;font-weight:700;color:#fff;text-transform:uppercase">📌 Avís important</div>`:`<div style="background:#f5f5f5;padding:4px 12px;font-size:10px;font-weight:600;color:${MUTED};text-transform:uppercase">📢 Avís del patró</div>`}<div style="background:#fff;padding:12px 14px"><div style="font-size:14px;color:#1a1a18;line-height:1.55;margin-bottom:8px">${a.text}</div><div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:11px;color:${MUTED}">⚓ Patró · ${a.date}</span>${S.role==="patron"?`<div style="display:flex;gap:6px"><button onclick="togglePin(${a.id})" style="background:none;border:.5px solid ${BORDER};border-radius:6px;color:${MUTED};font-size:11px;padding:3px 8px;cursor:pointer">${a.pin?"Desfiixar":"📌 Fixar"}</button><button onclick="delAvis(${a.id})" style="background:none;border:.5px solid ${BORDER};border-radius:6px;color:${RED};font-size:11px;padding:3px 8px;cursor:pointer">Eliminar</button></div>`:""}</div></div></div>`).join("");
  return(S.role==="patron"&&!S.showAvisForm?`<div style="margin:10px 14px 0"><button onclick="go({showAvisForm:true})" style="width:100%;padding:11px;background:${RED};border:none;border-radius:10px;color:#fff;font-weight:700;font-size:14px;cursor:pointer">📢 Nou avís per a tothom</button></div>`:"")+form+(sorted.length?cards:cc(`<div style="font-size:13px;color:${MUTED};text-align:center;padding:1.5rem 0">Cap avís publicat</div>`))+`<div style="height:14px"></div>`;
}

function renderMembres(){
  const byG=S.groups.map(g=>({g,ms:S.membres.filter(m=>m.groupId===g.id)})).filter(x=>x.ms.length>0);
  const form=S.showMembreForm?cc(`${lbl("Nou soci")}<input id="m-nom" placeholder="Nom i cognom *" style="width:100%;padding:9px 10px;border-radius:8px;border:.5px solid ${BORDER};font-size:13px;background:${BG};outline:none;box-sizing:border-box;margin-bottom:8px"><select id="m-grup" style="width:100%;padding:9px 10px;border-radius:8px;border:.5px solid ${BORDER};font-size:13px;background:${BG};outline:none;margin-bottom:10px">${S.groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join("")}</select><div style="margin-bottom:12px"><div style="font-size:12px;color:${MUTED};margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Seccions</div><div style="display:flex;gap:8px"><button onclick="togSec('competicio')" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid ${S.membreSections.includes('competicio')?DARK:BORDER};background:${S.membreSections.includes('competicio')?"#eef0fa":"transparent"};color:${S.membreSections.includes('competicio')?DARK:MUTED};font-size:13px;font-weight:600;cursor:pointer">🏆 Competició</button><button onclick="togSec('social')" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid ${S.membreSections.includes('social')?GREEN:BORDER};background:${S.membreSections.includes('social')?"#e6f4ee":"transparent"};color:${S.membreSections.includes('social')?GREEN:MUTED};font-size:13px;font-weight:600;cursor:pointer">⚓ Social</button></div></div><div style="display:flex;gap:8px"><button onclick="addMembre()" style="flex:1;padding:10px;background:${RED};border:none;border-radius:8px;color:#fff;font-weight:700;font-size:14px;cursor:pointer">Afegir soci</button><button onclick="go({showMembreForm:false,membreSections:['social']})" style="padding:10px 14px;background:transparent;border:.5px solid ${BORDER};border-radius:8px;color:${MUTED};font-size:14px;cursor:pointer">Cancel·lar</button></div>`):"";
  const sum=`<div style="display:flex;gap:8px;margin:10px 14px 0"><div style="flex:1;background:#fff;border-radius:12px;padding:10px;border:.5px solid ${BORDER};text-align:center"><div style="font-size:22px;font-weight:700;color:${DARK}">${S.membres.length}</div><div style="font-size:10px;color:${MUTED};margin-top:1px">Socis totals</div></div><div style="flex:1;background:#fff;border-radius:12px;padding:10px;border:.5px solid ${BORDER};text-align:center"><div style="font-size:22px;font-weight:700;color:${DARK}">${S.membres.filter(m=>m.sections.includes("competicio")).length}</div><div style="font-size:10px;color:${MUTED};margin-top:1px">🏆 Competi</div></div><div style="flex:1;background:#fff;border-radius:12px;padding:10px;border:.5px solid ${BORDER};text-align:center"><div style="font-size:22px;font-weight:700;color:${DARK}">${S.membres.filter(m=>m.sections.includes("social")).length}</div><div style="font-size:10px;color:${MUTED};margin-top:1px">⚓ Social</div></div></div>`;
  const llista=byG.map(({g,ms})=>`<div style="margin-bottom:4px"><div style="font-size:11px;font-weight:600;color:${MUTED};text-transform:uppercase;letter-spacing:.05em;margin:14px 14px 6px">${g.name} · ${ms.length} soci${ms.length!==1?"s":""}</div>${ms.map(m=>`<div style="background:#fff;border-radius:12px;margin:0 14px 6px;padding:12px 14px;border:.5px solid ${BORDER};display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:14px;font-weight:600;color:#1a1a18;margin-bottom:5px">${m.name}</div><div style="display:flex;gap:4px">${secBadge(m.sections)}</div></div><button onclick="delMembre(${m.id})" style="background:none;border:none;color:${RED};font-size:20px;cursor:pointer;padding:0 4px;line-height:1">×</button></div>`).join("")}</div>`).join("");
  return(!S.showMembreForm?`<div style="margin:10px 14px 0"><button onclick="go({showMembreForm:true})" style="width:100%;padding:11px;background:${RED};border:none;border-radius:10px;color:#fff;font-weight:700;font-size:14px;cursor:pointer">+ Afegir soci nou</button></div>`:"")+sum+form+llista+`<div style="height:14px"></div>`;
}

function render(){
  const root=document.getElementById("root");
  if(!S.role||S.loginStep!=="choose"){
    root.innerHTML=renderLogin();
    const p=document.getElementById("pin-in");
    if(p){p.focus();p.onkeydown=e=>{if(e.key==="Enter")tryPin();};}
    return;
  }
  const myGid=S.userGroupId||S.capGroupId;
  const opc=S.polls.filter(p=>!p.closed).length;
  const hasBoth=S.role==="patron"||S.role==="cap"||(S.userSections.includes("competicio")&&S.userSections.includes("social"));
  const hasC=S.role==="patron"||S.role==="cap"||S.userSections.includes("competicio");
  const hasS=S.role==="patron"||S.role==="cap"||S.userSections.includes("social");
  const nav=[["inici","🏠","Inici"],["entrena",S.section==="social"?"⛵":"🚣",S.section==="social"?"Sortides":"Entrena"],["resultats","🏆","Resultats"],["vots","📊","Vots"],S.role==="patron"?["membres","👥","Membres"]:["avisos","📢","Avisos"]];
  const screens={inici:renderInici,entrena:renderEntrena,resultats:renderResultats,vots:renderVots,membres:renderMembres,avisos:renderAvisos};
  const titles={inici:"Inici",entrena:S.section==="social"?"Sortides":"Entrenaments",resultats:"Resultats",vots:"Votacions",membres:"Membres",avisos:"Avisos"};
  const rb=S.role==="patron"?`<span style="background:${RED};color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700">PATRÓ</span>`:S.role==="cap"?`<span style="background:rgba(255,255,255,.15);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600">${gname(S.capGroupId)}</span>`:myGid?`<span style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);font-size:10px;padding:2px 8px;border-radius:20px">${S.userName}</span>`:"";
  const btnC=hasC?`<button onclick="go({section:'competicio',showForm:false})" style="flex:1;padding:7px;font-size:13px;font-weight:600;border:none;border-radius:8px;cursor:pointer;background:${S.section==="competicio"?DARK:"transparent"};color:${S.section==="competicio"?"#fff":MUTED}">🏆 Competició</button>`:"";
  const btnS=hasS?`<button onclick="go({section:'social',showForm:false})" style="flex:1;padding:7px;font-size:13px;font-weight:600;border:none;border-radius:8px;cursor:pointer;background:${S.section==="social"?DARK:"transparent"};color:${S.section==="social"?"#fff":MUTED}">⚓ Social</button>`:"";
  const st=hasBoth&&S.screen!=="vots"&&S.screen!=="membres"&&S.screen!=="avisos"?`<div style="display:flex;margin:12px 14px 0;background:#e2dfd6;border-radius:10px;padding:3px">${btnC}${btnS}</div>`:"";
  root.innerHTML=`<div style="background:linear-gradient(135deg,${DARK},#122860);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:10px"><div style="background:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:2px solid ${RED}">${emblema.replace('width="50" height="50"','width="28" height="28"')}</div><div><div style="font-size:11px;opacity:.5;letter-spacing:.05em">LLOP DE MAR</div><div style="font-size:17px;font-weight:700">${titles[S.screen]||"Inici"}</div></div></div><div style="display:flex;align-items:center;gap:8px">${rb}<button onclick="go({role:null,loginStep:'choose',showForm:false,showAvisForm:false,showMembreForm:false,userName:'',userGroupId:null,userSections:[],memberId:null,pollQ:'',pollOpts:['','']})" style="background:rgba(255,255,255,.1);border:none;border-radius:6px;color:rgba(255,255,255,.6);padding:5px 10px;font-size:12px;cursor:pointer">Sortir</button></div></div>${st}<div style="padding-bottom:70px">${(screens[S.screen]||renderInici)()}</div><div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;border-top:.5px solid ${BORDER};background:#fff;z-index:100">${nav.map(([k,ic,lb])=>`<button onclick="go({screen:'${k}',showForm:false,showAvisForm:false,showMembreForm:false})" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px 10px;cursor:pointer;font-size:9px;color:${S.screen===k?DARK:MUTED};gap:2px;border:none;background:none;font-weight:${S.screen===k?700:400};position:relative"><span style="font-size:20px">${ic}</span>${lb}${k==="vots"&&opc>0&&S.screen!=="vots"?`<span style="position:absolute;top:5px;right:calc(50% - 18px);background:${RED};color:#fff;font-size:9px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center">${opc}</span>`:""}</button>`).join("")}</div>`;
}

// Actions
function togSec(sec){const s=S.membreSections.includes(sec)?S.membreSections.filter(x=>x!==sec):[...S.membreSections,sec];go({membreSections:s});}
function addMembre(){const n=document.getElementById("m-nom")?.value?.trim()||"";if(!n||!S.membreSections.length)return;const gid=parseInt(document.getElementById("m-grup")?.value)||S.groups[0]?.id;S.membres.push({id:Date.now(),name:n,groupId:gid,sections:[...S.membreSections]});save("membres");go({showMembreForm:false,membreSections:["social"]});}
function delMembre(id){S.membres=S.membres.filter(m=>m.id!==id);save("membres");render();}
function signup(oid){const o=S.outings.find(x=>x.id===oid);if(!o||o.signups.length>=o.capacity||o.signups.some(s=>s.name===S.userName&&s.gid===S.userGroupId))return;o.signups.push({name:S.userName,gid:S.userGroupId});save("outings");render();}
function unsignup(oid){const o=S.outings.find(x=>x.id===oid);if(!o)return;o.signups=o.signups.filter(s=>!(s.name===S.userName&&s.gid===S.userGroupId));save("outings");render();}
function openOut(oid){const o=S.outings.find(x=>x.id===oid);if(o){o.isOpen=true;save("outings");render();}}
function delOut(oid){S.outings=S.outings.filter(o=>o.id!==oid);save("outings");render();}
function addOut(){const t=document.getElementById("o-title")?.value?.trim();if(!t)return;const d=document.getElementById("o-date")?.value||td();const tm=document.getElementById("o-time")?.value||"09:00";const gid=S.role==="patron"?parseInt(document.getElementById("o-group")?.value||S.groups[0]?.id):S.capGroupId;const cap=parseInt(document.getElementById("o-cap")?.value)||8;S.outings.push({id:Date.now(),groupId:gid,title:t,date:d,time:tm,capacity:cap,isOpen:false,signups:[]});save("outings");go({showForm:false});}
function addSess(){const t=document.getElementById("f-type")?.value||"";if(!t)return;S.sessions.unshift({id:Date.now(),type:t,date:document.getElementById("f-date")?.value||"",duration:parseInt(document.getElementById("f-dur")?.value)||0,km:parseFloat(document.getElementById("f-km")?.value)||0,section:"competicio",note:""});save("sessions");go({showForm:false});}
function delSess(id){S.sessions=S.sessions.filter(s=>s.id!==id);save("sessions");render();}
function addRes(){const r=document.getElementById("r-race")?.value||"";if(!r)return;S.results.unshift({id:Date.now(),race:r,date:document.getElementById("r-date")?.value||"",place:document.getElementById("r-place")?.value||"",pos:S.newPos,points:PTS[S.newPos]||10});save("results");go({showForm:false,newPos:1});}
function delRes(id){S.results=S.results.filter(r=>r.id!==id);save("results");render();}
function createAvis(){const t=document.getElementById("avis-text")?.value?.trim()||"";if(!t)return;const pin=document.getElementById("avis-pin")?.checked||false;S.avisos.unshift({id:Date.now(),text:t,date:td(),pin});save("avisos");go({showAvisForm:false});}
function delAvis(id){S.avisos=S.avisos.filter(a=>a.id!==id);save("avisos");render();}
function togglePin(id){const a=S.avisos.find(x=>x.id===id);if(a){a.pin=!a.pin;save("avisos");render();}}
function addOpt(){go({pollOpts:[...S.pollOpts,""]});}
function rmOpt(i){go({pollOpts:S.pollOpts.filter((_,j)=>j!==i)});}
function createPoll(){const q=document.getElementById("poll-q")?.value?.trim()||"";if(!q)return;const opts=S.pollOpts.map((_,i)=>document.getElementById(`opt-${i}`)?.value?.trim()||"").filter(Boolean);if(opts.length<2)return;const votes={};opts.forEach(o=>votes[o]=[]);S.polls.unshift({id:Date.now(),question:q,options:opts,votes,closed:false,date:td()});save("polls");go({showForm:false,pollQ:"",pollOpts:["",""]});}
function castVote(pid,opt,name){const p=S.polls.find(x=>x.id===pid);if(!p||p.closed||!name)return;p.options.forEach(o=>{p.votes[o]=p.votes[o].filter(n=>n!==name);});if(!p.votes[opt])p.votes[opt]=[];p.votes[opt].push(name);save("polls");render();}
function closePoll(pid){const p=S.polls.find(x=>x.id===pid);if(p){p.closed=true;save("polls");render();}}
function delPoll(pid){S.polls=S.polls.filter(p=>p.id!==pid);save("polls");render();}

// ── Inicialització amb Supabase ───────────────────────────────────────────────
async function initApp(){
  // Pantalla de càrrega
  document.getElementById("root").innerHTML=`<div style="min-height:100vh;background:linear-gradient(160deg,${DARK} 60%,#122860);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px"><div style="display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;width:80px;height:80px;border:3px solid ${RED}">${emblema}</div><div style="color:rgba(255,255,255,.6);font-size:14px;letter-spacing:.05em">Carregant dades del club...</div><div style="width:40px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden"><div id="ldg-bar" style="height:100%;width:0%;background:${RED};border-radius:2px;transition:width .4s ease"></div></div></div>`;
  const bar=document.getElementById("ldg-bar");
  if(bar)bar.style.width="30%";

  try{
    const {data,error}=await supa
      .from("app_data")
      .select("key,value")
      .in("key",SUPA_KEYS.map(k=>"ldm:"+k));

    if(bar)bar.style.width="80%";

    if(!error&&data&&data.length){
      const map={};
      data.forEach(r=>{map[r.key]=r.value;});
      // Sobreescriu les dades locals amb les de Supabase (font de veritat compartida)
      if(map["ldm:groups"])  {S.groups=map["ldm:groups"];   store.set("ldm:groups",  S.groups);}
      if(map["ldm:membres"]) {S.membres=map["ldm:membres"]; store.set("ldm:membres", S.membres);}
      if(map["ldm:avisos"])  {S.avisos=map["ldm:avisos"];   store.set("ldm:avisos",  S.avisos);}
      if(map["ldm:outings"]) {S.outings=map["ldm:outings"]; store.set("ldm:outings", S.outings);}
      if(map["ldm:sessions"]){S.sessions=map["ldm:sessions"];store.set("ldm:sessions",S.sessions);}
      if(map["ldm:results"]) {S.results=map["ldm:results"]; store.set("ldm:results", S.results);}
      if(map["ldm:polls"])   {S.polls=map["ldm:polls"];     store.set("ldm:polls",   S.polls);}
      console.log("✅ Dades carregades de Supabase ("+data.length+" claus)");
    } else if(error){
      console.warn("⚠️ Error Supabase, usant dades locals:",error.message);
    } else {
      console.log("ℹ️ Supabase buit, usant dades per defecte (primera vegada)");
    }
  }catch(e){
    console.warn("⚠️ Supabase no disponible, mode offline:",e.message);
  }

  if(bar)bar.style.width="100%";
  await new Promise(r=>setTimeout(r,200)); // petit delay per veure la barra completa
  fetchMeteo();
  render();
}

initApp();
</script>
</body>
</html>
