async function sha256Hex(text){
  if(!window.crypto?.subtle)throw new Error("Aquest navegador no suporta xifrat segur.");
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function hashPatronPin(pin){return "sha256:"+(await sha256Hex("ldm:patron:"+pin));}
async function hashMemberPin(pin,m){return "sha256:"+(await sha256Hex("ldm:member:"+m.id+":"+m.name+":"+pin));}
function isHashedPin(v){return typeof v==="string"&&/^sha256:[a-f0-9]{64}$/i.test(v);}
async function migrateMemberPins(){
  let changed=false;
  for(const m of S.membres){
    if(m.pin&&!isHashedPin(m.pin)){
      m.pin=await hashMemberPin(m.pin,m);
      changed=true;
    }
  }
  return changed;
}
async function memberPinMatches(m,pin){
  if(!m?.pin)return false;
  if(isHashedPin(m.pin))return (await hashMemberPin(pin,m))===m.pin;
  // Compatibilitat amb dades antigues: si encara hi havia clau en text pla,
  // validem una vegada, migrem a hash i desem.
  if(pin===m.pin){
    m.pin=await hashMemberPin(pin,m);
    save("membres");
    return true;
  }
  return false;
}

function normalizeSections(secs){
  const out=[];
  (Array.isArray(secs)?secs:[]).forEach(sec=>{
    if((sec==="social"||sec==="competicio")&&!out.includes(sec))out.push(sec);
  });
  // Norma del club: qualsevol soci de competició també és soci de social.
  if(out.includes("competicio")&&!out.includes("social"))out.push("social");
  return out.length?out:["social"];
}

function normalizeAllMemberSections(){
  let changed=false;
  S.membres.forEach(m=>{
    const norm=normalizeSections(m.sections);
    if(JSON.stringify(m.sections||[])!==JSON.stringify(norm)){m.sections=norm;changed=true;}
  });
  const me=S.memberId?S.membres.find(m=>m.id===S.memberId):null;
  if(me){S.userSections=normalizeSections(me.sections);}
  return changed;
}

function fetchMeteo(){
  const meteoUrl="https://api.open-meteo.com/v1/forecast?latitude=41.7833&longitude=3.0167&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code,precipitation&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_sum&timezone=Europe%2FMadrid&forecast_days=7";

  S.meteoLoading=true;S.marineLoading=true;
  Promise.allSettled([
    fetch(meteoUrl).then(r=>{if(!r.ok)throw new Error("meteo");return r.json();}),
    fetch(marineUrl).then(r=>{if(!r.ok)throw new Error("marine");return r.json();})
  ]).then(([meteo,marine])=>{
    if(meteo.status==="fulfilled")S.meteo=meteo.value;
    if(marine.status==="fulfilled")S.marine=marine.value;
    S.meteoLoading=false;S.marineLoading=false;
    if(!S.selectedMeteoDate&&S.meteo?.daily?.time?.length)S.selectedMeteoDate=firstRegularOutingDate(S.meteo.daily.time);
    render();
  }).catch(()=>{S.meteoLoading=false;S.marineLoading=false;render();});
}

const nowIso=()=>new Date().toISOString();
const mkId=()=>Date.now()+Math.floor(Math.random()*1000);
function safeArr(a){return Array.isArray(a)?a:[];}
function memberFromEntry(e){
  if(!e)return null;
  return S.membres.find(m=>e.mid&&m.id===e.mid)||S.membres.find(m=>m.name===e.name&&m.groupId===e.gid)||S.membres.find(m=>m.name===e.name)||null;
}
function entryKey(e){
  const m=memberFromEntry(e);
  if(m?.id)return "id:"+m.id;
  return "name:"+String(e?.name||"").trim().toLowerCase();
}
function entryMatchesCurrent(e){
  if(!e||!S.userName)return false;
  if(S.memberId&&e.mid)return Number(e.mid)===Number(S.memberId);
  const m=memberFromEntry(e);
  if(S.memberId&&m?.id)return Number(m.id)===Number(S.memberId);
  return String(e.name||"")===String(S.userName||"");
}
function entryMatchesPerson(e,name,gid,mid=null){
  if(!e||!name)return false;
  if(mid&&e.mid)return Number(e.mid)===Number(mid);
  const m=memberFromEntry(e);
  if(mid&&m?.id)return Number(m.id)===Number(mid);
  return String(e.name||"")===String(name||"");
}
function entrySamePerson(a,b){
  if(!a||!b)return false;
  const ak=entryKey(a),bk=entryKey(b);
  return ak&&bk&&ak===bk;
}
function normalizeOutingEntries(o){
  if(!o)return false;
  let changed=false;
  if(!Array.isArray(o.signups)){o.signups=[];changed=true;}
  if(!Array.isArray(o.waitlist)){o.waitlist=[];changed=true;}
  if(!Array.isArray(o.helmsmanSignups)){o.helmsmanSignups=[];changed=true;}
  // Migra sortides antigues sense camps de timonel/reserva
  if(o.helmsmen===undefined||o.helmsmen===null){
    const cfg=getOutingCfg(o.groupId,o.date);
    if(cfg){o.helmsmen=cfg.helmsmen;o.helmsmanRequired=cfg.helmsmanRequired;o.reserve=cfg.reserve;if(!o.capacity||o.capacity<cfg.capacity)o.capacity=cfg.capacity;}
    else{o.helmsmen=0;o.helmsmanRequired=false;o.reserve=1;}
    changed=true;
  }
  const clean=list=>{
    const seen=new Set(),out=[];
    list.forEach(e=>{
      if(!e||!e.name)return;
      const m=memberFromEntry(e);
      const n={...e};
      if(m){
        if(!n.mid){n.mid=m.id;changed=true;}
        if(!n.gid){n.gid=m.groupId;changed=true;}
      }
      const k=entryKey(n);
      if(seen.has(k)){changed=true;return;}
      seen.add(k);out.push(n);
    });
    return out;
  };
  const signups=clean(o.signups);
  const waitlist=clean(o.waitlist).filter(w=>{
    const dup=signups.some(s=>entrySamePerson(s,w));
    if(dup)changed=true;
    return !dup;
  });
  if(signups.length!==o.signups.length||waitlist.length!==o.waitlist.length)changed=true;
  o.signups=signups;o.waitlist=waitlist;
  return changed;
}
function normalizeAllOutingEntries(){
  let changed=false;
  S.outings.forEach(o=>{if(normalizeOutingEntries(o))changed=true;});
  return changed;
}
function outingLabel(o){return `${o.title} · ${new Date(o.date).toLocaleDateString("ca-ES",{weekday:"short",day:"numeric",month:"short"})} · ${o.time} h`;}
function actorLabel(){return S.role==="patron"?"Patró":(S.userName||"Sistema");}

function addPersonalAviso(o,entry,type,title,message){
  const m=memberFromEntry(entry)||{};
  pushAviso({kind:"personal",type,outingId:o.id,groupId:o.groupId,toMemberId:m.id||entry.mid||null,toName:entry.name,toGid:entry.gid,title,text:message,message,read:false});
}
function avisoAudience(a){return a.audience||a.scope||"general";}
function audienceLabel(a){const v=avisoAudience(a);return v==="competicio"?"Competició":(v==="social"?"Social":"General");}
function audienceStyle(a){const v=avisoAudience(a);if(v==="competicio")return {bg:"#eef0fa",col:DARK,ico:"🏆"};if(v==="social")return {bg:"#e6f4ee",col:GREEN,ico:"⚓"};return {bg:"#f5f5f5",col:MUTED,ico:"📢"};}
function canSeeAvis(a){
  const kind=a.kind||"public";
  if(S.role==="patron")return true;
  if(kind==="public"){
    const audience=avisoAudience(a);
    if(audience==="general")return true;
    return safeArr(S.userSections).includes(audience);
  }
  if(kind==="log")return S.role==="cap"&&S.capGroupId===a.groupId;
  if(kind==="personal")return (a.toMemberId&&a.toMemberId===S.memberId)||(!a.toMemberId&&a.toName===S.userName&&a.toGid===S.userGroupId);
  return false;
}
function unreadAvisosCount(){
  if(!S.memberId)return 0;
  return S.avisos.filter(a=>a.kind==="personal"&&!a.read&&canSeeAvis(a)).length;
}
function markAvisRead(id){const a=S.avisos.find(x=>x.id===id);if(a&&a.kind==="personal"&&canSeeAvis(a)){a.read=true;save("avisos");render();}}
function markAllAvisRead(){
  let changed=false;
  S.avisos.forEach(a=>{if(a.kind==="personal"&&!a.read&&canSeeAvis(a)){a.read=true;changed=true;}});
  if(changed)save("avisos");
  render();
}
function todayStr(){return isoDate(new Date());}
function outingStartDateTime(o){
  const [y,mo,d]=String(o?.date||"").split("-").map(Number);
  if(!y||!mo||!d)return null;
  const [hh,mm]=normalizeTimeStr(o?.time||GROUP_TIMES?.[o?.groupId]||"00:00").split(":").map(Number);
  return new Date(y,mo-1,d,Number.isFinite(hh)?hh:0,Number.isFinite(mm)?mm:0,0,0);
}
function outingPastDateTime(o){
  const start=outingStartDateTime(o);
  if(!start)return null;
  const end=new Date(start);
  end.setMinutes(end.getMinutes()+15);
  return end;
}
function isPastOuting(o){
  const pastAt=outingPastDateTime(o);
  if(!pastAt)return (o.date||"")<todayStr();
  return new Date()>=pastAt;
}
function sortOutings(a,b){return (a.date||"").localeCompare(b.date||"")||(a.time||"").localeCompare(b.time||"");}
function memberIsInOuting(o,name=S.userName,gid=S.userGroupId,mid=S.memberId){
  return safeArr(o.signups).some(s=>entryMatchesPerson(s,name,gid,mid))||safeArr(o.waitlist).some(s=>entryMatchesPerson(s,name,gid,mid))||safeArr(o.helmsmanSignups).some(s=>entryMatchesPerson(s,name,gid,mid));
}
function canSeeOuting(o){
  const isOpen=shouldBeOpen(o);
  if(S.role==="patron")return true;
  if(isGeneralOuting(o))return isOpen||memberIsInOuting(o);
  if(S.role==="cap")return o.groupId===S.capGroupId||isOpen;
  if(S.role==="soci")return o.groupId===S.userGroupId||isOpen||memberIsInOuting(o);
  return false;
}
function reconcileAllOutingWaitlists(){
  let changed=false;
  S.outings.forEach(o=>{if(reconcileOutingWaitlist(o))changed=true;});
  if(changed){save("outings");save("avisos");}
  return changed;
}
function visibleOutings(){
  reconcileAllOutingWaitlists();
  return S.outings.filter(canSeeOuting);
}
function occupancyPct(o){return o.capacity?Math.round((safeArr(o.signups).length/o.capacity)*100):0;}

  if(S.loginStep==="register-ok")return wrap(`<div style="width:100%;max-width:300px;text-align:center">

  return wrap("");

// ── Funcions d'autenticació ────────────────────────────────────────────────────
async function tryPin(){
  const v=document.getElementById("pin-in")?.value||"";
  try{
    if(await hashPatronPin(v)===PATRON_HASH){
      store.set("ldm:session",{role:"patron",authVersion:SECURITY_VERSION});
      go({role:"patron",loginStep:"choose",pinErr:false,pinErrMsg:""});
    } else {
      go({pinErr:true,pinErrMsg:"Codi incorrecte"});
    }
  }catch(e){
    go({pinErr:true,pinErrMsg:e.message||"No s'ha pogut validar la clau"});
  }
}

function selectSoci(id){
  go({selectedMemberId:id,loginStep:"soci-pin",pinErr:false,pinErrMsg:""});
}

async function tryLoginSoci(){
  const m=S.membres.find(x=>x.id===S.selectedMemberId);
  if(!m)return;
  const pin=document.getElementById("pin-in")?.value||"";
  try{
    if(!m.pin){
      // Primera vegada: creació de clau. Es guarda sempre en hash, mai en text pla.
      const pin2=document.getElementById("pin-in2")?.value||"";
      if(pin.length<MIN_PIN_LEN)return go({pinErr:true,pinErrMsg:`La clau ha de tenir mínim ${MIN_PIN_LEN} caràcters`});
      if(pin!==pin2)return go({pinErr:true,pinErrMsg:"Les claus no coincideixen"});
      m.pin=await hashMemberPin(pin,m);
      save("membres");
    } else {
      if(!(await memberPinMatches(m,pin)))return go({pinErr:true,pinErrMsg:"Clau incorrecta"});
    }
    doLoginSoci(m);
  }catch(e){
    go({pinErr:true,pinErrMsg:e.message||"No s'ha pogut validar la clau"});
  }
}

function doLoginSoci(m){
  m.sections=normalizeSections(m.sections);
  const role=m.isCap?"cap":"soci";
  store.set("ldm:session",{role,memberId:m.id,pinHash:m.pin,authVersion:SECURITY_VERSION});
  go({role,capGroupId:m.isCap?m.groupId:null,memberId:m.id,userName:m.name,
      userGroupId:m.groupId,userSections:m.sections,loginStep:"choose",
      pinErr:false,pinErrMsg:"",section:m.sections.includes("competicio")?"competicio":"social"});
}

function togRegSec(sec){
  const next=S.regSections.includes(sec)?S.regSections.filter(x=>x!==sec):[...S.regSections,sec];
  go({regSections:normalizeSections(next)});
}

async function submitRegister(){
  const nom=(document.getElementById("reg-nom")?.value||"").trim();
  const gid=parseInt(document.getElementById("reg-grup")?.value)||S.groups[0]?.id;
  const pin=document.getElementById("reg-pin")?.value||"";
  const pin2=document.getElementById("reg-pin2")?.value||"";
  if(!nom)return go({regErr:"El nom és obligatori"});
  if(!S.regSections.length)return go({regErr:"Selecciona almenys una secció"});
  if(pin.length<MIN_PIN_LEN)return go({regErr:`La clau ha de tenir mínim ${MIN_PIN_LEN} caràcters`});
  if(pin!==pin2)return go({regErr:"Les claus no coincideixen"});
  try{
    const member={id:Date.now(),name:nom,groupId:gid,sections:normalizeSections(S.regSections),pin:null,isCap:false,pending:true};
    member.pin=await hashMemberPin(pin,member);
    S.membres.push(member);
    save("membres");
    go({loginStep:"register-ok"});
  }catch(e){
    go({regErr:e.message||"No s'ha pogut crear la clau"});
  }
}

function approvePending(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m){m.sections=normalizeSections(m.sections);m.pending=false;save("membres");render();}}
function rejectPending(id){if(S.role!=="patron")return;if(!confirm("Rebutjar la sol·licitud?"))return;S.membres=S.membres.filter(m=>m.id!==id);save("membres");render();}
function resetMemberPin(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m&&confirm("Reset de clau de "+m.name+"?\nHaurà de crear una nova clau al proper accés.")){m.pin=null;save("membres");render();}}
function toggleIsCap(id){if(S.role!=="patron")return;const m=S.membres.find(x=>x.id===id);if(m){m.isCap=!m.isCap;save("membres");render();}}

function fetchMeteo(){
  const meteoUrl="https://api.open-meteo.com/v1/forecast?latitude=41.7833&longitude=3.0167&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code,precipitation&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_sum&timezone=Europe%2FMadrid&forecast_days=7";
  const marineUrl="https://marine-api.open-meteo.com/v1/marine?latitude=41.7833&longitude=3.0167&hourly=wave_height,wave_direction,wave_period,wind_wave_height,wind_wave_direction,swell_wave_height,swell_wave_direction,swell_wave_period&timezone=Europe%2FMadrid&forecast_days=7&cell_selection=sea";
  S.meteoLoading=true;S.marineLoading=true;
  Promise.allSettled([
    fetch(meteoUrl).then(r=>{if(!r.ok)throw new Error("meteo");return r.json();}),
    fetch(marineUrl).then(r=>{if(!r.ok)throw new Error("marine");return r.json();})
  ]).then(([meteo,marine])=>{
    if(meteo.status==="fulfilled")S.meteo=meteo.value;
    if(marine.status==="fulfilled")S.marine=marine.value;
    S.meteoLoading=false;S.marineLoading=false;
    if(!S.selectedMeteoDate&&S.meteo?.daily?.time?.length)S.selectedMeteoDate=firstRegularOutingDate(S.meteo.daily.time);
    render();
  }).catch(()=>{S.meteoLoading=false;S.marineLoading=false;render();});
}

// ── Helpers de UI ─────────────────────────────────────────────────────────────
function num(v,d=1){return Number.isFinite(Number(v))?Number(v).toFixed(d).replace(".0",""):"—";}
function firstVal(...vals){for(const v of vals){if(v!==undefined&&v!==null&&!Number.isNaN(Number(v)))return v;}return null;}
function weatherCodeFrom(obj){return firstVal(obj?.weather_code,obj?.weathercode);}
function meteoHourlyIndex(data,date,time){
  const times=data?.hourly?.time||[];
  const wanted=`${date}T${time}`;
  let idx=times.indexOf(wanted);
  if(idx>=0)return idx;
  let best=-1,bestDiff=9999;
  const [th,tm]=(time||"00:00").split(":").map(Number);
  const target=(th||0)*60+(tm||0);
  times.forEach((t,i)=>{
    if(!String(t).startsWith(date+"T"))return;
    const hh=Number(t.slice(11,13)),mm=Number(t.slice(14,16));
    const diff=Math.abs((hh*60+mm)-target);
    if(diff<bestDiff){best=i;bestDiff=diff;}
  });
  return best;
}
function meteoSlotLabel(time){
  const pairs=Object.entries(GROUP_TIMES||{}).map(([gid,t])=>({gid:Number(gid),time:t,name:gname(Number(gid)).split(" · ")[0]}));
  return pairs.filter(x=>x.time===time).map(x=>x.name).join(" / ")||"Sortida";
}
function seaStateLabel(h){
  const v=Number(h);
  if(!Number.isFinite(v))return "Mar no disponible";
  if(v>=1)return "Mar moguda";
  if(v>=0.6)return "Mar moderada";
  return "Mar tranquil·la";
}
function isRegularOutingDay(ds){
  const dow=parseLocalDate(ds)?.getDay();
  return dow===1||dow===3||dow===5; // dilluns, dimecres i divendres
}
function firstRegularOutingDate(days){
  return (days||[]).find(isRegularOutingDay)||(days||[])[0]||td();
}
function renderMeteo(){
  if(S.meteoLoading&&!S.meteo)return`<div style="background:${DARK};border-radius:14px;margin:10px 14px 0;padding:16px;color:rgba(255,255,255,.5);font-size:13px">Carregant meteo del port...</div>`;
  if(!S.meteo)return`<div style="background:${DARK};border-radius:14px;margin:10px 14px 0;padding:16px;color:rgba(255,255,255,.5);font-size:13px">Meteo no disponible</div>`;

  const m=S.meteo;
  const availableDays=(m.daily?.time||[]).slice(0,7);
  const outingDays=availableDays.filter(isRegularOutingDay);
  const dayList=outingDays.length?outingDays:availableDays.slice(0,5);
  let sel=S.selectedMeteoDate||firstRegularOutingDate(availableDays);
  if(dayList.length&&!dayList.includes(sel))sel=dayList[0];

  const curCode=weatherCodeFrom(m.current);
  const kn=Math.round((m.current?.wind_speed_10m||0)*.539957),strong=kn>=15;
  const selIndex=availableDays.indexOf(sel);
  const max=selIndex>=0?m.daily?.temperature_2m_max?.[selIndex]:null;
  const min=selIndex>=0?m.daily?.temperature_2m_min?.[selIndex]:null;
  const rainDay=selIndex>=0?m.daily?.precipitation_sum?.[selIndex]:null;
  const dayButtons=dayList.map((d,i)=>{
    const dy=parseLocalDate(d)||new Date(d);
    const idx=availableDays.indexOf(d);
    const isSel=d===sel;
    const maxDay=idx>=0?m.daily?.temperature_2m_max?.[idx]:null;
    const code=weatherCodeFrom({weather_code:idx>=0?m.daily?.weather_code?.[idx]:null,weathercode:idx>=0?m.daily?.weathercode?.[idx]:null});
    const label=d===td()?"Avui":DAYS[dy.getDay()];
    return`<button onclick="go({selectedMeteoDate:'${d}'})" style="flex:1;text-align:center;font-size:10px;color:${isSel?'#fff':'rgba(255,255,255,.62)'};background:${isSel?'rgba(255,255,255,.16)':'transparent'};border:${isSel?'1px solid rgba(255,255,255,.28)':'1px solid transparent'};border-radius:9px;padding:6px 3px;cursor:pointer"><div style="font-weight:800;margin-bottom:2px">${label}</div><div style="font-size:15px;line-height:1">${wIcon(code)}</div><div style="font-size:11px;font-weight:700;margin-top:2px">${maxDay!==null&&maxDay!==undefined?Math.round(maxDay)+'°':'—'}</div></button>`;
  }).join("");

  const hourSlots=["08:00","11:00","14:00","17:00","20:00"];
  const rows=hourSlots.map(t=>{
    const wi=meteoHourlyIndex(m,sel,t),mi=meteoHourlyIndex(S.marine,sel,t);
    const h=m.hourly||{},mh=S.marine?.hourly||{};
    const temp=wi>=0?h.temperature_2m?.[wi]:null;
    const wkn=wi>=0?Math.round((h.wind_speed_10m?.[wi]||0)*.539957):null;
    const wdeg=wi>=0?h.wind_direction_10m?.[wi]:null;
    const code=wi>=0?firstVal(h.weather_code?.[wi],h.weathercode?.[wi]):null;
    const rain=wi>=0?h.precipitation?.[wi]:null;
    const wh=mi>=0?mh.wave_height?.[mi]:null;
    const wdir=mi>=0?mh.wave_direction?.[mi]:null;
    const wp=mi>=0?mh.wave_period?.[mi]:null;
    const warn=(Number(wkn)>=15)||(Number(wh)>=0.8);
    return`<div style="display:flex;align-items:center;gap:7px;background:${warn?'rgba(255,107,107,.12)':'rgba(255,255,255,.075)'};border:1px solid ${warn?'rgba(255,107,107,.32)':'rgba(255,255,255,.08)'};border-radius:10px;padding:7px 8px;margin-top:6px;font-size:12px;color:rgba(255,255,255,.82);line-height:1.25">
      <div style="width:38px;font-weight:850;color:#fff;flex-shrink:0">${t.slice(0,2)}h</div>
      <div style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${wIcon(code)} ${temp!==null&&temp!==undefined?Math.round(temp)+'°':'—'} · ${wkn!==null?wkn+' kn':'—'} ${wdeg!==null?wDir(wdeg):''}${rain!==null&&rain!==undefined&&Number(rain)>0?` · 🌧️ ${num(rain,1)} mm`:''}</div>
      <div style="flex-shrink:0;text-align:right;white-space:nowrap;color:${warn?'#ffb4b4':'rgba(255,255,255,.78)'}">🌊 ${wh!==null&&wh!==undefined?num(wh,1)+' m':'—'} ${wdir!==null?wDir(wdir):''}${wp!==null&&wp!==undefined?` · ${num(wp,0)}s`:''}</div>
    </div>`;
  }).join("");

  const selDate=parseLocalDate(sel)||new Date(sel);
  const selTitle=selDate.toLocaleDateString("ca-ES",{weekday:"long",day:"numeric",month:"long"});
  const marineNote=S.marine?"":"<div style='font-size:11px;color:rgba(255,255,255,.48);margin-top:8px'>Estat del mar no disponible ara mateix.</div>";
  const daySummary=`${min!==null&&min!==undefined?Math.round(min)+'° / ':''}${max!==null&&max!==undefined?Math.round(max)+'°':''}${rainDay!==null&&rainDay!==undefined&&Number(rainDay)>0?` · Pluja ${num(rainDay,1)} mm`:''}`;

  return`<div style="background:linear-gradient(135deg,${DARK},#122860);border-radius:14px;margin:10px 14px 0;padding:14px;color:#fff">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px">
      <div><div style="font-size:11px;opacity:.55">📍 Port de Sant Feliu de Guíxols</div><div style="font-size:13px;font-weight:850;margin-top:3px">Previsió meteo i mar</div></div>
      <div style="text-align:right"><div style="font-size:10px;opacity:.55">Ara</div><div style="font-size:16px;font-weight:850;color:${strong?'#ffb4b4':'#fff'}">${Math.round(m.current?.temperature_2m??0)}° · ${kn} kn</div><div style="font-size:10px;opacity:.55">${wIcon(curCode)} ${wDir(m.current?.wind_direction_10m||0)}</div></div>
    </div>
    <div style="display:flex;gap:5px;padding-top:10px;border-top:.5px solid rgba(255,255,255,.15)">${dayButtons}</div>
    <div style="margin-top:11px"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><div style="font-size:13px;font-weight:850;text-transform:capitalize">${selTitle}</div><div style="font-size:11px;color:rgba(255,255,255,.62);white-space:nowrap">${daySummary}</div></div>${rows}${marineNote}</div>
  </div>${strong?`<div style="background:#fff0f0;border:.5px solid ${RED};border-radius:10px;margin:8px 14px 0;padding:10px 12px;display:flex;gap:8px;align-items:center">⚠️<span style="font-size:12px;color:${RED}">Vent fort (${kn} kn). Consulteu amb el patró.</span></div>`:""}`;
}


// ── Agenda comuna del club ──────────────────────────────────────────────────
const EVENT_TYPES={
  regata_competicio:{label:"Regata competició",short:"Competi",ico:"🏁",color:RED,bg:"#fff0f0"},
  regata_social:{label:"Regata social",short:"Social",ico:"🚩",color:GREEN,bg:"#e6f4ee"},
  altres:{label:"Altres",short:"Altres",ico:"📌",color:DARK,bg:"#eef0fa"}
};
function eventCfg(type){return EVENT_TYPES[type]||EVENT_TYPES.altres;}
function normalizeEventType(type){return EVENT_TYPES[type]?type:"altres";}
function allCalendarEvents(){
  const manual=safeArr(S.events).map(e=>({source:"event",...e,type:normalizeEventType(e.type)}));
  const regates=safeArr(S.results).filter(r=>r.date).map(r=>({
    id:"res-"+r.id,source:"result",type:"regata_competicio",title:r.race||"Regata",date:r.date,time:"",place:r.place||"",desc:`${POS[r.pos]||((r.pos||"")+"è")}${r.points?` · ${r.points} pts`:""}`,resultId:r.id
  }));
  return [...manual,...regates].filter(e=>e.date).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.time||"").localeCompare(b.time||"")||(a.title||"").localeCompare(b.title||""));
}
function eventsByDate(){
  const out={};
  allCalendarEvents().forEach(e=>{(out[e.date]=out[e.date]||[]).push(e);});
  return out;
}
function selectedDayEvents(date=S.selectedCalDate){return allCalendarEvents().filter(e=>e.date===date);}
function nextCalendarEvents(limit=4){return allCalendarEvents().filter(e=>(e.date||"")>=todayStr()).slice(0,limit);}
function ensureAgendaSelectedDate(){
  const current=S.selectedCalDate||td();
  const hasCurrent=selectedDayEvents(current).length>0;
  if(hasCurrent)return current;
  const next=nextCalendarEvents(1)[0];
  if(next&&(!S.selectedCalDate||S.selectedCalDate===td())){
    S.selectedCalDate=next.date;
    S.calMonth=Number(String(next.date).slice(5,7))-1;
    S.calYear=Number(String(next.date).slice(0,4));
    return next.date;
  }
  return current;
}

function renderOutingCard(o){

  if(!o.helmsmanSignups)o.helmsmanSignups=[];
  const isOpen=shouldBeOpen(o);
  const openTrigger=openTriggerReached(o);
  const hasGeneralSpots=hasOpenGeneralSpots(o);
  const cfg=getOutingCfg(o.groupId,o.date);
  const capacity=outingCapacity(o);
  const reserve=isGeneral?0:Number(o.reserve||1);
  const maxHelm=o.helmsmen||cfg?.helmsmen||0;
  const helmsRequired=o.helmsmanRequired||false;
  const total=o.signups.length;
  const isFull=total>=capacity+(isOpen?0:reserve);

  const amIn=o.signups.some(entryMatchesCurrent);
  const amWait=o.waitlist.some(entryMatchesCurrent);
  const canAccess=isGeneral?isOpen:(isMyGroup||isOpen);
  const dateStr=new Date(o.date).toLocaleDateString("ca-ES",{weekday:"short",day:"numeric",month:"short"});

    }else if(isGeneral){
      openInfo=`<div style="font-size:11px;color:#b07a10;background:#fff8ee;border-radius:7px;padding:5px 8px;margin-top:6px;display:inline-block;line-height:1.35">🔒 Programada per a ${groupLabel}. S'obrirà ${openStr} si hi ha places lliures.</div>`;
    }else{
      openInfo=`<div style="font-size:11px;color:#b07a10;background:#fff8ee;border-radius:7px;padding:5px 8px;margin-top:6px;display:inline-block;line-height:1.35">🔒 Reservada al ${groupLabel}. S'obrirà a tots ${openStr} si hi ha places lliures.</div>`;
    }
  }

  const personChips=(arr,mode="signups")=>arr.length?`<div style="display:flex;flex-wrap:wrap;gap:6px">${arr.map(s=>{
    const gid=s.gid||memberFromEntry(s)?.groupId;

      <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px">${esc(s.name)}</span>

function getUserVote(p){
  if(!S.userName)return null;
  for(const o of p.options){if((p.votes[o]||[]).includes(S.userName))return o;}
  return null;
}

function renderPollCard(p){
  p.votes=p.votes||{};
  p.options=(p.options||[]).filter(Boolean);
  p.options.forEach(o=>{if(!Array.isArray(p.votes[o]))p.votes[o]=[];});
  const mv=getUserVote(p);
  const tot=p.options.reduce((a,o)=>a+(p.votes[o]?.length||0),0);
  const counts=p.options.map(o=>p.votes[o]?.length||0);
  const maxVotes=counts.length?Math.max(...counts):0;
  const winners=p.options.filter(o=>(p.votes[o]?.length||0)===maxVotes&&maxVotes>0);
  const canVote=!p.closed&&!!S.userName;
  const status=p.closed
    ?`<span style="background:#fff0f0;color:${RED};font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap">Tancada</span>`
    :`<span style="background:#e6f4ee;color:${GREEN};font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap">Oberta</span>`;
  const userBadge=mv?`<div style="margin-top:7px;display:inline-flex;align-items:center;gap:5px;background:#eef0fa;color:${DARK};font-size:11px;font-weight:700;padding:4px 8px;border-radius:20px">✓ El teu vot: ${esc(mv)}</div>`:"";
  const rows=p.options.map((opt,optIdx)=>{
    const voters=p.votes[opt]||[];
    const cnt=voters.length;
    const pct=tot>0?Math.round((cnt/tot)*100):0;
    const isMy=mv===opt;
    const isWinner=p.closed&&winners.length===1&&winners[0]===opt;
    const isTie=p.closed&&winners.length>1&&winners.includes(opt);
    const key=pollKey(p.id,opt);
    const open=!!(S.pollVotersOpen&&S.pollVotersOpen[key]);
    const bg=isMy?"#eef0fa":"#fff";
    const br=isMy?DARK:(isWinner?RED:BORDER);
    const barCol=isWinner?RED:(isMy?DARK:"#c8d4f0");
    // Els noms dels votants NO es mostren per defecte: només apareixen en desplegar "Veure votants".
    const topVoters="", extra="";
    const expanded=open?`<div style="margin-top:8px;padding:8px 9px;background:#faf8f3;border-radius:10px;border:.5px solid #f0ede6">
      <div style="font-size:10px;color:${MUTED};font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px">Votants</div>
      ${voters.length?`<div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center">${voters.map(n=>`<span style="display:inline-flex;align-items:center;max-width:100%;background:#fff;border:.5px solid ${BORDER};border-radius:999px;color:#1a1a18;font-size:11px;font-weight:600;line-height:1.2;padding:4px 8px;white-space:nowrap">${esc(n)}</span>`).join("")}</div>`:`<div style="font-size:12px;color:${MUTED};font-style:italic">Encara no hi ha cap vot.</div>`}
    </div>`:"";
    const voteBtn=canVote?`<button onclick="event.stopPropagation();castVoteByIndex(${p.id},${optIdx})" style="margin-top:8px;width:100%;padding:8px;background:${isMy?DARK:"transparent"};border:1px solid ${isMy?DARK:BORDER};border-radius:9px;color:${isMy?"#fff":DARK};font-size:12px;font-weight:700;cursor:pointer">${isMy?"✓ Votat":"Votar aquesta opció"}</button>`:"";
    const votersBtn=`<button onclick="event.stopPropagation();togglePollVotersByIndex(${p.id},${optIdx})" style="margin-top:8px;background:transparent;border:none;color:${cnt?DARK:MUTED};font-size:11px;font-weight:700;cursor:${cnt?"pointer":"default"};padding:0" ${cnt?"":"disabled"}>${open?"Amagar votants":"Veure votants"} · ${cnt}</button>`;
    return`<div style="position:relative;overflow:hidden;margin-bottom:10px;background:${bg};border:1.5px solid ${br};border-radius:13px;padding:10px 10px 9px">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:${isMy?"rgba(27,58,122,.08)":"rgba(200,212,240,.22)"};pointer-events:none"></div>
      <div style="position:relative">
        <div style="display:flex;align-items:flex-start;gap:9px">
          <div style="width:22px;height:22px;border-radius:50%;border:1.5px solid ${isMy?DARK:BORDER};background:${isMy?DARK:"#fff"};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:1px;font-weight:700">${isMy?"✓":""}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div style="font-size:14px;font-weight:${isMy||isWinner?700:600};line-height:1.35;color:${isWinner?RED:(isMy?DARK:"#1a1a18")};word-break:break-word">${isWinner?"🏆 ":isTie?"↔️ ":""}${esc(opt)}</div>
              <div style="text-align:right;white-space:nowrap"><div style="font-size:13px;font-weight:800;color:${isWinner?RED:DARK}">${cnt}</div><div style="font-size:10px;color:${MUTED};font-weight:700">${pct}%</div></div>
            </div>
            <div style="background:#f0ede8;border-radius:20px;height:7px;overflow:hidden;margin-top:7px"><div style="background:${barCol};height:7px;border-radius:20px;width:${pct}%"></div></div>
            <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:7px">${votersBtn}</div>
            ${expanded}
            ${voteBtn}
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
  const hint=p.closed
    ?`<div style="font-size:11px;color:${MUTED};margin-bottom:10px;line-height:1.45">La votació està tancada. Els resultats queden visibles i pots desplegar els votants.</div>`
    :S.userName?`<div style="font-size:11px;color:${MUTED};margin-bottom:10px;line-height:1.45">Toca una opció per votar o canviar el vot. Els vots no són anònims.</div>`
    :`<div style="font-size:11px;color:${MUTED};margin-bottom:10px;line-height:1.45">Entra com a soci per votar. Pots veure els resultats i desplegar els votants.</div>`;
  const patronActions=S.role==="patron"?`<div style="display:flex;gap:8px;padding:10px 14px;border-top:.5px solid #f5f3ee;background:#fbfaf7">${!p.closed?`<button onclick="closePoll(${p.id})" style="flex:1;padding:8px;background:#fff;border:.5px solid ${RED};border-radius:8px;color:${RED};font-size:12px;cursor:pointer;font-weight:700">Tancar votació</button>`:""}<button onclick="delPoll(${p.id})" style="padding:8px 12px;background:#fff;border:.5px solid ${BORDER};border-radius:8px;color:${MUTED};font-size:12px;cursor:pointer">🗑</button></div>`:"";
  return`<div style="background:#fff;border-radius:15px;margin:10px 14px 0;border:.5px solid ${BORDER};overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.02)">
    <div style="padding:13px 14px 0">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px;gap:8px"><div style="font-size:15px;font-weight:800;color:#1a1a18;flex:1;line-height:1.35">${esc(p.question)}</div>${status}</div>
      <div style="font-size:11px;color:${MUTED};margin-bottom:5px">${tot} vot${tot!==1?"s":""} · ${esc(p.date||"")}</div>
      ${userBadge}
      <div style="height:10px"></div>
      ${hint}
      ${rows}
      <div style="height:3px"></div>
    </div>${patronActions}
  </div>`;
}

function renderEstadistiques(){
  const scope=S.role==="patron"?S.outings:S.role==="cap"?S.outings.filter(o=>o.groupId===S.capGroupId):S.outings.filter(o=>memberIsInOuting(o));
  const past=scope.filter(isPastOuting);
  const future=scope.filter(o=>!isPastOuting(o));
  const signups=scope.reduce((a,o)=>a+safeArr(o.signups).length,0);
  const waits=scope.reduce((a,o)=>a+safeArr(o.waitlist).length,0);
  const capTotal=scope.reduce((a,o)=>a+(o.capacity||0),0);
  const occ=capTotal?Math.round((signups/capTotal)*100):0;
  const mine=S.role==="soci"?scope.filter(o=>safeArr(o.signups).some(s=>s.name===S.userName&&s.gid===S.userGroupId)):[];
  let html=strow([[scope.length,"sortides"],[future.length,"properes"],[past.length,"històric"]]);
  html+=strow([[signups,"apuntats"],[waits,"espera"],[occ+"%","ocupació"]]);
  if(S.role==="soci"){
    html+=cc(`${lbl("La meva activitat")}<div style="font-size:14px;color:#1a1a18;line-height:1.6">Has estat apuntat/da a <strong>${mine.length}</strong> sortida${mine.length!==1?"s":""}. ${scope.length-mine.length>0?`Tens <strong>${scope.length-mine.length}</strong> sortida${scope.length-mine.length!==1?"s":""} on has estat o estàs en llista d'espera.`:""}</div>`);
  }
  if(S.role==="patron"||S.role==="cap"){
    const groups=(S.role==="patron"?S.groups:S.groups.filter(g=>g.id===S.capGroupId)).map(g=>{
      const os=S.outings.filter(o=>o.groupId===g.id);
      const s=os.reduce((a,o)=>a+safeArr(o.signups).length,0);
      const c=os.reduce((a,o)=>a+(o.capacity||0),0);
      const w=os.reduce((a,o)=>a+safeArr(o.waitlist).length,0);
      const avg=c?Math.round((s/c)*100):0;
      return {g,os,s,c,w,avg};
    });
    const rows=groups.map(x=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:.5px solid #f0ede6"><div><div style="font-size:13px;font-weight:600;color:#1a1a18">${x.g.name}</div><div style="font-size:11px;color:${MUTED}">${x.os.length} sortides · ${x.s}/${x.c||0} places · ${x.w} espera</div></div><div style="font-size:18px;font-weight:700;color:${x.avg>=80?RED:DARK}">${x.avg}%</div></div>`).join("");
    html+=cc(`${lbl(S.role==="patron"?"Ocupació per grup":"Ocupació del meu grup")}${rows||`<div style="font-size:13px;color:${MUTED};text-align:center;padding:1rem 0">Encara no hi ha dades</div>`}`);
    const count={};
    scope.forEach(o=>safeArr(o.signups).forEach(s=>{count[s.name]=(count[s.name]||0)+1;}));
    const top=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,8);
    if(top.length){
      html+=cc(`${lbl("Socis amb més assistència")} ${top.map(([n,c],i)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:${i<top.length-1?'.5px solid #f0ede6':'none'}"><span style="font-size:13px;color:#1a1a18">${n}</span><strong style="font-size:13px;color:${DARK}">${c}</strong></div>`).join("")}`);
    }
  }
  return html+`<div style="height:14px"></div>`;
}

function forceGenOutings(){
  if(S.role!=="patron")return;
  const info=generateAutoOutingsForNextWeek(new Date());
  if(info.changed){save("outings");alert(`Sortides revisades/generades: ${info.monStr}, ${info.wedStr} i ${info.friStr}`);}
  else alert(`Ja existeixen sortides per ${info.monStr}, ${info.wedStr} i ${info.friStr}`);
  render();
}

// ── Render principal ────────────────────────────────────────────────────────────
function render(){
  const root=document.getElementById("root");
  if(!root)return;
  // Pantalla de càrrega lleugera fins que Supabase hagi respost
  if(S.supaLoading){
    root.innerHTML=`<div style="min-height:100vh;background:linear-gradient(160deg,${DARK} 60%,#122860);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px"><div style="display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;width:80px;height:80px;border:3px solid ${RED}">${emblema}</div><div style="color:rgba(255,255,255,.5);font-size:13px;letter-spacing:.05em">Carregant...</div></div>`;
    return;
  }
  try{
    if(!S.role||S.loginStep!=="choose"){
      root.innerHTML=renderLogin();
      const p=document.getElementById("pin-in");
      if(p){
        p.focus();
        const fn=S.loginStep==="patron-pin"?tryPin:S.loginStep==="soci-pin"?tryLoginSoci:null;
        if(fn)p.onkeydown=e=>{if(e.key==="Enter")fn();};
      }
      const p2=document.getElementById("pin-in2");
      if(p2)p2.onkeydown=e=>{if(e.key==="Enter")tryLoginSoci();};
      return;
    }
  const myGid=S.userGroupId||S.capGroupId;
  const opc=S.polls.filter(p=>!p.closed).length;
  const pendingCount=S.role==="patron"?S.membres.filter(m=>m.pending).length:0;
  const avisUnread=unreadAvisosCount();
  // Permisos de secció: el patró veu tot; socis i caps només les seccions assignades.
  const hasC=S.role==="patron"||S.userSections.includes("competicio");
  const hasS=S.role==="patron"||S.userSections.includes("social");
  const hasBoth=hasC&&hasS;
  // Si una sessió antiga deixa un soci social a competició, el retornem a social.
  if(!hasC&&S.section==="competicio")S.section=hasS?"social":"social";
  if(!hasS&&S.section==="social")S.section=hasC?"competicio":"social";
  if(S.screen==="resultats"&&!hasC)S.screen="inici";
  const nav=[["inici","🏠","Inici",null]];
  if(hasC)nav.push(["entrena","🚣","Entrena","competicio"]);
  if(hasS)nav.push(["entrena","⛵","Sortides","social"]);
  if(hasC)nav.push(["resultats","🏆","Resultats",null]);
  nav.push(["vots","📊","Enquestes",null]);
  nav.push(["estadistiques","📈","Stats",null]);
  if(S.role==="patron")nav.push(["membres","👥","Membres",null]);
  nav.push(["avisos","📢","Avisos",null]);
  const screens={inici:renderInici,entrena:renderEntrena,resultats:hasC?renderResultats:renderInici,vots:renderVots,estadistiques:renderEstadistiques,membres:renderMembres,avisos:renderAvisos};
  const titles={inici:"Inici",entrena:S.section==="social"?"Sortides":"Entrenaments",resultats:"Resultats",vots:"Votacions",estadistiques:"Estadístiques",membres:"Membres",avisos:"Avisos"};
  const userLabel=S.role==="patron"?"Patró":(S.userName||"");
  const userSub=S.role==="cap"?`${userLabel} · Cap ${gname(S.capGroupId).split(" · ")[0]}`:userLabel;
  const rb=S.role==="patron"?`<span style="background:${RED};color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700">PATRÓ</span>`:S.role==="cap"?`<span style="background:rgba(255,255,255,.15);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600">Cap</span>`:myGid?`<span style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);font-size:10px;padding:2px 8px;border-radius:20px">${gname(myGid).split(" · ")[0]}</span>`:"";
  const btnC=hasC?`<button onclick="go({section:'competicio',showForm:false})" style="flex:1;padding:7px;font-size:13px;font-weight:600;border:none;border-radius:8px;cursor:pointer;background:${S.section==="competicio"?DARK:"transparent"};color:${S.section==="competicio"?"#fff":MUTED}">🏆 Competició</button>`:"";
  const btnS=hasS?`<button onclick="go({section:'social',showForm:false})" style="flex:1;padding:7px;font-size:13px;font-weight:600;border:none;border-radius:8px;cursor:pointer;background:${S.section==="social"?DARK:"transparent"};color:${S.section==="social"?"#fff":MUTED}">⚓ Social</button>`:"";
  const st=hasBoth&&S.screen!=="inici"&&S.screen!=="vots"&&S.screen!=="estadistiques"&&S.screen!=="membres"&&S.screen!=="avisos"?`<div style="display:flex;margin:12px 14px 0;background:#e2dfd6;border-radius:10px;padding:3px">${btnC}${btnS}</div>`:"";
  root.innerHTML=`<div style="background:linear-gradient(135deg,${DARK},#122860);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:10px;min-width:0"><div style="background:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:2px solid ${RED};flex-shrink:0">${emblema.replace('width="50" height="50"','width="28" height="28"')}</div><div style="min-width:0"><div style="font-size:11px;opacity:.5;letter-spacing:.05em">LLOP DE MAR</div><div style="font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${titles[S.screen]||"Inici"}</div>${userSub?`<div style="font-size:11px;opacity:.75;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px">👤 ${userSub}</div>`:""}</div></div><div style="display:flex;align-items:center;gap:8px;flex-shrink:0">${rb}<button onclick="doLogout()" style="background:rgba(255,255,255,.1);border:none;border-radius:6px;color:rgba(255,255,255,.6);padding:5px 10px;font-size:12px;cursor:pointer">Sortir</button></div></div>${st}<div style="padding-bottom:70px">${(screens[S.screen]||renderInici)()}</div><div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;border-top:.5px solid ${BORDER};background:#fff;z-index:100">${nav.map(([k,ic,lb,sec])=>{const isActive=S.screen===k&&(!sec||S.section===sec);const clk=sec?`go({screen:'${k}',section:'${sec}',showForm:false,showAvisForm:false,showMembreForm:false,editMemberId:null,editMemberSections:['social'],showOutingHistory:false,showEventForm:false,editEventId:null,eventErr:''})`:`go({screen:'${k}',showForm:false,showAvisForm:false,showMembreForm:false,editMemberId:null,editMemberSections:['social'],showOutingHistory:false,showEventForm:false,editEventId:null,eventErr:''})`;return`<button onclick="${clk}" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px 10px;cursor:pointer;font-size:9px;color:${isActive?DARK:MUTED};gap:2px;border:none;background:none;font-weight:${isActive?700:400};position:relative"><span style="font-size:20px">${ic}</span>${lb}${k==="vots"&&opc>0&&S.screen!=="vots"?`<span style="position:absolute;top:5px;right:calc(50% - 18px);background:${RED};color:#fff;font-size:9px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center">${opc}</span>`:""}${k==="membres"&&pendingCount>0&&S.screen!=="membres"?`<span style="position:absolute;top:5px;right:calc(50% - 18px);background:${RED};color:#fff;font-size:9px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center">${pendingCount}</span>`:""}${k==="avisos"&&avisUnread>0&&S.screen!=="avisos"?`<span style="position:absolute;top:5px;right:calc(50% - 18px);background:${GREEN};color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;padding:0 4px;border-radius:9px;display:flex;align-items:center;justify-content:center">${avisUnread}</span>`:""}</button>`}).join("")}</div>${S.showLogoutConfirm?renderLogoutModal():""}${S.showMemberAdded?renderMemberAddedModal():""}`;
  }catch(err){
    console.error("❌ Error en render():",err);
    root.innerHTML=`<div style="min-height:100vh;background:linear-gradient(160deg,${DARK} 60%,#122860);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:2rem;text-align:center"><div style="color:#fff;font-size:18px;font-weight:700">Error inesperat</div><div style="color:rgba(255,255,255,.5);font-size:13px">${err.message||"Refresca la pàgina"}</div><button onclick="location.reload()" style="background:${RED};border:none;border-radius:12px;color:#fff;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px">↻ Refresca</button></div>`;
  }
}

function signup(oid,asHelm=false){
  const o=S.outings.find(x=>x.id===oid);
  if(!o||S.role!=="soci"||isPastOuting(o))return;
  normalizeOutingEntries(o);
  if(!o.waitlist)o.waitlist=[];
  if(!o.helmsmanSignups)o.helmsmanSignups=[];
  const isGeneral=isGeneralOuting(o);
  const isMyGroup=!isGeneral&&S.userGroupId===o.groupId;
  const isOpen=shouldBeOpen(o);
  if(!isMyGroup&&!isOpen)return;
  const entry={name:S.userName,gid:S.userGroupId,mid:S.memberId};
  // No pot ser timoner i vogador alhora
  const amHelm=o.helmsmanSignups.some(entryMatchesCurrent);
  const amRower=o.signups.some(entryMatchesCurrent);
  const amWait=o.waitlist.some(entryMatchesCurrent);
  if(amHelm||amRower||amWait)return;
  if(asHelm){
    // Timoner: qualsevol del grup (o tothom si oberta)
    const maxHelm=o.helmsmen||0;
    if(!maxHelm)return;
    if(o.helmsmanSignups.length>=maxHelm)return;
    o.helmsmanSignups.push(entry);
    addOutingLog(o,"helm_signup",`${S.userName} s'apunta de timoner a ${outingLabel(o)}.`);
  } else {
    // Vogador: plaça normal o reserva (+1 per al grup)
    const maxNormal=outingCapacity(o);
    const maxWithReserve=isMyGroup?(maxNormal+(o.reserve||1)):maxNormal;
    if(o.signups.length>=maxNormal){
      if(isMyGroup&&o.signups.length<maxWithReserve){
        // Plaça de reserva del grup
        o.signups.push({...entry,isReserve:true});
        addOutingLog(o,"signup_reserve",`${S.userName} ocupa la plaça de reserva de ${outingLabel(o)}.`);
      } else {
        // Llista d'espera (prioritat grup)
        o.waitlist.push(entry);
        addOutingLog(o,"waitlist_join",`${S.userName} entra a la llista d'espera de ${outingLabel(o)}.`);
      }
    } else {
      o.signups.push(entry);
      addOutingLog(o,"signup",`${S.userName} s'apunta a ${outingLabel(o)}.`);
    }
  }
  save("outings");save("avisos");render();
}
function unsignup(oid){
  const o=S.outings.find(x=>x.id===oid);
  if(!o||S.role!=="soci"||isPastOuting(o))return;
  normalizeOutingEntries(o);
  if(!o.waitlist)o.waitlist=[];
  if(!o.helmsmanSignups)o.helmsmanSignups=[];
  const wasHelm=o.helmsmanSignups.some(entryMatchesCurrent);
  const wasIn=o.signups.some(entryMatchesCurrent);
  const wasWait=o.waitlist.some(entryMatchesCurrent);
  o.helmsmanSignups=o.helmsmanSignups.filter(s=>!entryMatchesCurrent(s));
  o.signups=o.signups.filter(s=>!entryMatchesCurrent(s));
  o.waitlist=o.waitlist.filter(s=>!entryMatchesCurrent(s));
  if(wasHelm)addOutingLog(o,"helm_unsignup",`${S.userName} es desapunta de timoner de ${outingLabel(o)}.`);
  if(wasIn)addOutingLog(o,"unsignup",`${S.userName} es desapunta de ${outingLabel(o)}.`);
  if(wasWait)addOutingLog(o,"waitlist_leave",`${S.userName} surt de la llista d'espera de ${outingLabel(o)}.`);
  // Si allibera plaça de vogador, primer es respecta la llista d'espera del grup.
  // La resta de la llista només puja si la sortida ja està oberta a tothom.
  if(wasIn){reconcileOutingWaitlist(o);}
  save("outings");save("avisos");render();
}
function patronAddMember(oid){
  if(S.role!=="patron")return;
  const o=S.outings.find(x=>x.id===oid);
  if(!o)return;
  const mid=parseInt(document.getElementById(`patron-add-mid-${oid}`)?.value);
  const role=document.getElementById(`patron-add-role-${oid}`)?.value||"rower";
  if(!mid)return;
  const m=S.membres.find(x=>x.id===mid);
  if(!m)return;
  if(!o.helmsmanSignups)o.helmsmanSignups=[];
  const entry={name:m.name,gid:m.groupId,mid:m.id};
  const alreadyIn=o.signups.some(s=>s.mid===m.id||s.name===m.name);
  const alreadyHelm=o.helmsmanSignups.some(s=>s.mid===m.id||s.name===m.name);
  const alreadyWait=o.waitlist.some(s=>s.mid===m.id||s.name===m.name);
  if(alreadyIn||alreadyHelm||alreadyWait)return;
  if(role==="helm"){
    if(o.helmsmanSignups.length>=(o.helmsmen||0))return alert("Ja hi ha el màxim de timonels");
    o.helmsmanSignups.push(entry);
    addOutingLog(o,"helm_signup_patron",`El patró apunta ${m.name} de timoner a ${outingLabel(o)}.`);
  } else {
    o.signups.push(entry);
    addOutingLog(o,"signup_patron",`El patró apunta ${m.name} a ${outingLabel(o)}.`);
  }
  save("outings");save("avisos");go({patronAddOuting:null});
}

function patronRemoveMember(oid,mid,fromHelm=false){
  if(S.role!=="patron")return;
  const o=S.outings.find(x=>x.id===oid);
  if(!o)return;
  if(fromHelm){
    o.helmsmanSignups=o.helmsmanSignups.filter(s=>s.mid!==mid&&s.name!==S.membres.find(x=>x.id===mid)?.name);
    addOutingLog(o,"helm_unsignup_patron",`El patró desapunta el timoner (id:${mid}) de ${outingLabel(o)}.`);
  } else {
    const m=S.membres.find(x=>x.id===mid);
    const name=m?.name;
    o.signups=o.signups.filter(s=>s.mid!==mid&&s.name!==name);
    addOutingLog(o,"unsignup_patron",`El patró desapunta ${name||mid} de ${outingLabel(o)}.`);
    // Promou de la llista d'espera si cal: primer el grup; la resta només si ja és oberta.
    reconcileOutingWaitlist(o);
  }
  save("outings");save("avisos");render();
}
function openOut(oid){
  const o=S.outings.find(x=>x.id===oid);
  if(!o||isPastOuting(o))return;
  normalizeOutingEntries(o);
  const isPatron=S.role==="patron";
  const isOwnCap=!isGeneralOuting(o)&&S.role==="cap"&&S.capGroupId===o.groupId;
  if(!isPatron&&!isOwnCap)return;
  const changed=reconcileOutingWaitlist(o);
  if(!hasOpenGeneralSpots(o)){
    if(changed){save("outings");save("avisos");render();}
    alert(hasGroupWaitlist(o)?"Abans d'obrir a tothom cal respectar la llista d'espera del grup.":"No es pot obrir a tothom perquè no hi ha places lliures.");
    return;
  }
  if(!o.isOpen){
    o.isOpen=true;
    addOutingLog(o,"outing_opened",`${actorLabel()} obre a tothom la inscripció de ${outingLabel(o)}.`);
    reconcileOutingWaitlist(o);
    save("outings");save("avisos");render();
  }
}

// ── Sortides automàtiques i obertura natural ─────────────────────────────────
const GROUP_TIMES={1:"20:15",2:"19:00",3:"17:45",4:"16:30",5:"09:15",6:"08:00"};
const FRIDAY_GENERAL_TIMES=["17:30","18:45"];
const FRIDAY_GENERAL_CONFIG={capacity:12,reserve:0,helmsmen:4,helmsmanRequired:false};

// Les sortides de cada setmana s'obren dissabte a les 08:00 i es mantenen fins que s'acaba aquella setmana.
// Si durant la setmana falta alguna sortida, la revisió la crea en obrir l'app.
const OUTING_OPEN_RULES={
  autoGenHour:"08:00",
  morningCutoffHour:10,
  morning:{dayOffset:-1,hour:"20:00"},      // sortides abans de les 10:00 → vigília 20:00
  afternoon:{dayOffset:0,hour:"07:30"},     // sortides de tarda/vespre → mateix dia 07:30
  fridayGeneral:{dayOffset:-4,hour:"07:30"} // sortides obertes de divendres → dilluns 07:30
};

// Configuració per grup i dia (dow: 1=Dl, 3=Dc). Els divendres són sortides generals.
// capacity: places de vogador base
// reserve: +1 plaça reserva per al grup
// helmsmen: places de timoner
// helmsmanRequired: si cal timoner per sortir
const OUTING_CONFIG={
  1:{Dl:{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false},
     Dc:{capacity:8,reserve:1,helmsmen:2,helmsmanRequired:true}},
  2:{Dl:{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false},
     Dc:{capacity:8,reserve:1,helmsmen:2,helmsmanRequired:true}},
  3:{Dl:{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false},
     Dc:{capacity:8,reserve:1,helmsmen:2,helmsmanRequired:true}},
  4:{Dl:{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false},
     Dc:{capacity:8,reserve:1,helmsmen:2,helmsmanRequired:true}},
  5:{Dl:{capacity:16,reserve:1,helmsmen:2,helmsmanRequired:true},
     Dc:{capacity:16,reserve:1,helmsmen:1,helmsmanRequired:true}},
  6:{Dl:{capacity:8,reserve:1,helmsmen:1,helmsmanRequired:true},
     Dc:{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false}},
};

function normalizeTimeStr(t){
  const parts=String(t||"").replace(".",":").split(":");
  const h=Number(parts[0]||0),m=Number(parts[1]||0);
  return `${String(Number.isFinite(h)?h:0).padStart(2,"0")}:${String(Number.isFinite(m)?m:0).padStart(2,"0")}`;
}
function isGeneralOuting(o){return !!o?.openAllGroups||Number(o?.groupId)===0;}
function isFridayGeneralOuting(o){
  const d=parseLocalDate(o?.date);
  return !!o&&d?.getDay()===5&&isGeneralOuting(o)&&FRIDAY_GENERAL_TIMES.includes(normalizeTimeStr(o.time));
}
function getOutingCfg(groupId,dateStr){
  const dow=parseLocalDate(dateStr)?.getDay();
  if(Number(groupId)===0&&dow===5)return FRIDAY_GENERAL_CONFIG;
  const day=dow===1?"Dl":dow===3?"Dc":null;
  return (day&&OUTING_CONFIG[groupId])?OUTING_CONFIG[groupId][day]:null;
}

function outingTimeParts(o){
  const raw=String(o?.time||GROUP_TIMES[o?.groupId]||"00:00").replace(".",":");
  const [h,m]=(raw||"00:00").split(":").map(Number);
  return {h:Number.isFinite(h)?h:0,m:Number.isFinite(m)?m:0};
}
function naturalOpenRule(o){
  if(isFridayGeneralOuting(o))return OUTING_OPEN_RULES.fridayGeneral;
  const {h}=outingTimeParts(o);
  return h<OUTING_OPEN_RULES.morningCutoffHour?OUTING_OPEN_RULES.morning:OUTING_OPEN_RULES.afternoon;
}
function getNaturalOpenDate(o){
  // Dilluns/dimecres tenen obertura natural per grup; divendres és una sortida general.
  const cfg=getOutingCfg(o.groupId,o.date);
  if(!cfg)return null;
  const outingDate=parseLocalDate(o.date);
  if(!outingDate)return null;
  const rule=naturalOpenRule(o);
  const openDate=new Date(outingDate);
  openDate.setDate(openDate.getDate()+rule.dayOffset);
  const [hh,mm]=(rule.hour||"07:30").split(":").map(Number);
  openDate.setHours(hh,mm,0,0);
  return openDate;
}
function formatHHMM(d){return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}
function formatNaturalOpenLabel(o){
  const openDate=getNaturalOpenDate(o);
  if(!openDate)return "quan el cap o el patró l'obrin";
  const diff=daysBetweenDates(openDate,new Date());
  const hora=formatHHMM(openDate);
  if(diff===0)return `avui a les ${hora}`;
  if(diff===1)return `demà a les ${hora}`;
  if(diff===-1)return `ahir a les ${hora}`;
  return `${openDate.toLocaleDateString("ca-ES",{weekday:"short",day:"numeric",month:"short"})} a les ${hora}`;
}

function outingCapacity(o){
  const cfg=getOutingCfg(o?.groupId,o?.date);
  return Number(o?.capacity||cfg?.capacity||8);
}
function waitEntryGroupId(w){
  return Number(w?.gid||memberFromEntry(w)?.groupId||0);
}
function waitEntryBelongsToGroup(w,o){
  if(isGeneralOuting(o))return false;
  return waitEntryGroupId(w)===Number(o?.groupId||0);
}
function hasGroupWaitlist(o){
  if(isGeneralOuting(o))return false;
  return safeArr(o?.waitlist).some(w=>waitEntryBelongsToGroup(w,o));
}
function hasOpenGeneralSpots(o){
  // Sortides generals: només cal que hi hagi plaça. Sortides de grup: primer es respecta la llista del grup.
  return safeArr(o?.signups).length<outingCapacity(o)&&!hasGroupWaitlist(o);
}

function openTriggerReached(o){
  if(o?.isOpen)return true; // obertura manual del cap/patró
  const openDate=getNaturalOpenDate(o);
  return openDate?new Date()>=openDate:false;
}

// Calcula si una sortida està oberta a tots ara mateix.
// Regla: només i sempre que ja toqui obrir-la, hi hagi places lliures i no hi hagi llista del grup pendent.
function shouldBeOpen(o){
  return openTriggerReached(o)&&hasOpenGeneralSpots(o);
}

// Llista d'espera amb prioritat de grup. Si groupOnly=true, només puja gent del grup de la sortida.
function promoteFromWaitlist(o,groupOnly=false){
  if(!o.waitlist||!o.waitlist.length)return false;
  const spotsLeft=outingCapacity(o)-safeArr(o.signups).length;
  if(spotsLeft<=0)return false;
  const own=safeArr(o.waitlist).filter(w=>waitEntryBelongsToGroup(w,o));
  const others=safeArr(o.waitlist).filter(w=>!waitEntryBelongsToGroup(w,o));
  const candidates=groupOnly?own:[...own,...others];
  const promoted=candidates[0];
  if(!promoted)return false;
  o.waitlist=o.waitlist.filter(w=>!entrySamePerson(w,promoted));
  o.signups.push({...promoted,isReserve:false});
  addPersonalAviso(o,promoted,"waitlist_promoted","Has entrat a la sortida",`S'ha alliberat una plaça i has entrat automàticament a ${outingLabel(o)}.`);
  addOutingLog(o,"waitlist_promoted",`${promoted.name} entra automàticament des de la llista d'espera a ${outingLabel(o)}.`);
  return true;
}

function reconcileOutingWaitlist(o){
  if(!o||isPastOuting(o))return false;
  normalizeOutingEntries(o);
  let changed=false;
  // 1) Sortides de grup: sempre que hi hagi plaça base, primer pugen els socis del grup de la sortida.
  while(safeArr(o.signups).length<outingCapacity(o)&&hasGroupWaitlist(o)){
    if(!promoteFromWaitlist(o,true))break;
    changed=true;
  }
  // 2) La resta de la llista només puja si la sortida ja ha arribat a l'obertura general
  //    o si el cap/patró l'ha oberta manualment. En divendres general, és ordre d'inscripció.
  while(safeArr(o.signups).length<outingCapacity(o)&&openTriggerReached(o)&&safeArr(o.waitlist).length>0){
    if(!promoteFromWaitlist(o,false))break;
    changed=true;
  }
  return changed;
}

// Data local YYYY-MM-DD. Evita el desplaçament d'un dia que pot provocar toISOString()
// quan el navegador està en zona Europe/Madrid a primera hora del dia.
function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dateAtLocalNoon(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12,0,0,0);}
function daysBetweenDates(a,b){
  const da=dateAtLocalNoon(a), db=dateAtLocalNoon(b);
  return Math.round((da-db)/86400000);
}
function parseLocalDate(ds){
  const [y,m,d]=(ds||"").split("-").map(Number);
  return y&&m&&d?new Date(y,m-1,d,12,0,0,0):null;
}
function nextWeekRegularDates(now){
  const ref=dateAtLocalNoon(now);
  const dow=ref.getDay();
  let daysToMon=(8-dow)%7;
  if(daysToMon===0)daysToMon=7;
  const mon=new Date(ref); mon.setDate(ref.getDate()+daysToMon);
  const wed=new Date(mon); wed.setDate(mon.getDate()+2);
  const fri=new Date(mon); fri.setDate(mon.getDate()+4);
  return {mon,wed,fri,monStr:isoDate(mon),wedStr:isoDate(wed),friStr:isoDate(fri)};
}
function nextWeekMonWed(now){
  // Compatibilitat amb codi antic: ara també calculem divendres amb nextWeekRegularDates().
  const {mon,wed,monStr,wedStr}=nextWeekRegularDates(now);
  return {mon,wed,monStr,wedStr};
}

function ensureAutoOutingFields(o,cfg){
  let changed=false;
  if(!Array.isArray(o.signups)){o.signups=[];changed=true;}
  if(!Array.isArray(o.waitlist)){o.waitlist=[];changed=true;}
  if(!Array.isArray(o.helmsmanSignups)){o.helmsmanSignups=[];changed=true;}
  if(cfg){
    if(o.capacity!==cfg.capacity){o.capacity=cfg.capacity;changed=true;}
    if(o.reserve!==cfg.reserve){o.reserve=cfg.reserve;changed=true;}
    if(o.helmsmen!==cfg.helmsmen){o.helmsmen=cfg.helmsmen;changed=true;}
    if(o.helmsmanRequired!==cfg.helmsmanRequired){o.helmsmanRequired=cfg.helmsmanRequired;changed=true;}
  }
  return changed;
}

function getActiveAutoGenWeek(now=new Date()){
  // Model setmanal: la setmana de sortides s'obre dissabte a les 08:00
  // i correspon al dilluns/dimecres/divendres següents. Si durant la setmana
  // alguna sortida faltava, es crea igualment en obrir l'app.
  const ref=new Date(now);
  const dow=ref.getDay(); // 0=Dg, 1=Dl, ..., 6=Ds
  const minutes=ref.getHours()*60+ref.getMinutes();
  const [openH,openM]=OUTING_OPEN_RULES.autoGenHour.split(":").map(Number);
  const saturdayOpenMinutes=(openH||8)*60+(openM||0);

  // Dissabte abans de les 08:00: encara no s'obre la setmana següent.
  if(dow===6&&minutes<saturdayOpenMinutes)return null;

  const noon=dateAtLocalNoon(ref);
  const mon=new Date(noon);
  if(dow===6){
    // Dissabte des de les 08:00: obrim la setmana que comença dilluns.
    mon.setDate(noon.getDate()+2);
  }else if(dow===0){
    // Diumenge: encara estem dins la finestra oberta dissabte per al dilluns següent.
    mon.setDate(noon.getDate()+1);
  }else{
    // Dilluns-divendres: setmana en curs.
    mon.setDate(noon.getDate()-(dow-1));
  }
  const wed=new Date(mon);wed.setDate(mon.getDate()+2);
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const start=new Date(mon);start.setDate(mon.getDate()-2);start.setHours(openH||8,openM||0,0,0);
  const end=new Date(fri);end.setHours(23,59,59,999);
  return {
    mon,wed,fri,start,end,
    monStr:isoDate(mon),wedStr:isoDate(wed),friStr:isoDate(fri),
    dates:[isoDate(mon),isoDate(wed),isoDate(fri)]
  };
}

function autoOutingHasActivity(o){
  return safeArr(o.signups).length||safeArr(o.waitlist).length||safeArr(o.helmsmanSignups).length;
}

function pruneAutoOutingsOutsideWeek(week){
  // Neteja conservadora: només elimina sortides automàtiques buides fora de la setmana activa.
  // Si hi ha algú apuntat, en espera o com a timoner, es conserva sempre.
  const validDates=new Set(week?.dates||[]);
  const before=S.outings.length;
  S.outings=S.outings.filter(o=>{
    if(!o.isAuto)return true;
    if(autoOutingHasActivity(o))return true;
    if(validDates.has(o.date))return true;
    return false;
  });
  return S.outings.length!==before;
}

function generateAutoOutingsForWeekCycle(now=new Date()){
  const week=getActiveAutoGenWeek(now);
  let changed=false;
  const generated=[];

  if(pruneAutoOutingsOutsideWeek(week))changed=true;
  if(!week){
    store.set("ldm:lastAutoGen",isoDate(now));
    return {changed,generated,week:null};
  }

  const base=Date.now();
  let counter=0;

  const ensureGroupDay=(ds,day)=>{
    S.groups.forEach(g=>{
      const t=GROUP_TIMES[g.id]||"09:00";
      let existing=S.outings.find(o=>o.date===ds&&Number(o.groupId)===Number(g.id)&&!isGeneralOuting(o));
      const cfg=OUTING_CONFIG[g.id]?.[day]||{capacity:8,reserve:1,helmsmen:0,helmsmanRequired:false};
      if(!existing){
        S.outings.push({
          id:base+(counter++),
          groupId:g.id,
          openAllGroups:false,
          title:`Sortida setmanal · ${day}`,
          date:ds,time:t,
          capacity:cfg.capacity,
          reserve:cfg.reserve,
          helmsmen:cfg.helmsmen,
          helmsmanRequired:cfg.helmsmanRequired,
          helmsmanSignups:[],
          isOpen:false,signups:[],waitlist:[],isAuto:true
        });
        generated.push(`${day} ${ds}`);
        changed=true;
      }else if(existing.isAuto){
        existing.openAllGroups=false;
        if(!existing.time){existing.time=t;changed=true;}
        if(ensureAutoOutingFields(existing,cfg))changed=true;
      }
    });
  };

  // Dilluns i dimecres: una sortida reservada inicialment per a cada grup.
  ensureGroupDay(week.monStr,"Dl");
  ensureGroupDay(week.wedStr,"Dc");

  // Divendres: dues sortides generals, directament per a tots els grups.
  FRIDAY_GENERAL_TIMES.forEach(time=>{
    let existing=S.outings.find(o=>o.date===week.friStr&&isGeneralOuting(o)&&normalizeTimeStr(o.time)===normalizeTimeStr(time));
    if(!existing){
      // Compatibilitat amb possibles sortides antigues de divendres ja marcades com automàtiques.
      existing=S.outings.find(o=>o.isAuto&&o.date===week.friStr&&(o.title||"").includes("Dv")&&normalizeTimeStr(o.time)===normalizeTimeStr(time));
      if(existing){
        existing.groupId=0;
        existing.openAllGroups=true;
        changed=true;
      }
    }
    if(!existing){
      S.outings.push({
        id:base+(counter++),
        groupId:0,
        openAllGroups:true,
        title:`Sortida oberta · Dv ${time}`,
        date:week.friStr,time,
        capacity:FRIDAY_GENERAL_CONFIG.capacity,
        reserve:FRIDAY_GENERAL_CONFIG.reserve,
        helmsmen:FRIDAY_GENERAL_CONFIG.helmsmen,
        helmsmanRequired:FRIDAY_GENERAL_CONFIG.helmsmanRequired,
        helmsmanSignups:[],isOpen:false,signups:[],waitlist:[],isAuto:true
      });
      generated.push(`Dv ${week.friStr} ${time}`);
      changed=true;
    }else if(existing.isAuto||isGeneralOuting(existing)){
      existing.groupId=0;
      existing.openAllGroups=true;
      existing.title=existing.title||`Sortida oberta · Dv ${time}`;
      if(ensureAutoOutingFields(existing,FRIDAY_GENERAL_CONFIG))changed=true;
    }
  });

  store.set("ldm:lastAutoGen",isoDate(now));
  return {changed,generated,week};
}

function generateAutoOutingsForHorizon(now=new Date(),horizonDays=7){
  // Compatibilitat amb versions anteriors: ara el sistema és setmanal, no de dies mòbils.
  return generateAutoOutingsForWeekCycle(now);
}

function generateAutoOutingsForNextWeek(now=new Date()){
  return generateAutoOutingsForWeekCycle(now);
}

function shouldRunAutoGenOutings(now=new Date()){
  // Revisem sempre en obrir l'app: si ja existeix la setmana activa, no duplica res.
  return true;
}

function maybeAutoGenOutings(){
  const now=new Date();
  if(!shouldRunAutoGenOutings(now))return;
  const info=generateAutoOutingsForWeekCycle(now);
  if(info.changed){
    save("outings");
    const weekTxt=info.week?`${info.week.monStr}–${info.week.friStr}`:"pendent de dissabte 08:00";
    console.log("✅ Sortides automàtiques revisades/generades per cicle setmanal",weekTxt,info.generated);
  }
}

// ── Inicialització amb Supabase ───────────────────────────────────────────────
async function initApp(){
  clearDemoLocalStorage(); // Neteja dades de demo si existeixen
  const session=store.get("ldm:session");
  if(session?.role==="patron"){
    Object.assign(S,{role:"patron",loginStep:"choose"});
  } else if(session?.memberId){
    const m=S.membres.find(x=>x.id===session.memberId&&!x.pending&&x.pin);
    let ok=false;
    if(m&&session.pinHash&&m.pin===session.pinHash)ok=true;
    if(m&&ok){
      m.sections=normalizeSections(m.sections);
      Object.assign(S,{
        role:m.isCap?"cap":"soci",
        capGroupId:m.isCap?m.groupId:null,
        memberId:m.id,userName:m.name,
        userGroupId:m.groupId,userSections:m.sections,
        loginStep:"choose",
        section:m.sections.includes("competicio")?"competicio":"social"
      });
    } else {
      store.set("ldm:session",null);
    }
  }
  render(); // ← L'usuari ja veu l'app amb les dades del localStorage

  fetchMeteo(); // ← En paral·lel, sense bloquejar

  // ── 2. Sincronització Supabase en segon pla ────────────────────────────────
  try{
    const {data,error}=await supa
      .from("app_data")
      .select("key,value")
      .in("key",SUPA_KEYS.map(k=>"ldm:"+k));

    if(!error&&data&&data.length){
      const map={};
      data.forEach(r=>{map[r.key]=r.value;});
      let changed=false;
      const keys=["groups","membres","avisos","outings","sessions","results","polls"];
      keys.forEach(k=>{
        if(map["ldm:"+k]){S[k]=map["ldm:"+k];store.set("ldm:"+k,S[k]);changed=true;}
      });
      console.log("✅ Supabase sincronitzat ("+data.length+" claus)");

      // Migracions lleugeres (ara que tenim les dades fresques)
      let membresChanged=normalizeAllMemberSections();
      try{if(await migrateMemberPins())membresChanged=true;}catch(e){}
      if(membresChanged)save("membres");
      if(normalizeAllOutingEntries())save("outings");

      // Valida sessió activa contra dades fresques de Supabase
      if(session?.memberId){
        const m=S.membres.find(x=>x.id===session.memberId&&!x.pending&&x.pin);
        let ok=false;
        if(m&&session.pinHash&&m.pin===session.pinHash)ok=true;
        if(m&&!ok&&session.pin){
          try{
            if(await memberPinMatches(m,session.pin)){
              store.set("ldm:session",{role:m.isCap?"cap":"soci",memberId:m.id,pinHash:m.pin,authVersion:SECURITY_VERSION});
              ok=true;
            }
          }catch(e){}
        }
        if(m&&ok){
          m.sections=normalizeSections(m.sections);
          Object.assign(S,{
            role:m.isCap?"cap":"soci",
            capGroupId:m.isCap?m.groupId:null,
            memberId:m.id,userName:m.name,
            userGroupId:m.groupId,userSections:m.sections,
          });
        } else if(session?.memberId&&S.role!=="patron"){
          store.set("ldm:session",null);
          Object.assign(S,{role:null,loginStep:"choose",memberId:null,userName:""});
        }
      }

      maybeAutoGenOutings();
      if(changed){S.supaLoading=false;render();}
      else{S.supaLoading=false;render();}
    } else if(error){
      console.warn("⚠️ Error Supabase, usant dades locals:",error.message);
      S.supaLoading=false;render();
    }
  }catch(e){
    console.warn("⚠️ Supabase no disponible, mode offline:",e.message);
    S.supaLoading=false;render();
  }

  // ── Refresc automàtic cada 60s ────────────────────────────────────────────
  setInterval(async()=>{
    try{
      const {data,error}=await supa.from("app_data").select("key,value").in("key",SUPA_KEYS.map(k=>"ldm:"+k));
      if(!error&&data&&data.length){
        const map={};data.forEach(r=>{map[r.key]=r.value;});
        let changed=false;
        ["groups","membres","avisos","outings","sessions","results","polls"].forEach(k=>{
          if(map["ldm:"+k]){S[k]=map["ldm:"+k];store.set("ldm:"+k,S[k]);changed=true;}
        });
        if(changed)render();
      }
    }catch(e){/* silenciós en offline */}
  },60000);
}

initApp();

</script>
